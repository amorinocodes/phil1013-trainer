<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amorino's PHIL1013 Exam Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* stone, parchment and papyrus, with ochre and pastel pigments */
  --bg:#ebe6dc; --panel:#f8f4ec; --ink:#3b3630; --muted:#857d71; --line:#d9d1c3;
  --accent:#d9b44a; --accent-ink:#3b3630; --accent-soft:#f6ebc6;
  --good:#8fae8b; --good-soft:#e3ecdd; --bad:#c98f86; --bad-soft:#f3e0dc;
  --sky:#b9cbd6; --lav:#cfc4dc; --stone:#a9a297;
  --shadow:0 1px 2px rgba(60,50,35,.05),0 6px 18px rgba(60,50,35,.07);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#24221f;--panel:#2e2b27;--ink:#ece4d4;--muted:#a89e8e;--line:#423d36;--accent:#e2c264;--accent-ink:#2a2723;--accent-soft:#3d3524;--good:#9dbb98;--good-soft:#2c3529;--bad:#d29a91;--bad-soft:#3b2b28;--sky:#7f95a3;--lav:#958aa6;--stone:#6f685f;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;
  background-image:radial-gradient(rgba(120,105,80,.06) 1px,transparent 1px);background-size:18px 18px}
header{max-width:960px;margin:0 auto;padding:28px 20px 8px}
header::after{content:"";display:block;height:10px;margin-top:16px;opacity:.55;
  background:repeating-linear-gradient(90deg,var(--stone) 0 2px,transparent 2px 12px),linear-gradient(var(--stone),var(--stone));
  background-size:12px 10px,100% 2px;background-repeat:repeat-x,no-repeat;background-position:0 0,0 100%}
h1::before{content:"\0391 \039B \0397 \0398 \0395 \0399 \0391";display:block;font-family:Fraunces,Georgia,serif;font-size:12px;letter-spacing:.35em;color:var(--accent);margin-bottom:6px;font-weight:500}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
nav{max-width:960px;margin:16px auto 0;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:960px;margin:0 auto;padding:18px 20px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--good);color:var(--accent-ink)}
.btn.bad{background:var(--bad);color:var(--accent-ink)}
.chip.on{color:var(--ink)!important}
.chips .chip:nth-child(3n+2).on{background:#e8eff3;border-color:var(--sky)}
.chips .chip:nth-child(3n).on{background:#ece6f2;border-color:var(--lav)}
@media (prefers-color-scheme: dark){.chips .chip:nth-child(3n+2).on{background:#2b343a}.chips .chip:nth-child(3n).on{background:#332e3a}}
.stat:nth-child(4n+1){border-top:4px solid var(--accent)}
.stat:nth-child(4n+2){border-top:4px solid var(--sky)}
.stat:nth-child(4n+3){border-top:4px solid var(--good)}
.stat:nth-child(4n){border-top:4px solid var(--lav)}
nav button.on{background:var(--ink);color:var(--panel)}
.face.back{background:var(--accent-soft)}
.btn:disabled{opacity:.4;cursor:default}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{perspective:1200px;margin:14px 0 16px;cursor:pointer;user-select:none}
.card-in{position:relative;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:26px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.face .q{font-family:Fraunces,Georgia,serif;font-size:22px;line-height:1.35}
.face .a{font-size:16px}
.face .tag{position:absolute;top:14px;left:18px;font-size:12px;color:var(--muted)}
.face .hint{position:absolute;bottom:12px;right:16px;font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.stat b{font-size:15px}
.stat small{color:var(--muted)}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 14px;border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.qtext{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.35;margin:8px 0 0}
.score{font-family:Fraunces,Georgia,serif;font-size:40px;margin:6px 0}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.timer{font-family:Fraunces,Georgia,serif;font-size:28px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
ol.outline{padding-left:20px;margin:8px 0}
ol.outline li{margin:6px 0}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.muted{color:var(--muted)}
.esq{display:grid;gap:8px;margin-top:12px}
.esq button{text-align:left}
.kbd{font-size:12px;color:var(--muted);margin-top:8px}
.hide{display:none}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.split{grid-template-columns:1fr}.face .q{font-size:19px}}

#ham{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#ham img{width:84px;height:auto;cursor:pointer;pointer-events:auto;filter:drop-shadow(0 4px 8px rgba(60,50,35,.18));transition:transform .2s;user-select:none;-webkit-user-drag:none;animation:hamIdle 3.2s ease-in-out infinite}
#ham img:hover{transform:scale(1.06) rotate(-4deg)}
#ham .bubble{pointer-events:auto;max-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:13px;line-height:1.4;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
#ham .bubble.show{opacity:1;transform:none}
#ham .count{display:block;font-size:11px;color:var(--muted);margin-top:4px}
@keyframes hamIdle{0%,100%{translate:0 0}50%{translate:0 -3px}}
@keyframes hamHop{0%{transform:translateY(0)}30%{transform:translateY(-26px) rotate(-8deg)}55%{transform:translateY(0) rotate(4deg)}70%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes hamSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes hamShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-5deg)}40%{transform:translateX(6px) rotate(5deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#ham img.hop{animation:hamHop .6s ease}
#ham img.spin{animation:hamSpin .7s ease}
#ham img.shake{animation:hamShake .5s ease}
@media (max-width:720px){#ham img{width:64px}#ham .bubble{max-width:170px}}
@media (prefers-reduced-motion: reduce){#ham img,#ham img.hop,#ham img.spin,#ham img.shake{animation:none}}

.xp{max-width:960px;margin:12px auto 0;padding:0 20px}
.xp-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.xp-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
.xp-rank{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:16px}
.face{border-left:8px solid var(--wc,var(--line))}
.face.front{background:linear-gradient(135deg,color-mix(in srgb,var(--wc) 18%,var(--panel)),var(--panel) 60%)}
.face.back{background:color-mix(in srgb,var(--wc) 26%,var(--panel));border-color:var(--wc)}
.face .sym{position:absolute;right:18px;top:6px;font-family:Fraunces,Georgia,serif;font-size:64px;line-height:1;color:var(--wc);opacity:.35;pointer-events:none}
.face .tag{background:color-mix(in srgb,var(--wc) 35%,transparent);color:var(--ink);padding:2px 9px;border-radius:99px}
.chip.wk.on{background:color-mix(in srgb,var(--wc) 35%,var(--panel))!important;border-color:var(--wc)!important}
.chip.wk{border-left:5px solid var(--wc)}
.stat{border-top:5px solid var(--wc)!important}
.qpanel{border-top:6px solid var(--wc)}
.qtag{display:inline-block;background:color-mix(in srgb,var(--wc) 35%,transparent);padding:2px 9px;border-radius:99px}
.mgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mt{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 12px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;transition:opacity .3s,background .2s}
.mt.term{border-left:6px solid var(--wc)}
.mt small{display:block;font-size:11px;color:var(--muted)}
.mt.sel{outline:2px solid var(--accent);outline-offset:1px}
.mt.ok{background:color-mix(in srgb,var(--wc) 40%,var(--panel));border-color:var(--wc);opacity:.55;cursor:default}
.mt.bad{background:var(--bad-soft);border-color:var(--bad)}
.mt.shake{animation:hamShake .4s ease}
.laurels{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.laurels span{position:absolute;top:-30px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:.2}}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:13px;color:var(--ink);background:var(--accent-soft);padding:3px 10px;border-radius:99px}
@media (max-width:720px){.mgrid{grid-template-columns:1fr}}

.sumnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--wc);background:var(--panel);color:var(--ink);font-family:Fraunces,Georgia,serif;font-size:17px;cursor:pointer}
.dot.on{background:var(--wc)}
.sum{position:relative;border-top:8px solid var(--wc);background:linear-gradient(160deg,color-mix(in srgb,var(--wc) 16%,var(--panel)),var(--panel) 45%);overflow:hidden}
.sum h2{font-family:Fraunces,Georgia,serif;font-size:28px;margin:4px 0 8px}
.sum .sym.big{position:absolute;right:20px;top:4px;font-family:Fraunces,Georgia,serif;font-size:110px;line-height:1;color:var(--wc);opacity:.3;pointer-events:none}
.bigidea{font-size:17px;line-height:1.5;margin:0 0 16px;max-width:680px}
.sumgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
ol.keys{padding-left:20px;margin:8px 0}
ol.keys li{margin:7px 0}
ol.keys li::marker{color:var(--wc);font-weight:700}
ul.who{list-style:none;padding:0;margin:8px 0}
ul.who li{margin:6px 0;padding-left:10px;border-left:3px solid var(--wc)}
.cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cites span{background:color-mix(in srgb,var(--wc) 30%,var(--panel));padding:4px 10px;border-radius:99px;font-size:13px}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.step{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 12px;border-radius:12px;font:inherit;cursor:pointer}
.step:hover{border-color:var(--wc)}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--wc);display:grid;place-items:center;font-weight:700}
.step small{display:block;color:var(--muted);font-size:12px}
.step.done{background:color-mix(in srgb,var(--wc) 25%,var(--panel))}
@media (max-width:720px){.sumgrid{grid-template-columns:1fr}.path{grid-template-columns:1fr 1fr}.sum .sym.big{font-size:80px}}

.who-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:3px 10px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.modal{position:fixed;inset:0;z-index:80;background:rgba(40,34,26,.45);display:grid;place-items:center;padding:20px}
.modal .panel{width:min(440px,100%);position:relative}
.modal h3{font-family:Fraunces,Georgia,serif;font-size:22px;margin:0 0 6px}
.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);margin:8px 0}
.plist{display:grid;gap:6px;margin:10px 0}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.prow.on{border-color:var(--accent);background:var(--accent-soft)}
.prow small{color:var(--muted)}
.codebox{width:100%;min-height:90px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);word-break:break-all}
.msg{font-size:13px;margin-top:6px}
.x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}

.search{margin:0 0 12px}
.notes{position:relative;border-top:8px solid var(--wc,var(--accent));overflow:hidden}
.notes h2{font-family:Fraunces,Georgia,serif;font-size:28px;margin:4px 0 10px}
.notes .sym.big{position:absolute;right:20px;top:4px;font-family:Fraunces,Georgia,serif;font-size:110px;line-height:1;color:var(--wc);opacity:.25;pointer-events:none}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px;position:relative}
.md{line-height:1.65;font-size:15px}
.md h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:30px 0 8px;padding-top:12px;border-top:2px solid color-mix(in srgb,var(--wc) 50%,transparent);scroll-margin-top:16px}
.md h3{font-family:Fraunces,Georgia,serif;font-size:18px;margin:20px 0 6px}
.md p,.md li{max-width:760px}
.md li{margin:5px 0}
.md strong{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--wc) 40%,transparent) 60%)}
.md blockquote{margin:12px 0;padding:10px 14px;border-left:4px solid var(--wc);background:color-mix(in srgb,var(--wc) 14%,var(--panel));border-radius:0 10px 10px 0}
.md table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.md th{background:color-mix(in srgb,var(--wc) 25%,var(--panel))}
.md tr:nth-child(even) td{background:color-mix(in srgb,var(--wc) 6%,transparent)}
.hitsec{border-left:6px solid var(--wc);padding:10px 14px;margin:0 0 14px;border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--wc) 10%,var(--panel))}
.hithead{margin-bottom:8px}
.hit{font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.hit mark{background:color-mix(in srgb,var(--accent) 55%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.hitsec .btn{margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Amorino's PHIL1013 Exam Trainer</h1>
  <p class="sub">Society, Knowledge and Self. Weeks 5 to 13. Flashcards, quick quizzes and timed essay drills.</p>
</header>
<div class="xp"><div class="xp-box" id="xp"></div></div>
<nav id="nav">
  <button data-v="summary" class="on">Summaries</button>
  <button data-v="notes">Notes</button>
  <button data-v="cards">Flashcards</button>
  <button data-v="quiz">Quiz</button>
  <button data-v="match">Match</button>
  <button data-v="essay">Essay drill</button>
  <button data-v="progress">Progress</button>
</nav>
<main>
  <section id="v-summary"></section>
  <section id="v-notes" class="hide"></section>
  <section id="v-cards" class="hide"></section>
  <section id="v-quiz" class="hide"></section>
  <section id="v-match" class="hide"></section>
  <section id="v-essay" class="hide"></section>
  <section id="v-progress" class="hide"></section>
</main>

<script>
const DECK = {
"Week 5": [
["What two problems does Arendt take from the Eichmann case?","Conceptual: define a new kind of evil that does not depend on the doer's intention. Legal: work out how such evil can be judged in law."],
["What does \"banality\" describe in \"the banality of evil\": the deed or the doer?","The doer. The Holocaust is not banal; Eichmann's shallowness is."],
["What is Arendt's specific charge against Eichmann?","Thoughtlessness: an inability to think from another's standpoint, shielded by cliché and the general climate of opinion."],
["What is the shallow reading of banality, and why does the lecture reject it?","Evil done for petty motives like career. Rejected because it just swaps diabolical intentions for ordinary ones and stays inside the category of intention."],
["What is theodicy?","The vindication of God's goodness in view of evil (theos, god; dikē, justice). Broadly, any scheme that lets us place evil and carry on."],
["What did the Lisbon earthquake (1755) do to the concept of evil?","It shook deism and led us to deny nature has moral meaning, so evil was confined to human intentions and wills."],
["Why does Eichmann break the post Lisbon settlement?","He produced more evil with less malice than ever before, so the intention criterion of evil fails."],
["What did the Israeli court say about distance and responsibility?","Responsibility generally increases the further you are from the person who uses the fatal instrument with his own hands (247)."],
["What do Eichmann's last words show?","Even facing his own death he reached for funeral oratory clichés, contradicting himself: language used to insulate himself from reality."],
["What are Arendt's three lessons?","Enormous crime without enormous malice; deep responsibility despite physical remoteness; knowing evil insulated by cliché, conformity and thoughtlessness."],
["What is the difference between philosophy and sophistry for Plato?","Sophistry is persuasive speech aimed at winning; philosophy is reason and argument aimed at truth."],
["Define a priori and a posteriori knowledge.","A priori: by reflection, not particular observation (maths, philosophy for Plato). A posteriori: based on particular observation and experiment."],
["What is the difference between know that and know how?","Know that is knowing a truth, shown by giving reasons in words. Know how is a skill, shown by doing something that works, like riding a bike."],
["Why is true opinion as good a guide as knowledge (Meno)?","Someone with a true belief about the road to Larissa leads you there just as well as someone who knows it."],
["What do the statues of Daedalus illustrate?","True beliefs run away unless fastened by a reasoned understanding of causes; fastened, they become knowledge and abide."],
["What is the clay analogy for?","Listing kinds of clay (or knowledge) is no answer; Socrates wants the nature of knowledge in the abstract."],
["State Plato's definition of knowledge.","True opinion combined with a rational account: truth, belief and justification, each necessary and jointly sufficient (JTB)."],
["What do the coin toss and L shaped cloud cases show?","Accidentally true belief is not knowledge; knowledge is non accidentally true belief."],
["What are Plato's two models of knowledge?","Craft (shoemaking, carpentry, knowing the way) and mathematics (geometry)."]
],
"Week 6": [
["State JTB formally.","S knows that p iff (1) p is true, (2) S believes p, (3) S is justified in believing p."],
["What are Gettier's two assumptions?","You can be justified in believing something false; justification is closed under known logical implication."],
["Run the ten coins case.","Smith justifiably believes Jones will get the job and has ten coins, so infers the man who gets the job has ten coins. Smith gets the job and has ten coins: a justified true belief that is not knowledge."],
["Run the Ford and Barcelona case.","Smith justifiably believes Jones owns a Ford, so believes Jones owns a Ford or Brown is in Barcelona. Jones has no Ford but Brown is luckily in Barcelona."],
["Why does the lecture add the stopped clock and sheep cases?","They are Gettier cases with no false premise, so the problem is not just inference from falsehood."],
["What is reflective equilibrium (Goodman)?","Adjusting definitions and cases against each other for the best fit; examples are not sacrosanct."],
["What is the paradox of inquiry?","To define knowledge we must pick out cases of it, but how can we before we have the definition?"],
["Why does demanding infallible justification fail?","It blocks Gettier cases but all our evidence is fallible, so knowledge would become almost impossible."],
["What are the two senses of justification?","Epistemic blamelessness (entitlement) and reliability (ground: objective likelihood of being right)."],
["What is the moral of the Gettier cases?","Knowing is not just being right and blameless; you also need good grounds."],
["What does the locked car case show?","You can know something (that you locked the car) without being sure of it."],
["What does the librarian Miss Tercy show?","A knower need not be aware of her good grounds; others can credit her with knowledge she would not claim."],
["What is the KK principle and how does Jean refute it?","If you know p you know that you know p. Jean knows the dates in the history quiz without knowing he knows."],
["Why does Radford think Jean knows that James I died in 1625?","It is wildly implausible he guessed so many right; he must have learned them and remembered, though he forgot learning."],
["What radical claim does the history quiz support against Plato?","Knowledge does not require belief: Jean knows p while fairly sure his answer is wrong."],
["What is the doubtful chicken sexer case?","Jack reliably sexes chicks but is made to doubt his ability, so he does not believe he is right, yet he knows."],
["Why does Plato's view that knowledge includes belief seem plausible?","Under challenge we retreat from \"I know\" to \"at least I believe\", because both involve commitment to the truth."],
["Why does \"Then you don't believe\" make no sense as a reply?","Belief needs no objectively good reasons; the natural reply is \"then you ought not to believe\"."],
["What is evidentialism and its problem?","Always have good evidence for beliefs (Clifford). It generates a vicious infinite regress of reasons for reasons."]
],
"Week 7": [
["What is the difference between an objective and a personal commitment to truth?","\"I know\" claims a public standard of good grounds; \"I believe\" only needs to satisfy oneself."],
["Complete Austin's analogy: believing is to intending as knowing is to ...","Promising."],
["What is the \"new plunge\"?","Saying \"I know\" or \"I promise\" gives others your word and entitles them to rely on you."],
["Why is knowing not at the top of the belief scale?","The top of that scale is being sure, a psychological state; knowing is a different line of business."],
["Why can't you say \"I know it, but I might be wrong\"?","Just as you can't say \"I promise, but I may fail\": you'd withdraw your word. That doesn't make knowers infallible."],
["What is Austin's point about refusing someone's \"I know\"?","It is a special form of insult: it says they cannot be relied on."],
["How is knowledge transmitted by testimony?","If S says \"I know p\" and I believe him, I know p at second hand, unless there is concrete reason to distrust him."],
["What is testimonial injustice (Miranda Fricker)?","Unjustly lowering or denying someone's credibility because of their social group (race, gender, age)."],
["What is the God and faith example?","Claim to know God exists and you face \"how do you know?\"; faith is believing without reason, a personal commitment."],
["What is a practical explication (Craig)?","Hypothesise what the concept does for us, build a concept fit for that role, then compare it with our actual concept."],
["What does Craig say the concept of knowledge is for?","To flag approved informants."],
["Name Craig's three unreliable sources of truth.","Truth by accident (Mudweiser), true lies (the twin), the double bluff (a confession with an alibi)."],
["State Nozick's tracking analysis.","S believes p; p is true; if p were false S would not believe it; if p were true S would believe it."],
["Which premise of the BIV argument does Nozick deny?","If I know I have two hands, I know I'm not a BIV (closure)."],
["Run the Jesse James case.","A bystander sees James's mask slip and knows he robbed the bank, but in a close world the mask didn't slip, so tracking says he doesn't know."],
["What is Craig's diagnosis of Nozick?","Close possible worlds are not the epistemically relevant ones; only worlds where the mask slipped matter to the inquirer."],
["What is the point of Austin's pig?","When the pig comes into view you don't gain more evidence, you just see it: knowledge is not evidence piled high."],
["How do Austin and Craig fit together?","Craig gives the function (flag informants), Austin the mechanism (giving your word in testimony)."]
],
"Week 8": [
["What did Pyrrhonists aim for, and how?","Tranquillity (ataraxia) through suspending belief, by finding equally good reasons for p and not p (equipollence)."],
["Who are dogmatists, negative dogmatists and Pyrrhonists?","Dogmatists (Plato) claim truths; negative dogmatists (Academic sceptics) claim there is no knowledge; Pyrrhonists claim nothing and keep inquiring."],
["What are the three horns of Agrippa's Trilemma?","Infinite regress, circular reasoning, and ad hoc assumption."],
["Why is the reasons regress vicious?","Entitlement to the original belief is never established, only endlessly deferred."],
["Give a virtuous regress and a virtuous circle.","Adding \"it is true that\" forever; inter definable concepts like description, fact, true proposition."],
["What does foundationalism try, and what's its problem?","Stop the regress with self justifying beliefs (the cogito); there are too few to build on."],
["What does coherentism try, and what's its problem?","Treat justification as a web; there are too many coherent sets of belief."],
["What is a default entitlement?","Being entitled to a belief as a responsible believer within shared practices, until it is appropriately challenged."],
["Give the lecture's legal analogy.","Citizens have default legal rights just by being citizens, which can be lost through treason, renunciation or crime."],
["How is a default entitlement lost and regained?","\"That's not a pig, it's a decoy\" removes it; \"it just oinked\" defeats the challenge."],
["What are Barnes's three humdrum ideas?","Don't plump for p without reason to prefer it; circular reasoning is no good; you can't reason forever."],
["What was Descartes's aim in doubting?","Methodological scepticism: find absolutely certain foundations (scientia) for the new science."],
["What did Descartes call ancient scepticism?","\"Stale cabbage\"."],
["State the meditator's argument.","If I KNOW I have hands I KNOW I'm not dreaming; I don't KNOW I'm not dreaming; so I don't KNOW I have hands."],
["What is the difference between ordinary and metaphysical doubt?","Ordinary doubt is local and checkable (the optometrist); metaphysical doubt is global and can't be checked without begging the question."],
["What are the three essential features of the cogito?","First person, present tense, and mental acts only (not \"I drink\")."],
["Why does Descartes need God?","To guarantee that clear and distinct certainties are true and that the senses are largely reliable."],
["How does ancient scepticism differ from modern?","Ancient is a way of life aiming at tranquillity; modern is an intellectual position doubting the external world while keeping the mind."]
],
"Week 9": [
["Who founded American pragmatism, and what inspired it?","Peirce, James and Dewey, inspired by Darwin, prioritising practice and the agent's view."],
["Why does Peirce focus on belief rather than knowledge?","To get clear on belief and doubt first, setting aside the need to show knowledge worthy grounds."],
["State Peirce's convergence theory of truth.","Truth is the opinion fated to be agreed by all who investigate; its object is the real."],
["What is belief, and what is doubt, for Peirce?","Belief is a calm habit of action; doubt is an irritating, paralysing wavering that drives inquiry."],
["What is the method of tenacity and its problem?","Clinging to your view and ignoring the rest (the ostrich); others no less reasonable disagree."],
["What is the method of authority and its problem?","An institution imposes belief; we become intellectual slaves and see other cultures believe differently."],
["What is the a priori method and its problem?","Free metaphysical reasoning; systems become a matter of taste with no way to settle disputes."],
["Why is the scientific method best?","It alone fits the realist hypothesis of a mind independent reality and separates right from wrong ways to truth."],
["What is Neurath's boat?","Revising beliefs is like repairing a boat at sea: you fix planks while relying on the rest."],
["What is paper doubt?","Pretended philosophical doubt with no real reason; real doubt needs a positive reason."],
["Quote Peirce's line against Descartes.","\"Let us not pretend to doubt in philosophy what we do not doubt in our hearts.\""],
["What is a pro tanto reason?","A reason that counts in favour of an action but can be outweighed."],
["What is wrong with the desire satisfaction theory of wellbeing?","Some desires, if satisfied, wreck your wellbeing, such as spending everything now and leaving your future self poor."],
["Distinguish numerical and qualitative identity.","Numerical: one and the same thing (Clark Kent and Superman). Qualitative: exactly alike (identical twins)."],
["What is endurantism?","The very same object exists wholly at different times."],
["What is the soul view of personal identity?","You are your immaterial soul; you survive just in case it does."],
["What is Weirob's chocolates argument?","You learn swirl means caramel by biting chocolates; you can never \"bite into\" a soul, so same body can't show same soul."],
["What is the Blue River argument?","You recognise the river by similar water, yet it's different water each time; similar psychology doesn't require the same soul."],
["What is the HAZON point?","An undetectable thing separate from my body and mind is not something I'd identify with or care about."]
],
"Week 10": [
["Run the doubled teletransporter case.","It makes two of you at A and C, both to be tortured; you'd still pay $500 to prevent it for prudential reasons."],
["Why can't you be identical with both A and C?","Identity is transitive: if you = A and you = C then A = C, but they are two people."],
["What follows about identity and prudence?","You still have prudential reason with no future self identical with you, so identity does not ground prudence."],
["What is the problem of change for identity?","Freddie is tired at t and not tired at t1; identical things share all properties."],
["What is perdurantism?","People are extended in time by having numerically distinct temporal parts, like spatial parts."],
["What is psychological connectedness?","Direct similarity of beliefs, memories, values and plans between nearby selves; it comes in degrees."],
["Why is connectedness not enough to make a self?","You're barely connected to your 8 month old self, and more connected to the person next to you."],
["What is psychological continuity?","Overlapping chains of connectedness linking selves; it does not come in degrees."],
["What do the two views say about the brain wipe?","Psychological: I wake in the new body. Bodily: my mind was erased and I stay in the wiped body."],
["What do the two views say about teletransportation?","Psychological: you survive. Bodily: you die and a clone is made."],
["What is the non branching clause?","Continuity only counts as identity if it doesn't branch into two, which seems ad hoc."]
],
"Week 11": [
["Why does psychological similarity alone fail?","An evil scientist's twin or a 7000 year fluke duplicate shares your psychology but isn't you."],
["What fixes it?","Require causal connection: the duplicate's memory of swimming wasn't caused by your swimming."],
["Why can't the whole perduring self be the seat of decision?","It has inconsistent beliefs and desires (raining and not raining), so it can't deliberate; the current little self does."],
["What is the savings problem?","A 5 minute self won't see the savings, and being parts of one whole, like parts of a university, gives no prudential reason."],
["What is Humeanism about reasons?","Your reasons depend on your desires and beliefs; desires are not rational or irrational."],
["What two sources of reasons does a current self have to care about future selves?","Anticipation of their experiences, and projects that need a consortium of selves."],
["Why does self vs other become a difference of degree?","I can have the same kind of reason to promote your future wellbeing; I'm just more connected to my own selves."],
["What is constitutive reductionism (Parfit)?","A person is distinct from body and experiences but consists in them, like a statue and its bronze."],
["What is an empty question?","One we can't answer though we know all the facts, such as whether the 50% replaced person is me."],
["What is Relation R?","Psychological continuity and connectedness, which Parfit says is what matters."],
["State Parfit's argument from below.","Identity just consists in other facts; only those facts can matter; so identity can't matter in itself."],
["What is realism about importance?","What matters is reality, not how it is described; whether he is \"me\" adds no fact."],
["Run My Division.","Each half of my brain goes into a new body; both are like me, neither can be me, yet nothing that matters is missing."],
["What is the triplets analogy?","Children who need a twin are fine as triplets; what matters is a sibling, as what matters is continuity, not identity."],
["What are Kind's extreme and moderate claims?","Extreme: reductionism gives no reason for special concern. Moderate: Relation R does give such reason."],
["What is Kind's principle (C)?","Theories of personal identity are relevant to justifying special concern, but needn't justify it."],
["How does Kind split Wolf's question?","Q1n: why care for my present self? Q2n: why care for my future self? Identity theory bears on Q2n."]
],
"Week 12": [
["What are Dennett's three location principles?","Where Hamlet (body) goes; where Yorick (brain) goes; wherever he thinks he is (his point of view)."],
["Who is Hubert?","A computer duplicate of Dennett's brain run in parallel, switchable with Yorick to drive Fortinbras."],
["How does Dennett's story end?","He flips the switch and the other Dennett speaks: the brains had drifted out of sync and the other was trapped."],
["What is Parfit's Complex vs Simple View?","Complex: identity consists in continuities, like ships or nations. Simple: identity is a further, all or nothing fact."],
["What is the Equal Concern Claim?","A rational person should be equally concerned about all parts of his future (Sidgwick)."],
["What is Parfit's principle (B)?","When an important relation holds to a lesser degree, it is not irrational to think it less important."],
["Why is Parfit's discount rate not about time?","It tracks weakening connectedness, so it barely applies over 5 minutes or 5 days, only over decades."],
["What does Parfit suggest morality should do?","Annex what prudence abandons: it may be wrong to burden your future self for smaller gains now."],
["Define time bias.","All else fixed, preferences sensitive to where in time events are located."],
["Define near bias and future bias.","Near: good things sooner, bad later. Future: good things in the future, bad in the past."],
["What is the hospital case?","Most prefer a painful operation was yesterday rather than tomorrow, even a 10 hour one vs 1 hour."],
["What is Future Tuesday Indifference?","Not caring about pains on future Tuesdays; a brute, arbitrary preference, so irrational."],
["State the non arbitrariness argument against near bias.","Rational preferences ignore arbitrary differences; distance from now is arbitrary; so near bias is impermissible."],
["What is the connectedness argument for near bias?","Self concern rests on connectedness, which comes in degrees and falls with distance, so discount the future."],
["What does Carrie's Crossfit case show?","If past pain counts for nothing she can never finish her workout, so future bias seems irrational."]
],
"Week 13": [
["What do time neutralists claim?","Time biased preferences, including future bias, are rationally impermissible."],
["What is the temporal metaphysics defence of future bias?","If time really passes, past events are over and done, which might justify future bias."],
["What is the causal inaccessibility explanation?","We evolved to care less about the past because we can't affect it; it explains but doesn't justify."],
["What is the first person vs third person asymmetry?","We're future biased about our own pain but time neutral about others', so first person bias looks irrational."],
["Run Dougherty's pain pump.","A risk averse, future biased agent takes a help early and a help late pill and ends up with one extra minute of pain for nothing."],
["What is Greene and Sullivan's scheduling problem?","Future biased Billy insists on riding second to avoid regret, which seems irrational."],
["What is the meagre returns problem?","An absolutely future biased agent waits an hour for less than one cookie to avoid regret."],
["Why does it matter whether future bias is a tiebreaker?","Only if it is stronger than a tiebreaker do the exploitation arguments bite, and evidence suggests it often is."]
]

const NOTES={"Week 5": "<h2>Overview<\/h2>\n<p>Week 5 has two lectures from different sections of the course:<\/p>\n<ul>\n<li><strong>Lecture 8, Arendt (end of Society):<\/strong> what happens to moral responsibility when the society that forms us goes radically wrong? Eichmann did enormous evil without monstrous intentions.<\/li>\n<li><strong>Lecture 9, Plato (start of Knowledge):<\/strong> what is knowledge, and how is it different from true belief? Plato's answer: knowledge is true belief fastened by a rational account, the origin of the justified true belief (JTB) analysis.<\/li>\n<\/ul>\n<p>Brigitte's practice question 1 (Plato vs Gettier) comes straight from Lecture 9.<\/p>\n<h2>Lecture 8: Hannah Arendt, Evil and Responsibility<\/h2>\n<h3>Who's who<\/h3>\n<p><strong>Hannah Arendt (1906 to 1975):<\/strong> German Jewish, born in Königsberg. Student of Heidegger and Jaspers. Refugee to France, then the US (1941). Works: <em>The Origins of Totalitarianism<\/em> (1951), <em>The Human Condition<\/em> (1958), <em>Eichmann in Jerusalem<\/em> (1963). Covered the trial for <em>The New Yorker<\/em>.<\/p>\n<p><strong>Adolf Eichmann (1906 to 1962):<\/strong> Nazi lieutenant colonel, not a high rank, yet one of the main organisers of the Holocaust. Coordinated the logistics of mass deportation to ghettos, camps and then extermination camps. Says he personally preferred a \"political\" solution (expulsion, e.g. the Madagascar plan) to a \"physical\" one, but when the extermination order came he carried it out with precision and zeal. Fled to Argentina, captured by Israeli agents in 1960, tried in Jerusalem, hanged in 1962.<\/p>\n<h3>The two problems<\/h3>\n<ol>\n<li><strong>Conceptual:<\/strong> define a new kind of evil that doesn't depend on the intention and motivation of the doer.<\/li>\n<li><strong>Legal:<\/strong> work out how such evil can be judged in law.<\/li>\n<\/ol>\n<h3>The banality of evil<\/h3>\n<p><strong>Not a general theory.<\/strong> Arendt later says she meant \"no theory or doctrine but something quite factual\": evil deeds on a gigantic scale that couldn't be traced to \"wickedness, pathology, or ideological conviction in the doer, whose only personal distinction was a perhaps extraordinary shallowness\" (\"Thinking and Moral Considerations\", 1971).<\/p>\n<p>Three clarifications to make in any answer:<\/p>\n<ul>\n<li><strong>Deed vs doer:<\/strong> banality describes the doer, never the deed. The Holocaust isn't banal.<\/li>\n<li><strong>Not all evildoers:<\/strong> it's a judgment of Eichmann, at most a type of evildoer.<\/li>\n<li><strong>Aimed at the prosecution:<\/strong> they painted Eichmann as an evil genius driven by hatred, the Holocaust's mastermind. Arendt saw something closer to a clown: not very intelligent, speaking in clichés, with eyes only for his career.<\/li>\n<\/ul>\n<p><strong>Thoughtlessness (her specific charge):<\/strong> not stupidity. Eichmann is unable to think from another's perspective. He shields himself with a stock of clichés and stock phrases and sinks into the general climate of opinion, so reality and other people never break through.<\/p>\n<p><strong>Two readings of banality (the lecture insists on the second):<\/strong><\/p>\n<ol>\n<li><em>Shallow reading:<\/em> evil done for petty reasons like career advancement. Wrong, because it just swaps diabolical intentions for pedestrian ones and stays inside the category of intention.<\/li>\n<li><em>Real reading:<\/em> Eichmann cloaks himself in ready made phrases and opinions that stop reality appearing to him and stop him taking anyone else's position. Language works as a protective device, not to communicate.<\/li>\n<\/ol>\n<p><strong>We all do it:<\/strong> \"that's the policy\" (a human decision looks like a force of nature), \"we have to be realistic\", \"the system should have flagged it\" (responsibility disappears into technology).<\/p>\n<h3>Theodicy and why Eichmann is a rupture<\/h3>\n<p><strong>Theodicy<\/strong> (theos, god + dikē, justice): vindicating God's goodness in view of evil. Broadly, any scheme that lets us place evil so we can carry on with the world.<\/p>\n<p><strong>The Lisbon earthquake (1 November 1755):<\/strong> magnitude roughly 8.5 to 9, then fires, then a tsunami; the city destroyed. It hit at the height of the Enlightenment and shook <strong>deism<\/strong> (a watchmaker God who doesn't intervene, with an ordered, meaningful nature). Contrast <strong>theism<\/strong> (a God who intervenes).<\/p>\n<p>Two responses after Lisbon:<\/p>\n<ol>\n<li>Revert to theism: natural events are divine judgments.<\/li>\n<li>Deny that nature has moral meaning. This one won: an earthquake today is a tragedy, not an evil.<\/li>\n<\/ol>\n<p>Result: evil shrinks to human beings, specifically intentions, wills and mental states. Susan Neiman: before Lisbon \"it made sense to call earthquakes evils\"; afterwards moral categories were confined to humans. This confinement is itself a theodicy.<\/p>\n<p><strong>Eichmann breaks that settlement:<\/strong> he produced more evil with less malice than ever before. The disturbing possibility is that he's what he says he is, a respectable citizen following orders and his career, with no evil conscience. So the intention criterion fails. Both the prosecution and defence asked the wrong question (was the intent to destroy present or not?).<\/p>\n<p><strong>Critics misread her:<\/strong> they thought denying evil intent meant absolving him. Arendt's point is that ordinary intentions do NOT reduce his responsibility.<\/p>\n<p><strong>Nietzsche twist:<\/strong> not only is God dead, so is the Devil. The devil figure can't explain modern evil done with thoughtlessness and an untroubled conscience.<\/p>\n<h3>Responsibility and distance (the reading, ch. XV \"Judgment, Appeal, and Execution\")<\/h3>\n<ul>\n<li>Eichmann claimed he was guilty only of \"aiding and abetting\" and never committed an overt act. The court conceded he wasn't proven to have killed anyone himself.<\/li>\n<li>Ordinary intuition: responsibility weakens the further you are from the person who pulls the trigger.<\/li>\n<li>The Israeli court reversed this: \"in general the degree of responsibility increases as we draw further away from the man who uses the fatal instrument with his own hands\" (247).<\/li>\n<li>In the death camps the people holding the fatal instrument were often inmates and victims themselves. The remote planner bears far more responsibility.<\/li>\n<li>The parallel: for evil we look inward for a wicked will, and Eichmann has none. For responsibility we look to the person closest to the deed, and Eichmann is far away. Both familiar markers break down.<\/li>\n<li>The verdict (Dec 1961) convicted him on all 15 counts, dropping \"conspiracy\". The Court of Appeal (May 1962) found he received no \"superior orders\" at all and was \"his own superior\" in Jewish affairs. Eichmann's line: \"I am not the monster I am made out to be... I am the victim of a fallacy.\"<\/li>\n<\/ul>\n<h3>The last words (252)<\/h3>\n<p>On the scaffold he declared himself a Gottgläubiger (no Christian, no belief in an afterlife), then said: \"After a short while, gentlemen, we shall all meet again... Long live Germany, long live Argentina, long live Austria. I shall not forget them.\"<\/p>\n<p>Arendt: \"In the face of death, he had found the cliché used in funeral oratory\"; he \"forgot that this was his own funeral.\" Even his own death, the most personal situation there is, was warded off with a cliché, and it contradicted what he'd just said. The lecture calls it paradigmatic bullshit: words meant to affect himself, not to say anything true. Then the book's only use of the phrase in the main text: \"the lesson of the fearsome, word-and-thought-defying banality of evil.\"<\/p>\n<h3>The three lessons<\/h3>\n<ol>\n<li>An enormous crime can be committed without the enormous malicious will we expect behind it.<\/li>\n<li>A person can be deeply responsible while physically remote from the wrong.<\/li>\n<li>Someone can knowingly do enormous evil while staying insulated from its reality through cliché, conformity, lawfulness and thoughtlessness.<\/li>\n<\/ol>\n<p>Arendt's answer is not that we judge less, but that we have to learn to judge differently.<\/p>\n<h2>Lecture 9: Plato's Justified True Belief Account of Knowledge<\/h2>\n<p>Lecturer: Prof. David Macarthur. Reading: <em>Meno<\/em> 97a to 98a, plus <em>Theaetetus<\/em> 145e to 147c and 201c to 202c.<\/p>\n<p><strong>Plato (427 to 347 BC):<\/strong> student of Socrates, teacher of Aristotle. Took Socrates as the model for a new form of inquiry he called \"philosophy\". His works are dialogues (imagined conversations), usually with Socrates as the main speaker.<\/p>\n<h3>Philosophy vs sophistry<\/h3>\n<ul>\n<li><strong>Sophistry (rhetoric):<\/strong> the persuasive use of language aimed at convincing others. Sophists taught the art of winning arguments for a fee, in law courts and political assemblies. Today: seemingly plausible but fallacious arguments used to deceive. The lecture's modern word: \"bullshit\", speaking with aims other than telling the truth (politicians and lawyers are famous for it).<\/li>\n<li><strong>Philosophy:<\/strong> the use of reason and argument aimed at truth. A philosopher is a lover of wisdom, or as Socrates puts it, a lover of a certain kind of conversation. So philosophy is a social art: the free, open ended back and forth of real dialogue.<\/li>\n<li>Philosophy studies the nature, scope and limits of reason. A theoretical argument reasons from true premises to a true (or likely true) conclusion: Socrates is a man; all men are mortal; so Socrates is mortal.<\/li>\n<\/ul>\n<p><strong>Link to Arendt:<\/strong> Eichmann's last words were also called bullshit. Words aimed at an effect, not at truth, is the shared idea.<\/p>\n<h3>A priori vs a posteriori<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>A priori<\/th>\n<th>A posteriori (empirical)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Based on<\/td>\n<td>Reflection alone, not on any particular observation or experiment<\/td>\n<td>Particular observations and experiments<\/td>\n<\/tr>\n<tr>\n<td>Method<\/td>\n<td>\"Armchair\" reflection on concepts<\/td>\n<td>Collecting data, experiment<\/td>\n<\/tr>\n<tr>\n<td>Example<\/td>\n<td>Philosophy for Plato (truths about ideas or Forms); maths<\/td>\n<td>Studying magnetism<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Caveat from the slides: all knowledge depends on experience in the broad sense, since you need to learn a language to express it.<\/p>\n<p>So examining knowledge philosophically is not like studying magnetism. We don't survey what people say they know; we reflect on the concept.<\/p>\n<h3>Kinds of knowing<\/h3>\n<p>\"Know\" takes many forms in everyday life: know what, know how, know who, know which, know where, know whether. The course focuses on <strong>theoretical know that<\/strong> (knowing truths), which is \"a logical abstraction from practice\".<\/p>\n<h3>Socrates wants the essence, not examples (<em>Theaetetus<\/em>)<\/h3>\n<p>Asked what knowledge is, Theaetetus lists geometry, the sciences, cobbling and carpentry. Socrates objects: that names the <em>subjects<\/em> of knowledge, not its nature.<\/p>\n<p><strong>The clay analogy:<\/strong> if asked \"what is clay?\" and you answer \"potter's clay, oven maker's clay, brick maker's clay\", you've assumed the questioner already knows what clay is. The simple answer is \"moistened earth\". Likewise \"knowledge of shoemaking\" makes no sense unless you know what knowledge is. Socrates wants \"the nature of knowledge in the abstract\": what makes each item of knowledge knowledge.<\/p>\n<h3>Plato's starting place: knowledge is true belief plus something<\/h3>\n<ul>\n<li><strong>Knowing implies truth:<\/strong> if I know that p, then p is true. You can't know what is false. Medieval people who said \"I know there are witches\" only thought they knew.<\/li>\n<li>(Aside: Plato thinks there are degrees of knowledge matching degrees of reality. The Forms, the highest reality, are known by the best knowledge. See the Divided Line.)<\/li>\n<\/ul>\n<h3>The Meno argument (97a to 98a)<\/h3>\n<ol>\n<li><strong>The road to Larissa:<\/strong> someone who knows the way is a good guide. But someone with only a true opinion about the way, who has never been there, is just as good a guide.<\/li>\n<li>So true opinion is as good a guide to right action as knowledge, and no less useful.<\/li>\n<li>Meno: but the one with knowledge is always right, the one with true opinion only sometimes. Socrates: can someone with right opinion be wrong, so long as they have it? So why is knowledge prized more?<\/li>\n<li><strong>The statues of Daedalus:<\/strong> they \"run away\" unless fastened, so an unfastened one isn't worth much. True opinions are the same: good while they stay, but they \"run away out of the human soul\" until \"fastened by a reasoned understanding of causes\" (which Socrates calls recollection).<\/li>\n<li>Once fastened they become knowledge and they abide. That's why knowledge is \"more honourable and excellent than right opinion, because fastened by a chain\".<\/li>\n<\/ol>\n<p><strong>Accidental true belief isn't knowledge (lecture examples):<\/strong> tossing a coin at the crossroads and happening to pick the road to Larissa; seeing an L shaped cloud and superstitiously concluding Larissa is that way, which happens to be true. Knowledge is <strong>non accidentally true belief<\/strong>.<\/p>\n<p><strong>What \"running away\" means:<\/strong> mere true belief is easily changed or lost under rational criticism. Knowledge is bound by rational explanation, so you can answer \"How do you know?\" satisfactorily.<\/p>\n<h3>Plato's essentialist definition (<em>Theaetetus<\/em> 201c to 202c)<\/h3>\n<p>Knowledge is \"true opinion combined with reason\", a \"rational account\" (logos): the right kind of justification or understanding. \"He who cannot give and receive a reason for a thing, has no knowledge of that thing.\"<\/p>\n<p>The three conditions are each <strong>necessary<\/strong> and together <strong>sufficient<\/strong>:<\/p>\n<ol>\n<li>Truth: p is true.<\/li>\n<li>Belief: S believes p.<\/li>\n<li>Justification: S has a rational account of p.<\/li>\n<\/ol>\n<p>This is the classic <strong>justified true belief (JTB)<\/strong> analysis, the target of Gettier in the following lecture.<\/p>\n<h3>Know that vs know how (the tension in Plato)<\/h3>\n<ul>\n<li>Justification is usually understood as giving a rational explanation <em>in words<\/em>.<\/li>\n<li>But Plato's own examples include knowing the way to Larissa, shoemaking and carpentry. These plausibly can't be summed up in words. They're a \"masterful doing\".<\/li>\n<li>Knowing the way plausibly requires that you could <em>show<\/em> someone how to get there. Does it also require that you could <em>tell<\/em> them, with verbal directions?<\/li>\n<li>So Plato has <strong>two models of knowledge: craft<\/strong> (carpentry, shoemaking) <strong>and mathematics<\/strong> (geometry).<\/li>\n<\/ul>\n<p>Two ways to answer a critic:<\/p>\n<ol>\n<li><strong>Know that:<\/strong> show you know by giving a rational explanation in words. This is the course's focus.<\/li>\n<li><strong>Know how:<\/strong> show you know by doing something that works, e.g. riding a bike.<\/li>\n<\/ol>\n<h2>Key terms<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<th>Who<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Banality of evil<\/td>\n<td>Enormous evil by a doer with no wickedness, pathology or ideology, only shallowness<\/td>\n<td>Arendt<\/td>\n<\/tr>\n<tr>\n<td>Thoughtlessness<\/td>\n<td>Inability to think from another's standpoint, shielded by cliché<\/td>\n<td>Arendt<\/td>\n<\/tr>\n<tr>\n<td>Deed vs doer<\/td>\n<td>Banality describes Eichmann, never the Holocaust<\/td>\n<td>Arendt<\/td>\n<\/tr>\n<tr>\n<td>Theodicy<\/td>\n<td>Vindicating God's goodness in view of evil; any scheme that places evil<\/td>\n<td>Arendt lecture<\/td>\n<\/tr>\n<tr>\n<td>Deism / theism<\/td>\n<td>Non intervening creator / intervening creator<\/td>\n<td>Arendt lecture<\/td>\n<\/tr>\n<tr>\n<td>Responsibility and distance<\/td>\n<td>Responsibility can grow the further you are from the killer<\/td>\n<td>Israeli court, Arendt<\/td>\n<\/tr>\n<tr>\n<td>Sophistry<\/td>\n<td>Persuasive speech aimed at winning, not truth<\/td>\n<td>Plato<\/td>\n<\/tr>\n<tr>\n<td>A priori<\/td>\n<td>Known by reflection, not particular observation<\/td>\n<td>Plato lecture<\/td>\n<\/tr>\n<tr>\n<td>A posteriori<\/td>\n<td>Known through observation and experiment<\/td>\n<td>Plato lecture<\/td>\n<\/tr>\n<tr>\n<td>Know that<\/td>\n<td>Knowing a truth; shown by giving reasons in words<\/td>\n<td>Plato lecture<\/td>\n<\/tr>\n<tr>\n<td>Know how<\/td>\n<td>Practical skill; shown by doing something that works<\/td>\n<td>Plato lecture<\/td>\n<\/tr>\n<tr>\n<td>True opinion<\/td>\n<td>A true belief that may be accidental and can \"run away\"<\/td>\n<td>Plato<\/td>\n<\/tr>\n<tr>\n<td>Logos / rational account<\/td>\n<td>The reason that fastens true belief into knowledge<\/td>\n<td>Plato<\/td>\n<\/tr>\n<tr>\n<td>Necessary and sufficient<\/td>\n<td>Each condition required; all together enough<\/td>\n<td>Plato's definition<\/td>\n<\/tr>\n<tr>\n<td>JTB<\/td>\n<td>Knowledge = justified true belief<\/td>\n<td>Plato, later Gettier<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Things to cite in the exam<\/h2>\n<ul>\n<li><strong>Arendt, \"Thinking and Moral Considerations\" (1971):<\/strong> banality of evil as \"no theory or doctrine but something quite factual\".<\/li>\n<li><strong>The Lisbon earthquake (1755)<\/strong> and Neiman: evil confined to human intentions.<\/li>\n<li><strong>The Israeli court (247):<\/strong> responsibility \"increases as we draw further away from the man who uses the fatal instrument\".<\/li>\n<li><strong>Court of Appeal:<\/strong> Eichmann received no superior orders; he was \"his own superior\".<\/li>\n<li><strong>Eichmann's last words (252):<\/strong> the funeral cliché at his own funeral.<\/li>\n<li><strong>\"Word and thought defying banality of evil\" (252):<\/strong> the book's only use of the phrase in the main text.<\/li>\n<li><strong>Meno 97a to 98a:<\/strong> the road to Larissa and the statues of Daedalus.<\/li>\n<li><strong>Theaetetus:<\/strong> the clay analogy; knowledge as true opinion with a rational account (201c to 202c).<\/li>\n<li><strong>Lecture examples:<\/strong> coin toss and L shaped cloud (accidental true belief), witches (knowing implies truth), riding a bike (know how).<\/li>\n<\/ul>\n<h2>Objections and replies<\/h2>\n<p><strong>Against Arendt<\/strong><\/p>\n<ul>\n<li><em>She lets Eichmann off:<\/em> the main reaction in 1963. Reply: she says his ordinary intentions don't mitigate his responsibility at all, and she supports the death sentence.<\/li>\n<li><em>She was fooled:<\/em> later historians (beyond these readings) argue Eichmann was an ideologically committed antisemite who performed shallowness at trial. Reply: her concept is a claim about a type of evil, and it can be true of many bureaucrats even if Eichmann was a poor example. Flag this as outside the course readings if you use it.<\/li>\n<li><em>Without intention, how can we blame?<\/em> Law and morality usually need a guilty mind. Reply: Eichmann acted knowingly. What's missing is malice and thought, and Arendt argues thoughtlessness is itself culpable, a failure to judge.<\/li>\n<\/ul>\n<p><strong>Against Plato<\/strong><\/p>\n<ul>\n<li><em>Gettier (next lecture):<\/em> someone can have a justified true belief that is still true by luck, so JTB isn't sufficient. But note Plato's own requirement is non accidental truth fastened by an understanding of causes, which arguably anticipates the fix.<\/li>\n<li><em>Know how doesn't fit:<\/em> his craft examples can't be put into words, so the rational account condition may be too narrow, or there are two kinds of knowledge.<\/li>\n<li><em>Is true opinion really less valuable?<\/em> Socrates himself concedes it guides action just as well. The value of knowledge lies in its stability, not in getting better results right now.<\/li>\n<li><em>Recollection:<\/em> Plato ties the fastening to recollection (the soul remembering what it knew before birth), which few would accept today. Reply: the JTB core can be kept without it.<\/li>\n<\/ul>\n<h2>Connections<\/h2>\n<ul>\n<li><strong>Arendt and Plato on bullshit:<\/strong> Eichmann's clichés are speech aimed at effect, not truth, like sophistry. Thinking for Arendt resembles Socratic dialogue: taking up others' positions.<\/li>\n<li><strong>Plato to Gettier:<\/strong> Brigitte's practice question 1.<\/li>\n<li><strong>Plato to Austin:<\/strong> does knowing require belief? Practice question 2.<\/li>\n<li><strong>Justification to Agrippa's trilemma:<\/strong> if knowledge needs a rational account, what justifies the account? Practice question 3.<\/li>\n<\/ul>\n<h2>Practice questions<\/h2>\n<p><strong>1. What does Arendt mean by the \"banality of evil\"? Does it reduce Eichmann's responsibility?<\/strong> Skeleton: thesis (no, it relocates it); the prosecution's evil genius portrait vs Arendt's shallow Eichmann; deed vs doer; the two readings of banality (career motives vs cliché shielding reality); thoughtlessness; the court on distance and responsibility (247); objection that she excuses him or was fooled; reply; conclude with \"judge differently, not less\".<\/p>\n<p><strong>2. Why is Eichmann a challenge to the modern understanding of evil?<\/strong> Skeleton: theodicy defined; Lisbon and the end of deism; evil confined to intentions (Neiman); Eichmann does vast evil with little malice, so the intention criterion fails; the Devil is dead too; objection: we can still blame him for knowing what he did; reply: knowledge without thought or malice is exactly the new category.<\/p>\n<p><strong>3. How does Plato distinguish knowledge from true belief? Is he right? (close to Brigitte's Q1)<\/strong> Skeleton: knowing implies truth; the road to Larissa (true belief guides as well); the statues of Daedalus (true belief runs away); knowledge as true belief fastened by a rational account; three necessary and jointly sufficient conditions; coin toss and cloud cases show accidental truth isn't knowledge; objection from Gettier (Week 6); objection from know how; your verdict.<\/p>\n<p><strong>4. Explain the distinction between know that and know how. Does it cause problems for Plato?<\/strong> Skeleton: define both, with how each is shown to a critic (reasons in words vs doing something that works); Plato's two models (craft and maths); the Larissa case (showing vs telling the way); argue that the rational account condition only fits know that, so either Plato's analysis is of know that alone, or it fails for crafts.<\/p>\n<p><strong>Quick self test<\/strong><\/p>\n<ul>\n<li>What are Arendt's two problems, conceptual and legal?<\/li>\n<li>What's the difference between the shallow and the real reading of banality?<\/li>\n<li>What did Lisbon do to the concept of evil, and how does Eichmann undo that settlement?<\/li>\n<li>What did the court say about distance and responsibility, and why is it counterintuitive?<\/li>\n<li>What did Eichmann say on the scaffold, and why is it the perfect example?<\/li>\n<li>Why is someone with a true opinion as good a guide as someone with knowledge?<\/li>\n<li>What do the statues of Daedalus illustrate?<\/li>\n<li>What is the clay analogy for?<\/li>\n<li>Define a priori and a posteriori with an example of each.<\/li>\n<\/ul>", "Week 6": "<h2>Overview<\/h2>\n<p>Week 6 takes Plato's definition apart in two steps:<\/p>\n<ul>\n<li><strong>Lecture 10, Gettier:<\/strong> justified true belief is not sufficient for knowledge. A belief can be justified and true and still true by luck. Fixing it by demanding infallible justification makes knowledge almost impossible, and the whole project of analysing knowledge looks like a failure.<\/li>\n<li><strong>Lecture 11, Radford:<\/strong> knowledge doesn't even require being sure, or (against Plato) believing. Knowledge is a social status with public criteria (good grounds), while belief is a psychological commitment to the truth.<\/li>\n<\/ul>\n<p>Brigitte's practice questions 1 (Plato vs Gettier) and 2 (believing what you know is false, Austin) build directly on this week.<\/p>\n<h2>Lecture 10: Problems for Plato's Account (Gettier)<\/h2>\n<p>Reading: Edmund L. Gettier, \"Is Justified True Belief Knowledge?\", <em>Analysis<\/em> 23.6 (June 1963). Three pages long and it started a whole subject (\"Gettierology\").<\/p>\n<h3>Plato's essentialist account (recap)<\/h3>\n<p>Knowledge has an essence expressible as necessary conditions that are jointly sufficient. Assumption: knowledge is true belief plus something. Proposal: plus a rational account, i.e. justified true belief.<\/p>\n<p><strong>The modern JTB:<\/strong> S knows that p if and only if (1) p is true, (2) S believes p, (3) S's belief in p is justified. This is know that only, leaving aside know how (masterful doing, e.g. riding a horse).<\/p>\n<p>Gettier notes versions of this in <strong>Chisholm<\/strong> (S accepts P, has adequate evidence for P, P is true) and <strong>Ayer<\/strong> (P is true, S is sure P is true, S has the right to be sure).<\/p>\n<h3>A paradox of inquiry and reflective equilibrium<\/h3>\n<ul>\n<li><strong>Paradox:<\/strong> to define knowledge Plato must already be able to pick out genuine cases of it. But if we don't know what knowledge is, how can we identify cases before we have the definition?<\/li>\n<li><strong>Reflective equilibrium<\/strong> (Nelson Goodman, <em>Fact, Fiction and Forecast<\/em>, 1955): we do start from examples, but they aren't sacrosanct. We adjust definitions and cases against each other to get the best fit, capturing as many pre theoretical examples as possible.<\/li>\n<\/ul>\n<h3>Gettier's two assumptions<\/h3>\n<ol>\n<li><strong>You can be justified in believing something false.<\/strong> Good reasons don't guarantee truth. Example: geocentrism. To the ancient Greeks everything suggested the sun moved round a stationary earth, a false but justified belief.<\/li>\n<li><strong>Closure of justification under known implication:<\/strong> if S is justified in believing P, and S believes Q because S knows P implies Q, then S is justified in believing Q. (The chair is red, so the chair is coloured.)<\/li>\n<\/ol>\n<h3>The four cases<\/h3>\n<p><strong>Case 1, Smith, Jones and the job (Gettier's own):<\/strong><\/p>\n<ul>\n<li>Smith and Jones both apply for a job. Smith has strong evidence for (A): \"Jones will get the job and Jones has ten coins in his pocket.\"<\/li>\n<li>(A) implies (B): \"The man who will get the job has ten coins in his pocket.\" Smith believes (B) on that basis.<\/li>\n<li>In fact Smith gets the job, and Smith happens to have ten coins in his pocket.<\/li>\n<li>So (B) is true, Smith believes it, and he's justified. But it isn't knowledge.<\/li>\n<li>Logic used: Fa.Ga implies Ex(Fx.Gx). \"Jones gets the job and has ten coins\" implies \"someone gets the job and has ten coins\".<\/li>\n<\/ul>\n<p><strong>Case 2, the Ford and Barcelona (Gettier's own):<\/strong><\/p>\n<ul>\n<li>Smith has strong evidence for (C): \"Jones owns a Ford.\" He has another friend, Brown, whose whereabouts he has no idea of.<\/li>\n<li>(C) implies (D): \"Either Jones owns a Ford or Brown is in Barcelona.\"<\/li>\n<li>In fact Jones doesn't own a Ford, but by luck Brown is in Barcelona.<\/li>\n<li>So (D) is a justified true belief that isn't knowledge.<\/li>\n<li>Logic used: p implies p or q.<\/li>\n<\/ul>\n<p><strong>What the first two share:<\/strong> the subject is first justified in believing something false (Jones gets the job / Jones owns a Ford). That false claim implies a true one, which closure lets him justifiably believe.<\/p>\n<p><strong>Worry:<\/strong> maybe the problem is just inference from a false premise. So the lecture gives cases with no false premise:<\/p>\n<p><strong>Case 3, the stopped clock:<\/strong> a town square clock known to be reliable reads 12:10 and it is 12:10. But it's maintenance day and the clock is stopped. Accidentally justified true belief.<\/p>\n<p><strong>Case 4, sheep in the meadow:<\/strong> you see what look like sheep (actually topiary) and think \"there are sheep in the meadow\". There are, but over the hill where you can't see them.<\/p>\n<p><strong>The moral:<\/strong> accidentally true belief isn't knowledge (Plato's coin toss), and adding justification doesn't change that. <strong>Accidentally justified true belief isn't knowledge either.<\/strong><\/p>\n<h3>Strengthening the third condition fails<\/h3>\n<p>Proposal: S knows p iff p is true, S believes p, and S has <strong>infallible<\/strong> (absolutely certain) justification for p.<\/p>\n<ul>\n<li>This would block Gettier cases, since every one depends on the fallibility or defeasibility of our evidence.<\/li>\n<li>But all our evidence is fallible, especially for empirical knowledge. The senses, memory, testimony and inference all make mistakes.<\/li>\n<li>So knowledge would become almost impossible to have. That fails reflective equilibrium: it doesn't fit our actual practice of crediting knowledge.<\/li>\n<\/ul>\n<h3>Two senses of \"justification\"<\/h3>\n<table>\n<thead>\n<tr>\n<th>Sense<\/th>\n<th>What it means<\/th>\n<th>Lecture's label<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Epistemic blamelessness<\/td>\n<td>Your way of forming and keeping the belief is responsible: you weighed the evidence, weren't gullible or dogmatic<\/td>\n<td>Entitlement<\/td>\n<\/tr>\n<tr>\n<td>Reliability<\/td>\n<td>The process that produced the belief makes it objectively likely to be true<\/td>\n<td>Ground<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Moral of Gettier:<\/strong> knowing isn't just being right and blameless. Smith is blameless in every case. You also need <strong>good grounds<\/strong>, an objective likelihood of being right.<\/p>\n<h3>The failure of analysis<\/h3>\n<ul>\n<li>The search for necessary and sufficient conditions is <strong>logical analysis<\/strong>, the basis of \"analytic philosophy\".<\/li>\n<li>Since 1963 many repairs have been tried; none has general approval. The project looks like a failure.<\/li>\n<li><strong>Back to the drawing board:<\/strong> Plato treated knowledge like a chemical compound built out of true belief plus extras. Maybe that first step is wrong. Perhaps knowledge is basic and undefinable, and doesn't contain belief as a part (developed in Lecture 11 and later).<\/li>\n<\/ul>\n<h2>Lecture 11: Knowledge, Being Certain, Believing (Radford)<\/h2>\n<p>Reading: Colin Radford, \"Knowledge: By Examples\", <em>Analysis<\/em> 27.1 (October 1966).<\/p>\n<h3>The new approach<\/h3>\n<p>After Gettier we give up on a non circular essentialist definition. But we can still ask (a) what the <strong>conceptual connections<\/strong> are between knowledge and other concepts (belief, certainty, justification), and (b) what <strong>function<\/strong> the concept of knowledge serves (Lecture 5).<\/p>\n<p>So far one connection is secure: knowing that p implies that p is true. Open questions: does knowing imply being sure? Does it imply believing?<\/p>\n<p><strong>Method:<\/strong> reflective equilibrium, using our pre theoretical sense of when it's right to say someone knows. Radford: \"whether [Jean] 'knows' is a question of what 'know' means, which in turn is very much a matter of when, in what situations, English speakers say or would say that someone knows or does not know.\" But it's not just polling intuitions: we can give reasons for the verdict, as Tom and Jean do.<\/p>\n<h3>Knowing without being sure<\/h3>\n<p><strong>Case 1, the locked car:<\/strong> a man knows he locked his car, but when his wife questions him he says he's sure, \"I could still be mistaken\", and since it'd be disastrous if he hadn't, he'll go back and check. Knowing p is consistent with not being sure that p.<\/p>\n<p><strong>Case 2, the anxious librarian:<\/strong> Miss Tercy isn't sure what happened to some novels by W. J. Locke; she thinks they were sold for pulp. Mr Gee says she has \"a memory like an elephant\" and \"knows everything about this library\", so what she thinks happened can be taken as what did happen. Her uncertainty is a personal quirk (anxiety, lack of confidence).<\/p>\n<ul>\n<li>Miss Tercy doesn't claim to know, only that she thinks she recalls.<\/li>\n<li>Mr Gee attributes knowledge based on the reliability of her memory: he supplies the grounds.<\/li>\n<li><strong>Insight:<\/strong> a knower needn't be aware she has good grounds. Someone else can recognise them and credit her with knowledge she wouldn't claim herself.<\/li>\n<\/ul>\n<p><strong>Case 3, the pottery shard sorter:<\/strong> Jenny, an archaeologist, reliably sorts shards into Greek and Roman by objective standards, but doesn't know how she does it and doesn't believe she's reliable. In any given case we can say she knows, even if she doesn't think so.<\/p>\n<h3>Knowledge is a social status<\/h3>\n<p>Because someone else can correctly credit you with knowledge you wouldn't claim, knowledge looks like a <strong>social status with public criteria<\/strong>. Whether you know (have good grounds for a truth claim) is a public matter.<\/p>\n<p>This fits the moral of Gettier: beyond blamelessness you need <strong>good grounds<\/strong>, an objective, publicly checkable likelihood of being right. And the knower needn't believe she has them.<\/p>\n<h3>Case 4, the unconfident student of English history (Radford's central case)<\/h3>\n<ul>\n<li>Jean and Tom do a history quiz. Jean says he knows no English history, can't remember learning any, and will just guess.<\/li>\n<li>A considerable number of his \"guesses\" about Tudor and Stuart monarchs are right: e.g. Elizabeth died in 1603, James I died in 1625.<\/li>\n<li>Tom concludes Jean knows these dates, because it would be wildly implausible that he guessed them all. He must have learned them at some point and not entirely forgotten them, though he's forgotten learning them. No magic or mystical intuition is involved.<\/li>\n<li>Radford's reasoning: Jean's answers show he learned some history, he remembers some of it, so he knows some history.<\/li>\n<li>When answering, Jean wasn't sure of each answer. He was fairly sure it was wrong, since he took it to be one guess among many possible answers.<\/li>\n<\/ul>\n<p><strong>Conclusions from this case:<\/strong><\/p>\n<ol>\n<li><strong>Knowledge doesn't require being sure, or the right to be sure.<\/strong> This refutes Ayer's analysis directly.<\/li>\n<li><strong>The KK principle fails.<\/strong> KK says: if you know p, you know that you know p. Jean knows the dates without knowing that he knows (until Tom tells him). Everyday sign of the gap: \"I didn't know I knew that!\"<\/li>\n<li><strong>Knowledge doesn't require belief<\/strong> (the radical point, against Plato). Jean can be credited with knowing p when he wouldn't even claim to believe p.<\/li>\n<\/ol>\n<p>Radford concedes Jean's knowledge is \"a poor thing, sparse, uncertain, unwitting\", but it still exists.<\/p>\n<h3>Case 5, the doubtful chicken sexer<\/h3>\n<p>Chicken sexers reliably sort chicks by sex without knowing how. Suppose Jack, highly reliable, is made doubtful of his ability by his bosses (maybe to keep his pay low). When he sorts he doesn't even believe he's usually right; from his view it's a hunch. Yet he knows which chicks are male.<\/p>\n<h3>Belief vs guesswork<\/h3>\n<ul>\n<li><strong>To believe p<\/strong> is to take p to be true, to commit yourself to its truth. (Slide aside: \"There is false belief but no such thing as believing falsely.\")<\/li>\n<li><strong>Guessing<\/strong> is less than that: imagining or hoping p is true.<\/li>\n<li>Jean's \"guesses\" are consistent with actually remembering the facts. Jack's are consistent with reliable trained sorting.<\/li>\n<\/ul>\n<h3>Why did Plato think knowledge includes belief?<\/h3>\n<p>On Plato's <strong>molecular model<\/strong>, knowledge is partly made of true belief. But there are cases of knowing without believing. So why did it seem plausible? Look at how challenges go.<\/p>\n<p><strong>Knowledge challenge format:<\/strong><\/p>\n<ol>\n<li>S: \"I know that p.\"<\/li>\n<li>Q: \"How do you know? Perhaps...\" [doubts]<\/li>\n<li>S: \"I'm not sure.\"<\/li>\n<li>Q: \"Then you don't know.\"<\/li>\n<li>S: \"Well, at least I believe that p.\"<\/li>\n<\/ol>\n<p><strong>Retreating to belief:<\/strong> under criticism you can fall back from a knowledge claim to a belief claim. If that's the only evidence for Plato's view, we just need another explanation of it. The alternative: a claim to know is a <strong>stronger, more demanding status<\/strong> than an expression of belief.<\/p>\n<p><strong>Knowledge and belief are distinct:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Knowledge<\/th>\n<th>Belief<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What it is<\/td>\n<td>A social status with public criteria<\/td>\n<td>A psychological state<\/td>\n<\/tr>\n<tr>\n<td>Requires<\/td>\n<td>Objectively good grounds<\/td>\n<td>Only commitment to the truth of p<\/td>\n<\/tr>\n<tr>\n<td>Shared feature<\/td>\n<td>Commitment to truth<\/td>\n<td>Commitment to truth<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>That shared commitment to truth is why you can retreat from one to the other.<\/p>\n<p><strong>Belief challenge format:<\/strong><\/p>\n<ol>\n<li>S: \"I believe that p.\"<\/li>\n<li>Q: \"Why do you believe? Perhaps...\" [doubts]<\/li>\n<li>S: \"I'm not sure.\"<\/li>\n<li>Q: \"Then you don't believe.\" (This makes no sense.)<\/li>\n<\/ol>\n<p>You don't need objectively good reasons to believe. The natural reply is instead \"Then you <em>ought<\/em> not to believe.\"<\/p>\n<h3>Belief and reason: evidentialism<\/h3>\n<ul>\n<li><strong>Evidentialism:<\/strong> you ought always to have good reason or evidence for your beliefs (W. K. Clifford, \"The Ethics of Belief\").<\/li>\n<li>Problem: if every entitlement to believe needed a good reason, that reason would need a reason too, and so on. Evidentialism quickly generates a <strong>vicious infinite regress<\/strong> of reasons for reasons. (Links to Lecture 6, Agrippa's Trilemma.)<\/li>\n<\/ul>\n<h2>Key terms<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<th>Who<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>JTB<\/td>\n<td>S knows p iff p is true, S believes p, S is justified<\/td>\n<td>Plato, Chisholm, Ayer<\/td>\n<\/tr>\n<tr>\n<td>Gettier case<\/td>\n<td>A justified true belief that is true by luck, so not knowledge<\/td>\n<td>Gettier<\/td>\n<\/tr>\n<tr>\n<td>Closure (justification)<\/td>\n<td>Justified in P + knowingly infer Q from P = justified in Q<\/td>\n<td>Gettier<\/td>\n<\/tr>\n<tr>\n<td>Reflective equilibrium<\/td>\n<td>Adjust definitions and cases against each other for best fit<\/td>\n<td>Goodman<\/td>\n<\/tr>\n<tr>\n<td>Paradox of inquiry<\/td>\n<td>How can we spot cases of knowledge before defining it?<\/td>\n<td>Lecture 10<\/td>\n<\/tr>\n<tr>\n<td>Fallibilism<\/td>\n<td>All our evidence (senses, memory, testimony, inference) can err<\/td>\n<td>Lecture 10<\/td>\n<\/tr>\n<tr>\n<td>Epistemic blamelessness<\/td>\n<td>Responsible belief formation (entitlement)<\/td>\n<td>Lecture 10<\/td>\n<\/tr>\n<tr>\n<td>Reliability / ground<\/td>\n<td>Objective likelihood the belief is true<\/td>\n<td>Lecture 10<\/td>\n<\/tr>\n<tr>\n<td>Logical analysis<\/td>\n<td>Finding necessary and sufficient conditions<\/td>\n<td>Analytic philosophy<\/td>\n<\/tr>\n<tr>\n<td>KK principle<\/td>\n<td>If you know p, you know that you know p<\/td>\n<td>Radford rejects it<\/td>\n<\/tr>\n<tr>\n<td>Social status<\/td>\n<td>Knowledge credited by public criteria, even by oth
