{w:"Week 6",q:"How does Plato's view regarding the difference between true belief and knowledge differ from Gettier's view? Is either view correct? Why/why not?",o:[
"Thesis: Gettier is right that JTB isn't sufficient; Plato's idea of fastening points toward the fix.",
"Plato: knowing implies truth; the road to Larissa; the statues of Daedalus; true belief plus a rational account; three necessary and jointly sufficient conditions.",
"Gettier: two assumptions (justified false belief, closure). Run the ten coins case in full.",
"Add the stopped clock or sheep: not just false premises. Accidentally justified true belief isn't knowledge.",
"Strengthening to infallible justification fails (fallible evidence; reflective equilibrium).",
"Evaluate: two senses of justification; knowledge needs good grounds, not just blamelessness. Plato's \"understanding of causes\" anticipates this.",
"Conclude."]},
{w:"Week 7",q:"Can one believe something one knows to be false? Why/why not? Answer with reference to Austin's view on knowledge and belief.",o:[
"Thesis: yes, possible but defective, like an insincere promise.",
"Plato's molecular model would make it impossible.",
"Austin: believing like intending (personal), knowing like promising (giving your word). Knowing isn't the top of the belief scale; being sure is.",
"So knowledge doesn't contain belief, and knowing not p while believing p isn't a straight contradiction. Radford's Jean is the mirror case.",
"The analogy shows the cost: like promising while intending not to, it's insincere or self deceived.",
"Objection: both are truth commitments, so it's incoherent (Moorean). Reply: the absurdity is in asserting both, not being in both states (the fearful flyer).",
"Conclude."]},
{w:"Week 8",q:"What is Agrippa's Trilemma? Does it involve a vicious infinite regress?",o:[
"Context: Pyrrhonism, suspension of belief, ataraxia; three of Agrippa's Five Modes.",
"The three horns: regress, circle, ad hoc assumption; why each confers no entitlement (Barnes's reconstruction).",
"Virtuous vs vicious: \"it is true that\" regress vs the reasons regress, where entitlement is endlessly deferred.",
"So yes, given its assumption, the regress is vicious.",
"Foundationalism (too few foundations) and coherentism (too many webs).",
"Better: deny that entitlement always needs an independent reason. Default entitlements, citizenship analogy, the decoy pig.",
"Objection from Barnes's humdrum ideas; reply; conclude."]},
{w:"Week 9",q:"How do Pragmatists respond to Descartes's Evil Demon Hypothesis? Do you agree with their response? Why/why not?",o:[
"The hypothesis and the meditator's argument (scientia).",
"Pragmatist basics: belief as habit, doubt as irritation, inquiry aims at settled opinion.",
"The demon gives only paper doubt; we cannot begin with complete doubt; real doubt needs a positive reason (decoy factory).",
"Inquiry is social and has no pure form (\"facts about what?\").",
"Fallibilist but anti sceptical; Neurath's boat.",
"Objection: changes the subject. Reply: relevant doubts (Austin, Craig); Descartes calls his doubt metaphysical.",
"Verdict."]},
{w:"Week 10",q:"What is the soul view of personal identity and how does it differ from the psychological continuity view? Do you agree with either of the views? Why/why not?",o:[
"Frame: what makes a future self mine? Identity, numerical vs qualitative.",
"Soul view: you are your soul; survive iff it does; not your body.",
"Psychological continuity: chains of connections plus the right causal links.",
"Differences: detectable vs not; degrees vs all or nothing; tied to what we care about; can branch.",
"Against the soul view: Weirob's chocolates and Blue River; the HAZON.",
"Against continuity: duplicates (causal fix) and fission (non branching looks ad hoc).",
"Verdict, perhaps with Parfit's twist that identity isn't what matters."]},
{w:"Week 10",q:"How would you respond to the teletransporter case? Argue for your case with reference to the views discussed in class.",o:[

"Soul view: no usable answer. Bodily: you die. Psychological: you survive.",
"The doubled version: transitivity means you can't be both, so neither; yet you'd still pay the $500.",
"So identity isn't what matters; the single case has everything that matters (Parfit, My Division).",
"Objection: it feels like death. Reply: you care about continuity, not matter.",
"Your verdict: step in or not, and on which view."]},
{w:"Week 11",q:"What is a reason to think that it is not whole perduring persons that count as being rational or not? Do you agree or disagree? Why/why not?",o:[

"The reason: the whole has inconsistent beliefs and desires, so it can't deliberate; the current little self is the seat of decision.",

"Link to time bias: connectedness discounting; conclude."]},
{w:"Week 12",q:"Is it rational to be time biased (near biased or future biased)? Answer with reference to the course content.",o:[

"Week 12":[["Yorick","Dennett's brain in the vat"],["Hamlet","Dennett's first body"],["Hubert","The computer duplicate brain"],["Equal Concern Claim","Care equally for all your future"],["Principle (B)","Less of a relation can rationally matter less"],["Near bias","Good things sooner, bad things later"],["Future bias","Good things future, bad things past"],["Non arbitrariness","Ignore irrelevant differences"]],
"Week 13":[["Time neutralism","Time biased preferences are impermissible"],["Pain pump","Future bias plus risk aversion"],["Scheduling problem","Future bias plus regret aversion"],["Causal inaccessibility","We can't change the past, so care less"],["Passage hypothesis","Time really flows, so the past is done"],["Tiebreaker","Preference only between equal options"],["Preference reflection","Prefer now what you'll later prefer"]]
};
const LEVELS=[[0,"Sophist"],[100,"Student of Socrates"],[300,"Academic"],[600,"Peripatetic"],[1000,"Stoic"],[1600,"Sceptic Sage"],[2500,"Philosopher King"]];
function levelOf(x){ let i=0; LEVELS.forEach((l,k)=>{ if(x>=l[0]) i=k; }); return i; }
function addXP(n){
  const before=levelOf(S.xp||0); S.xp=(S.xp||0)+n; save(); renderXP();
  const after=levelOf(S.xp);
  if(after>before){ laurels(40); if(window.hamSay) hamSay("Level up! You are now a "+LEVELS[after][1]+" 🍭",3600); }
}
function renderXP(){
  const el=document.getElementById("xp"); if(!el) return;
  const x=S.xp||0, i=levelOf(x), cur=LEVELS[i][0], nxt=LEVELS[i+1]?LEVELS[i+1][0]:null;
  const pct=nxt?((x-cur)/(nxt-cur)*100):100;
  el.innerHTML=`<div class="xp-top"><span class="xp-rank">${LEVELS[i][1]}</span><span class="muted">${x} XP${nxt?` · ${nxt-x} to ${LEVELS[i+1][1]}`:" · max rank"}</span></div><div class="bar"><i style="width:${pct}%;background:var(--accent)"></i></div>`;
}
function laurels(n){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box=document.createElement("div"); box.className="laurels";
  const bits=["🌿","🍃","✨","🌿","🍋"];
  for(let i=0;i<n;i++){ const s=document.createElement("span"); s.textContent=bits[i%bits.length];
    s.style.left=Math.random()*100+"vw"; s.style.animationDelay=(Math.random()*.6)+"s"; s.style.fontSize=(14+Math.random()*14)+"px";
    s.style.setProperty("--dx",(Math.random()*120-60)+"px"); box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),3200);
}
function wstyle(w){ return `--wc:${WCOL[w]}`; }

/* ---------- match game ---------- */
const mt={sel:new Set(Object.keys(DECK)), pairs:[], pick:null, done:0, miss:0, t0:0, tick:null};
function startMatch(){
  let pool=[]; mt.sel.forEach(w=>MATCH[w].forEach(p=>pool.push([w,p[0],p[1]])));
  mt.pairs=shuffle(pool).slice(0,6); mt.pick=null; mt.done=0; mt.miss=0; mt.t0=Date.now();
  clearInterval(mt.tick); mt.tick=setInterval(()=>{ const t=document.getElementById("mtime"); if(!t){clearInterval(mt.tick);return;} t.textContent=((Date.now()-mt.t0)/1000).toFixed(1)+"s"; },100);
  renderMatch(true);

function renderMatch(playing){
  const el=document.getElementById("v-match"); el.innerHTML="";

  if(!playing){
    p.innerHTML='<div class="label">Choose weeks</div>';

  }
  p.innerHTML='<div class="row" style="justify-content:space-between"><span class="label">Tap a term, then its meaning</span><span class="timer" id="mtime">0.0s</span></div>';
  const grid=document.createElement("div"); grid.className="mgrid";
  const L=document.createElement("div"), R=document.createElement("div"); L.className=R.className="mcol";
  shuffle(mt.pairs.map((x,i)=>i)).forEach(i=>{ const b=document.createElement("button"); b.className="mt term"; b.style.cssText=wstyle(mt.pairs[i][0]); b.dataset.i=i; b.innerHTML=`<small>${mt.pairs[i][0]}</small>${esc(mt.pairs[i][1])}`; L.appendChild(b); });
  shuffle(mt.pairs.map((x,i)=>i)).forEach(i=>{ const b=document.createElement("button"); b.className="mt def"; b.dataset.i=i; b.textContent=mt.pairs[i][2]; R.appendChild(b); });
  grid.append(L,R); p.appendChild(grid);
  grid.addEventListener("click",e=>{
    const b=e.target.closest(".mt"); if(!b||b.classList.contains("ok")) return;
    if(b.classList.contains("term")){ grid.querySelectorAll(".term").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); mt.pick=b; return; }
    if(!mt.pick) { b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),400); return; }
    if(b.dataset.i===mt.pick.dataset.i){
      const w=mt.pairs[+b.dataset.i][0]; [b,mt.pick].forEach(x=>{x.classList.remove("sel"); x.classList.add("ok"); x.style.cssText=wstyle(w);});
      mt.pick=null; mt.done++; if(window.hamReact) hamReact(true);
      if(mt.done===mt.pairs.length){
        clearInterval(mt.tick); const secs=(Date.now()-mt.t0)/1000+mt.miss*3; const isBest=!S.matchBest||secs<S.matchBest; if(isBest) S.matchBest=secs; save();
        addXP(25); laurels(isBest?40:18);
        const f=document.createElement("div"); f.style.marginTop="16px";
        f.innerHTML=`<div class="score">${secs.toFixed(1)}s</div><p class="muted">${mt.miss} wrong ${mt.miss===1?"match":"matches"}${isBest?" · New best time!":""}</p>`;
        const a=document.createElement("button"); a.className="btn"; a.textContent="Play again"; a.onclick=startMatch;
        const c=document.createElement("button"); c.className="btn ghost"; c.textContent="Change weeks"; c.style.marginLeft="8px"; c.onclick=()=>renderMatch(false);
        f.append(a,c); p.appendChild(f);
      }
    } else { mt.miss++; b.classList.add("shake","bad"); mt.pick.classList.add("shake"); const pk=mt.pick; setTimeout(()=>{b.classList.remove("shake","bad"); pk.classList.remove("shake");},450); if(window.hamReact) hamReact(false); }
  });
  el.appendChild(p);
}

const WEEKS = Object.keys(DECK);
const id = (w,i) => w+"#"+i;
function boxOf(w,i){ return S.box[id(w,i)]||0; } // 0 new, 1 learning, 2 almost, 3 mastered
function esc(s){ return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function weekChips(sel, onChange){
  const wrap = document.createElement("div"); wrap.className="chips";
  const all = document.createElement("button"); all.className="chip"+(sel.size===WEEKS.length?" on":""); all.textContent="All weeks";
  all.onclick=()=>{ if(sel.size===WEEKS.length){sel.clear();} else {WEEKS.forEach(w=>sel.add(w));} onChange(); };
  wrap.appendChild(all);

  return wrap;
}

/* ---------- flashcards (Leitner) ---------- */
const fc = {sel:new Set(WEEKS), queue:[], cur:null, done:0, flipped:false};
function buildQueue(){
  const items=[];
  fc.sel.forEach(w=>DECK[w].forEach((c,i)=>items.push([w,i])));
  // weaker cards appear more; mastered cards appear once in a while
  let q=[];
  items.forEach(([w,i])=>{ const b=boxOf(w,i); const n = b===3?0:(b===2?1:2); for(let k=0;k<n;k++) q.push([w,i]); if(b===3 && Math.random()<0.25) q.push([w,i]); });
  if(!q.length) q = items.slice();
  // dedupe adjacent
  q = shuffle(q); fc.queue=[]; const seen=new Set();
  q.forEach(x=>{ const k=id(x[0],x[1]); if(!seen.has(k)){seen.add(k); fc.queue.push(x);} });
  fc.done=0; fc.flipped=false; fc.cur=fc.queue.shift()||null;
}
function renderCards(){
  const el=document.getElementById("v-cards"); el.innerHTML="";
  const p=document.createElement("div"); p.className="panel";
  p.innerHTML='<div class="label">Choose weeks</div>';
  p.appendChild(weekChips(fc.sel,()=>{buildQueue();renderCards();}));
  const total = [...fc.sel].reduce((a,w)=>a+DECK[w].length,0);
  const mastered = [...fc.sel].reduce((a,w)=>a+DECK[w].filter((c,i)=>boxOf(w,i)===3).length,0);
  const bar=document.createElement("div");
  bar.innerHTML=`<div class="row" style="justify-content:space-between"><span class="muted">${mastered} of ${total} cards mastered ${fc.streak?`<span class="streak">🔥 ${fc.streak} streak</span>`:""}</span><span class="muted">${fc.queue.length+(fc.cur?1:0)} left this round</span></div><div class="bar" style="margin-top:6px"><i style="width:${total?mastered/total*100:0}%"></i></div>`;
  p.appendChild(bar);
  if(!fc.cur){
    const d=document.createElement("div"); d.style.marginTop="18px";
    d.innerHTML = fc.sel.size? '<p class="qtext">Round complete.</p><p class="muted">Cards you missed will come back more often next round.</p>' : '<p class="muted">Pick at least one week.</p>';
    if(fc.sel.size){ const b=document.createElement("button"); b.className="btn"; b.textContent="Start another round"; b.onclick=()=>{buildQueue();renderCards();}; d.appendChild(b); }
    p.appendChild(d); el.appendChild(p); return;
  }
  const [w,i]=fc.cur; const [q,a]=DECK[w][i]; const b=boxOf(w,i);
  const lvl=["New","Learning","Almost","Mastered"][b];
  const card=document.createElement("div"); card.className="card"+(fc.flipped?" flip":"");
  card.style.cssText=wstyle(w);
  card.innerHTML=`<div class="card-in"><div class="face front"><span class="sym">${WSYM[w]}</span><span class="tag">${w} · ${WTOP[w]} · ${lvl}</span><div class="q">${esc(q)}</div><span class="hint">Tap or press space to flip</span></div><div class="face back"><span class="sym">${WSYM[w]}</span><span class="tag">${w} · ${WTOP[w]}</span><div class="a">${esc(a)}</div></div></div>`;
  card.onclick=()=>{fc.flipped=!fc.flipped; card.classList.toggle("flip",fc.flipped); actions.classList.toggle("hide",!fc.flipped); prompt.classList.toggle("hide",fc.flipped);};
  p.appendChild(card);
  const prompt=document.createElement("p"); prompt.className="muted"+(fc.flipped?" hide":""); prompt.textContent="Say your answer out loud first, then flip.";
  p.appendChild(prompt);
  const actions=document.createElement("div"); actions.className="row"+(fc.flipped?"":" hide");
  const again=document.createElement("button"); again.className="btn bad"; again.textContent="Missed it";
  const close=document.createElement("button"); close.className="btn ghost"; close.textContent="Partly";
  const got=document.createElement("button"); got.className="btn good"; got.textContent="Got it";
  again.onclick=()=>grade(0); close.onclick=()=>grade(1); got.onclick=()=>grade(2);
  actions.append(again,close,got); p.appendChild(actions);
  const k=document.createElement("div"); k.className="kbd"; k.textContent="Keys: space flip · 1 missed · 2 partly · 3 got it"; p.appendChild(k);
  el.appendChild(p);
}
function grade(g){
  const [w,i]=fc.cur; const k=id(w,i); let b=S.box[k]||0;
  if(g===0){ b=1; fc.queue.splice(Math.min(3,fc.queue.length),0,[w,i]); }
  else if(g===1){ b=Math.max(1,Math.min(2,b)); fc.queue.splice(Math.min(8,fc.queue.length),0,[w,i]); }
  else { b=Math.min(3,b+1); }
  S.box[k]=b; save(); if(window.hamReact) hamReact(g!==0); addXP(g===2?10:g===1?5:1); fc.streak=g===2?(fc.streak||0)+1:0; if(fc.streak&&fc.streak%10===0) laurels(24); fc.done++; fc.flipped=false; fc.cur=fc.queue.shift()||null; renderCards();
}
document.addEventListener("keydown",e=>{
  if(document.getElementById("v-cards").classList.contains("hide")||!fc.cur) return;
  if(e.target.tagName==="TEXTAREA") return;
  if(e.code==="Space"){ e.preventDefault(); document.querySelector("#v-cards .card")?.click(); }
  if(fc.flipped){ if(e.key==="1")grade(0); if(e.key==="2")grade(1); if(e.key==="3")grade(2); }
});

const qz = {sel:new Set(WEEKS), items:[], n:0, score:0, answered:false, len:10};
function startQuiz(){
  const pool=QUIZ.filter(x=>qz.sel.has(x[0]));
  qz.items=shuffle(pool).slice(0,Math.min(qz.len,pool.length)).map(x=>({w:x[0],q:x[1],a:x[2],opts:shuffle(x.slice(2))}));
  qz.n=0; qz.score=0; qz.answered=false; qz.celebrated=false; renderQuiz();
}
function renderQuiz(){
  const el=document.getElementById("v-quiz"); el.innerHTML="";
  const p=document.createElement("div"); p.className="panel";
  if(!qz.items.length){
    p.innerHTML='<div class="label">Choose weeks</div>';
    p.appendChild(weekChips(qz.sel,renderQuiz));
    const r=document.createElement("div"); r.className="row";
    r.innerHTML='<span class="muted">Questions:</span>';
    [10,20,30].forEach(n=>{const b=document.createElement("button"); b.className="chip"+(qz.len===n?" on":""); b.textContent=n; b.onclick=()=>{qz.len=n;renderQuiz();}; r.appendChild(b);});
    p.appendChild(r);
    const go=document.createElement("button"); go.className="btn"; go.style.marginTop="16px"; go.textContent="Start quiz"; go.disabled=!qz.sel.size; go.onclick=startQuiz; p.appendChild(go);
    const best=document.createElement("p"); best.className="muted"; best.style.marginTop="12px";
    const hist=WEEKS.filter(w=>S.quiz[w]).map(w=>`${w}: ${S.quiz[w].c}/${S.quiz[w].t} correct overall`);
    best.textContent=(hist.length?hist.join(" · ")+" · ":"")+QUIZ.length+" questions in the bank, each with plausible wrong answers.";
    p.appendChild(best); el.appendChild(p); return;
  }
  if(qz.n>=qz.items.length){
    const pct=Math.round(qz.score/qz.items.length*100); if(!qz.celebrated){ qz.celebrated=true; if(pct>=80) laurels(36); }
    p.innerHTML=`<div class="label">Finished</div><div class="score">${qz.score} / ${qz.items.length}</div><p class="muted">${pct>=80?"Strong. Try an essay drill next.":pct>=50?"Getting there. Run flashcards on the weeks you missed.":"Worth another flashcard round before trying again."}</p>`;
    const r=document.createElement("div"); r.className="row";
    const a=document.createElement("button"); a.className="btn"; a.textContent="Same weeks again"; a.onclick=startQuiz;
    const b=document.createElement("button"); b.className="btn ghost"; b.textContent="Change weeks"; b.onclick=()=>{qz.items=[];renderQuiz();};
    r.append(a,b); p.appendChild(r); el.appendChild(p); return;
  }
  const it=qz.items[qz.n]; p.classList.add("qpanel"); p.style.cssText=wstyle(it.w);
  p.innerHTML=`<div class="row" style="justify-content:space-between"><span class="label"><span class="qtag">${it.w} · ${WTOP[it.w]}</span> · Question ${qz.n+1} of ${qz.items.length}</span><span class="muted">Score ${qz.score}</span></div><div class="bar" style="margin-top:8px"><i style="width:${qz.n/qz.items.length*100}%;background:var(--accent)"></i></div><p class="qtext">${esc(it.q)}</p>`;
  const opts=document.createElement("div"); opts.className="opts";
  it.opts.forEach(o=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=o;
    b.onclick=()=>{ if(qz.answered) return; qz.answered=true; const ok=o===it.a; if(ok) qz.score++;
      const rec=S.quiz[it.w]||{c:0,t:0}; rec.t++; if(ok) rec.c++; S.quiz[it.w]=rec;
      save(); if(window.hamReact) hamReact(ok); if(ok) addXP(15);
      [...opts.children].forEach(x=>{ x.disabled=true; if(x.textContent===it.a) x.classList.add("right"); else if(x===b) x.classList.add("wrong"); });
      next.classList.remove("hide"); };
    opts.appendChild(b); });
  p.appendChild(opts);
  const next=document.createElement("button"); next.className="btn hide"; next.textContent=qz.n+1<qz.items.length?"Next":"See score";
  next.onclick=()=>{qz.n++; qz.answered=false; renderQuiz();};
  p.appendChild(next); el.appendChild(p);
}

function fmt(s){ const m=Math.floor(s/60), x=s%60; return m+":"+String(x).padStart(2,"0"); }
function startEssay(i){

  r.append(rev,back); p.appendChild(r);
  const out=document.createElement("div"); out.className="hide"; out.style.marginTop="16px";
  out.innerHTML='<div class="label">Model outline · tick what your plan covered</div>'+e.o.map((x,k)=>`<label class="check"><input type="checkbox" data-k="${k}"> <span>${esc(x)}</span></label>`).join("")+'<p class="muted" id="cov" style="margin-top:8px"></p>';
  out.addEventListener("change",()=>{ const c=out.querySelectorAll("input:checked").length; out.querySelector("#cov").textContent=`You covered ${c} of ${e.o.length} points.`+(c===e.o.length?" Excellent.":""); if(c===e.o.length&&!out.dataset.c){out.dataset.c=1; laurels(30);} });
  rev.onclick=()=>{ out.classList.remove("hide"); rev.disabled=true; clearInterval(essayState.timer); addXP(40); };
  p.appendChild(out); el.appendChild(p);
  clearInterval(essayState.timer);
  essayState.timer=setInterval(()=>{ essayState.t--; const tm=document.getElementById("tm"); if(!tm){clearInterval(essayState.timer);return;}
    tm.textContent=fmt(Math.max(0,essayState.t)); tm.classList.toggle("low",essayState.t<=60);

}

const sm={i:0};
function renderSummary(){
  const el=document.getElementById("v-summary"); el.innerHTML="";
  const w=WEEKS[sm.i], d=SUMMARY[w];
  const top=document.createElement("div"); top.className="sumnav";
  WEEKS.forEach((x,k)=>{ const b=document.createElement("button"); b.className="dot"+(k===sm.i?" on":""); b.style.cssText=wstyle(x); b.textContent=WSYM[x]; b.title=x+" · "+WTOP[x]; b.onclick=()=>{sm.i=k;renderSummary();}; top.appendChild(b); });
  el.appendChild(top);
  const p=document.createElement("div"); p.className="panel sum"; p.style.cssText=wstyle(w);
  const read=(S.read||{})[w];
  p.innerHTML=`<span class="sym big">${WSYM[w]}</span>
   <div class="label">${w} · ${sm.i+1} of ${WEEKS.length}</div>
   <h2>${WTOP[w]}</h2>
   <p class="bigidea">${esc(d.big)}</p>
   <div class="sumgrid">
     <div><div class="label">Key takeaways</div><ol class="keys">${d.pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
     <div><div class="label">Who said what</div><ul class="who">${d.who.map(x=>`<li><b>${esc(x[0])}</b> ${esc(x[1])}</li>`).join("")}</ul>
     <div class="label" style="margin-top:14px">Cite in the exam</div><div class="cites">${d.cite.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
   </div>
   <div class="label" style="margin-top:18px">Study path</div>`;
  const path=document.createElement("div"); path.className="path";
  const nb=document.createElement("button"); nb.className="btn ghost"; nb.style.marginTop="12px"; nb.textContent="📜 Read the full "+w+" notes"; nb.onclick=()=>{ nt.i=sm.i; nt.q=""; show("notes"); window.scrollTo(0,0); };
  const steps=[["1","Read",read?"Done ✓":"Mark as read",()=>{ S.read=S.read||{}; if(!S.read[w]){S.read[w]=1; save(); addXP(5); laurels(10);} renderSummary(); }],
    ["2","Flashcards",DECK[w].length+" cards",()=>{ fc.sel=new Set([w]); buildQueue(); show("cards"); }],
    ["3","Match","6 terms, timed",()=>{ mt.sel=new Set([w]); startMatch(); show("match"); }],
    ["4","Essay drill","Brigitte Q"+(d.essay+1),()=>{ startEssay(d.essay); show("essay"); }]];
  steps.forEach(([n,t,s,f])=>{ const b=document.createElement("button"); b.className="step"+(n==="1"&&read?" done":""); b.innerHTML=`<span class="n">${n}</span><span><b>${t}</b><small>${s}</small></span>`; b.onclick=f; path.appendChild(b); });
  p.appendChild(path); p.appendChild(nb);
  const nav=document.createElement("div"); nav.className="row"; nav.style.cssText="justify-content:space-between;margin-top:16px";
  const prev=document.createElement("button"); prev.className="btn ghost"; prev.textContent="← "+(sm.i?WEEKS[sm.i-1]:""); prev.disabled=!sm.i; prev.onclick=()=>{sm.i--;renderSummary();};
  const next=document.createElement("button"); next.className="btn ghost"; next.textContent=(sm.i<WEEKS.length-1?WEEKS[sm.i+1]:"")+" →"; next.disabled=sm.i===WEEKS.length-1; next.onclick=()=>{sm.i++;renderSummary();};
  nav.append(prev,next); p.appendChild(nav);
  let x0=null; p.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
  p.addEventListener("touchend",e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>60){ if(dx<0&&sm.i<WEEKS.length-1){sm.i++;renderSummary();} if(dx>0&&sm.i>0){sm.i--;renderSummary();} } });
  el.appendChild(p);
}
document.addEventListener("keydown",e=>{
  if(document.getElementById("v-summary").classList.contains("hide")) return;
  if(e.key==="ArrowRight"&&sm.i<WEEKS.length-1){sm.i++;renderSummary();}
  if(e.key==="ArrowLeft"&&sm.i>0){sm.i--;renderSummary();}
});


/* ---------- profiles and backup ---------- */
function saveProfiles(){ lsSet(PKEY, JSON.stringify(PROFILES)); }
function cleanName(n){ return (n||"").trim().replace(/\s+/g," ").slice(0,24); }
function rerenderAll(){
  renderXP(); buildQueue(); renderCards(); qz.items=[]; renderQuiz(); renderSummary();
  if(!document.getElementById("v-progress").classList.contains("hide")) renderProgress();
  if(!document.getElementById("v-match").classList.contains("hide")) renderMatch(false);
  essayState.active=null; if(!document.getElementById("v-essay").classList.contains("hide")) renderEssayList();
}
function useProfile(n){ CUR=n; lsSet(CKEY,n); S=loadS(n); fc.streak=0; rerenderAll(); if(window.hamSay) hamSay("Welcome, "+esc(n)+"! 🍭",2600); }
function addProfile(n){
  n=cleanName(n); if(!n) return "Type a name first.";
  if(PROFILES.some(p=>p.toLowerCase()===n.toLowerCase())) return "That name is taken on this device.";
  PROFILES.push(n); saveProfiles();
  if(!PROFILES.length || PROFILES.length===1){ const legacy=lsGet(KEY); if(legacy && !lsGet(profKey(n))) lsSet(profKey(n), legacy); }
  useProfile(n); return "";
}
function delProfile(n){ PROFILES=PROFILES.filter(p=>p!==n); saveProfiles(); lsDel(profKey(n)); for(let i=0;i<ESSAYS.length;i++) lsDel(profKey(n)+"-draft-"+i); if(CUR===n){ CUR=null; lsDel(CKEY); S=blankS(); if(PROFILES.length) useProfile(PROFILES[0]); else { rerenderAll(); openProfiles(true); } } }
function exportCode(){ const json=JSON.stringify({v:1,name:CUR,s:S}); return "PHIL1013-"+btoa(unescape(encodeURIComponent(json))); }
function importCode(code){
  code=(code||"").trim(); if(!code.startsWith("PHIL1013-")) return "That doesn't look like a backup code.";
  let d; try{ d=JSON.parse(decodeURIComponent(escape(atob(code.slice(9))))); }catch(e){ return "The code is incomplete or damaged. Copy the whole thing."; }
  if(!d||!d.s||!d.name) return "The code is missing progress data.";
  let n=cleanName(d.name)||"Imported";
  if(!PROFILES.includes(n)){ PROFILES.push(n); saveProfiles(); }
  lsSet(profKey(n), JSON.stringify(Object.assign(blankS(), d.s)));
  useProfile(n); return "";
}
function renderWho(){
  const box=document.getElementById("xp"); if(!box) return;
  let pill=document.getElementById("whoPill");
  if(!pill){ pill=document.createElement("button"); pill.id="whoPill"; pill.className="who-pill"; pill.onclick=()=>openProfiles(false); }
  pill.innerHTML="👤 "+(CUR?esc(CUR):"Choose profile")+" ▾";
  const top=box.querySelector(".xp-top"); if(top) top.prepend(pill);
}
const _renderXP=renderXP; renderXP=function(){ _renderXP(); renderWho(); };
function openProfiles(first){
  document.querySelector(".modal")?.remove();
  const m=document.createElement("div"); m.className="modal";
  const p=document.createElement("div"); p.className="panel";
  if(first){
    p.innerHTML='<h3>Welcome, philosopher</h3><p class="muted" style="margin:0">Enter your name to start. Your progress saves on this device under your name, so friends sharing this device keep their own.</p>';
  } else {
    p.innerHTML='<button class="x" aria-label="Close">×</button><h3>Profiles and backup</h3><p class="muted" style="margin:0">Progress is saved on this device. Use a backup code to move it to another device.</p>';
    p.querySelector(".x").onclick=()=>m.remove();
    const list=document.createElement("div"); list.className="plist";
    PROFILES.forEach(n=>{ const s=loadS(n); const r=document.createElement("div"); r.className="prow"+(n===CUR?" on":"");
      r.innerHTML=`<span><b>${esc(n)}</b><br><small>${s.xp||0} XP · ${LEVELS[levelOf(s.xp||0)][1]}</small></span>`;
      const act=document.createElement("span"); act.className="row";
      if(n!==CUR){ const u=document.createElement("button"); u.className="btn ghost"; u.textContent="Switch"; u.onclick=()=>{useProfile(n); m.remove();}; act.appendChild(u); }
      const del=document.createElement("button"); del.className="btn ghost"; del.textContent="Delete"; let armed=false;
      del.onclick=()=>{ if(!armed){armed=true; del.textContent="Tap again"; return;} delProfile(n); m.remove(); if(PROFILES.length) openProfiles(false); };
      act.appendChild(del); r.appendChild(act); list.appendChild(r); });
    p.appendChild(list);
    const lab=document.createElement("div"); lab.className="label"; lab.textContent="Add someone"; p.appendChild(lab);
  }
  const inp=document.createElement("input"); inp.className="field"; inp.placeholder="Your name"; inp.maxLength=24;
  const go=document.createElement("button"); go.className="btn"; go.textContent=first?"Start studying":"Add profile";
  const msg=document.createElement("div"); msg.className="msg"; msg.style.color="var(--bad)";
  const submit=()=>{ const err=addProfile(inp.value); if(err){ msg.textContent=err; } else m.remove(); };
  go.onclick=submit; inp.onkeydown=e=>{ if(e.key==="Enter") submit(); };
  p.append(inp,go,msg);

  const bl=document.createElement("div"); bl.className="label"; bl.style.marginTop="18px"; bl.textContent=first?"Have a backup code from another device?":"Backup code";
  p.appendChild(bl);
  if(!first && CUR){
    const out=document.createElement("textarea"); out.className="codebox"; out.readOnly=true; out.value=exportCode();
    const cp=document.createElement("button"); cp.className="btn ghost"; cp.textContent="Copy my code";
    const cmsg=document.createElement("div"); cmsg.className="msg muted";
    cp.onclick=()=>{ out.select(); const done=()=>{cmsg.textContent="Copied. Paste it on your other device under Profiles and backup.";};
      if(navigator.clipboard) navigator.clipboard.writeText(out.value).then(done).catch(()=>{ try{document.execCommand("copy");done();}catch(e){cmsg.textContent="Select the code and copy it manually.";} });
      else { try{document.execCommand("copy");done();}catch(e){cmsg.textContent="Select the code and copy it manually.";} } };
    p.append(out,cp,cmsg);
  }
  const imp=document.createElement("textarea"); imp.className="codebox"; imp.placeholder="Paste a backup code here"; imp.style.marginTop="8px";
  const ib=document.createElement("button"); ib.className="btn ghost"; ib.textContent="Restore from code";
  const imsg=document.createElement("div"); imsg.className="msg"; imsg.style.color="var(--bad)";
  ib.onclick=()=>{ const err=importCode(imp.value); if(err) imsg.textContent=err; else { m.remove(); laurels(20); } };
  p.append(imp,ib,imsg);
  m.appendChild(p); document.body.appendChild(m);
  if(!first) m.addEventListener("click",e=>{ if(e.target===m) m.remove(); });
  setTimeout(()=>inp.focus(),50);
}

const nt={i:0,q:""};
function renderNotes(){
  const el=document.getElementById("v-notes"); el.innerHTML="";
  const top=document.createElement("div"); top.className="sumnav";
  WEEKS.forEach((x,k)=>{ const b=document.createElement("button"); b.className="dot"+(k===nt.i&&!nt.q?" on":""); b.style.cssText=wstyle(x); b.textContent=WSYM[x]; b.title=x+" · "+WTOP[x]; b.onclick=()=>{nt.i=k; nt.q=""; renderNotes(); window.scrollTo(0,0);}; top.appendChild(b); });
  el.appendChild(top);
  const sb=document.createElement("input"); sb.className="field search"; sb.type="search"; sb.placeholder="Search all notes, e.g. Gettier, transitivity, pig"; sb.value=nt.q;
  let t; sb.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ nt.q=sb.value.trim(); renderNotes(); const s=document.querySelector("#v-notes .search"); s.focus(); s.setSelectionRange(s.value.length,s.value.length); },250); };
  el.appendChild(sb);
  const p=document.createElement("div"); p.className="panel notes";
  if(nt.q.length>=2){
    const q=nt.q.toLowerCase(); let total=0;
    const re=new RegExp("("+nt.q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    WEEKS.forEach((w,k)=>{
      const tmp=document.createElement("div"); tmp.innerHTML=NOTES[w];
      const hits=[...tmp.querySelectorAll("p,li,tr,blockquote")].filter(n=>!n.querySelector("li")&&n.textContent.toLowerCase().includes(q));
      if(!hits.length) return; total+=hits.length;
      const sec=document.createElement("div"); sec.className="hitsec"; sec.style.cssText=wstyle(w);
      sec.innerHTML=`<div class="hithead"><b>${WSYM[w]} ${w}</b> · ${WTOP[w]} · ${hits.length} ${hits.length===1?"match":"matches"}</div>`;
      hits.slice(0,12).forEach(n=>{ const d=document.createElement("div"); d.className="hit"; d.innerHTML=esc(n.textContent.trim()).replace(re,"<mark>$1</mark>"); sec.appendChild(d); });
      const open=document.createElement("button"); open.className="btn ghost"; open.textContent="Open "+w+" notes"; open.onclick=()=>{nt.i=k; nt.q=""; renderNotes(); window.scrollTo(0,0);}; sec.appendChild(open);
      p.appendChild(sec);
    });
    if(!total) p.innerHTML='<p class="muted">No matches. Try a shorter word.</p>';
    el.appendChild(p); return;
  }
  const w=WEEKS[nt.i]; p.style.cssText=wstyle(w);
  p.innerHTML=`<span class="sym big">${WSYM[w]}</span><div class="label">${w} · full notes</div><h2>${WTOP[w]}</h2>`;
  const body=document.createElement("div"); body.className="md"; body.innerHTML=NOTES[w];
  const heads=[...body.querySelectorAll("h2")];
  if(heads.length){ const toc=document.createElement("div"); toc.className="toc";
    heads.forEach((h,j)=>{ h.id="n-"+j; const b=document.createElement("button"); b.className="chip"; b.textContent=h.textContent; b.onclick=()=>h.scrollIntoView({behavior:"smooth",block:"start"}); toc.appendChild(b); });
    p.appendChild(toc); }
  p.appendChild(body);
  const nav=document.createElement("div"); nav.className="row"; nav.style.cssText="justify-content:space-between;margin-top:18px";
  const prev=document.createElement("button"); prev.className="btn ghost"; prev.textContent="← "+(nt.i?WEEKS[nt.i-1]:""); prev.disabled=!nt.i; prev.onclick=()=>{nt.i--;renderNotes();window.scrollTo(0,0);};
  const sumb=document.createElement("button"); sumb.className="btn ghost"; sumb.textContent="Back to summary"; sumb.onclick=()=>{sm.i=nt.i; show("summary");};
  const next=document.createElement("button"); next.className="btn ghost"; next.textContent=(nt.i<WEEKS.length-1?WEEKS[nt.i+1]:"")+" →"; next.disabled=nt.i===WEEKS.length-1; next.onclick=()=>{nt.i++;renderNotes();window.scrollTo(0,0);};
  nav.append(prev,sumb,next); p.appendChild(nav);
  el.appendChild(p);
}

/* ---------- progress ---------- */
function renderProgress(){
  const el=document.getElementById("v-progress"); el.innerHTML="";
  const p=document.createElement("div"); p.className="panel";
  p.innerHTML='<div class="label">Your progress</div><p class="muted" style="margin:6px 0 0">Saved on this device under your profile. Use a backup code to move it to another device. A card counts as mastered after three correct answers.</p>';
  const g=document.createElement("div"); g.className="stats";
  WEEKS.forEach(w=>{ const n=DECK[w].length; const m=DECK[w].filter((c,i)=>boxOf(w,i)===3).length; const seen=DECK[w].filter((c,i)=>boxOf(w,i)>0).length; const qr=S.quiz[w];
    const d=document.createElement("div"); d.className="stat"; d.style.cssText=wstyle(w);
    d.innerHTML=`<b>${WSYM[w]} ${w}</b> <small>${WTOP[w]}</small><div class="bar" style="margin:8px 0 6px"><i style="width:${m/n*100}%"></i></div><small>${m}/${n} mastered · ${seen} seen${qr?` · quiz ${Math.round(qr.c/qr.t*100)}%`:""}</small>`;
    d.style.cursor="pointer"; d.onclick=()=>{ fc.sel=new Set([w]); buildQueue(); renderCards(); show("cards"); };
    g.appendChild(d); });
  p.appendChild(g);
  const r=document.createElement("div"); r.className="row"; r.style.marginTop="16px";
  const pb=document.createElement("button"); pb.className="btn"; pb.textContent="Profiles and backup code"; pb.onclick=()=>openProfiles(false); r.appendChild(pb);
  const reset=document.createElement("button"); reset.className="btn ghost"; reset.textContent="Reset my progress";
  let armed=false;
  reset.onclick=()=>{ if(!armed){armed=true; reset.textContent="Tap again to confirm"; return;} S=blankS(); save(); renderXP(); buildQueue(); renderProgress(); };
  r.appendChild(reset); p.appendChild(r);
  el.appendChild(p);
}

renderXP(); buildQueue(); renderCards(); renderQuiz(); renderSummary();

<script>
(function(){
  const img=document.getElementById("hamImg"), say=document.getElementById("hamSay");
  let streak=0, taps=0, hideT;
  const TAP=[
    "Thesis first. Always answer the actual question.",
    "Every essay needs an objection AND a reply.",
    "Knowledge is like promising. Belief is like intending. (Austin)",
    "Accidentally justified true belief isn't knowledge. (Gettier)",
    "Let us not pretend to doubt in philosophy what we do not doubt in our hearts.",
    "Identity is transitive. Two of you can't both be you.",
    "Connectedness comes in degrees. Continuity doesn't.",
    "True beliefs run away unless you tie them down. Like me with this lollipop.",
    "The banality is in the doer, not the deed.",
    "Default entitlements: non arbitrary, but not self justifying.",
    "Four short essays. Use both sections.",
    "Squeak. You've got this."
  ];
  const GOOD=["Yes!","Nailed it.","Daedalus would be proud.","Fastened by a chain!","Big brain energy.","Socrates approves."];
  const BAD=["Next time!","That one's coming back.","Even Descartes doubted.","Fallibilism, baby.","Neurath's boat: patch and sail on."];
  function play(cls){ img.classList.remove("hop","spin","shake"); void img.offsetWidth; img.classList.add(cls); }
  function speak(t,ms){ clearTimeout(hideT); say.innerHTML=t; say.classList.add("show"); hideT=setTimeout(()=>say.classList.remove("show"),ms||3200); }
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  img.addEventListener("click",()=>{ taps++;
    if(taps%10===0){ play("spin"); speak("That's "+taps+" boops. Shouldn't you be studying? 🍭"); }
    else { play("hop"); speak(pick(TAP)); } });
  window.hamSay=speak;
  window.hamReact=function(ok){
    if(ok){ streak++; play(streak%5===0?"spin":"hop"); if(streak%5===0) speak(streak+" in a row! 🍭<span class=\"count\">Streak</span>",2600); else if(Math.random()<.35) speak(pick(GOOD),1600); }
    else { streak=0; play("shake"); if(Math.random()<.5) speak(pick(BAD),1800); }
  };
  setTimeout(()=>{ if(CUR) speak("Hi "+esc(CUR)+"! Tap me for tips."); },900);
})();
</script>
