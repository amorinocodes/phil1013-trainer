e can never establish that bodies and souls are correlated.<\/p>\n<p><strong>Perry's chocolates:<\/strong> Sam Miller picks a chocolate with a certain swirl because he knows it means caramel. Weirob: you learned that by biting into many. Could you have established \"same swirl, same filling\" if you'd never been allowed to bite into one? No. And \"you can never, so to speak, bite into my soul\". So the inference from same body to same soul is groundless.<\/p>\n<p><strong>Perry's Barbara Walters case:<\/strong> Miller reasons \"same body, same self\". He'd conclude that if Barbara Walters' body were in the bed, it wasn't Weirob. Weirob: then extend it to Heaven: your body rots, so different body, different person. Miller: the body and soul correlation is an earthly regularity, like January and snow, which fails in southern California. Weirob: but where did you get the correlation in the first place?<\/p>\n<p><strong>3. Psychology as the link?<\/strong> Maybe memories, beliefs and desires are properties of the soul, and we can observe those. Same body goes with same psychology goes with same soul. And it makes sense: what I care about is bound up with my psychology. (Brain wipe: no memories, desires, beliefs, values. Did you survive?)<\/p>\n<p><strong>Problems with the link:<\/strong><\/p>\n<ul>\n<li>Psychology is realised in the <strong>brain<\/strong>: damage the brain and you damage memories and beliefs. So psychology is attached to the body, not to the soul.<\/li>\n<li><strong>Perry's river:<\/strong> you recognise the Blue River by the state of its water (brown, sluggish, filthy). But each time it's <em>different water<\/em>. Similar states don't require the same water. Likewise, similar psychology doesn't require the same soul. A new, psychologically similar soul could take over every day, every five minutes, or in a constant flow, and \"you cannot see it or touch it, so how would you know?\"<\/li>\n<li>Even if psychology were immaterial and attached to the soul, psychology changes over time. So how do we know a change in psychology isn't a change of soul?<\/li>\n<li>Miller's fallback, his own case: \"How can I doubt that I am the same person I was?\" Weirob: no one doubts you're the same <em>person<\/em>. The question is whether you can know it's the same <em>soul<\/em>. Given the five rival hypotheses, you can't.<\/li>\n<\/ul>\n<p><strong>Weirob's conclusion:<\/strong> if personal identity were sameness of soul, we'd have no idea who anyone is. But we do know who people are. So <strong>personal identity doesn't consist in sameness of an immaterial soul<\/strong>.<\/p>\n<p><strong>4. Why care about souls at all?<\/strong> If my psychology could come apart from my soul, why care about the soul? The lecture: if you tell me I have a non physical <strong>\"HAZON\"<\/strong>, separate from my body and psychology, undetectable, with no influence on me, I'll say \"that's weird\", not \"I see, I am that HAZON\". And if an all knowing demon told me a new soul joined my body every day, I wouldn't conclude I haven't persisted. I'd say: souls, who cares? I am not my soul.<\/p>\n<h2>Key terms<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<th>Who<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pragmatism<\/td>\n<td>Philosophy giving priority to practice and the agent's view, inspired by Darwin<\/td>\n<td>Peirce, James, Dewey<\/td>\n<\/tr>\n<tr>\n<td>Convergence theory of truth<\/td>\n<td>Truth is the opinion all inquirers are fated to agree on<\/td>\n<td>Peirce<\/td>\n<\/tr>\n<tr>\n<td>Belief<\/td>\n<td>A habit of action; calm, stable, absence of doubt<\/td>\n<td>Peirce<\/td>\n<\/tr>\n<tr>\n<td>Doubt<\/td>\n<td>Wavering, unsettled, paralysing; drives inquiry<\/td>\n<td>Peirce<\/td>\n<\/tr>\n<tr>\n<td>Tenacity / authority / a priori / science<\/td>\n<td>The four methods of fixing belief<\/td>\n<td>Peirce<\/td>\n<\/tr>\n<tr>\n<td>Realist hypothesis<\/td>\n<td>There are Reals independent of our opinions<\/td>\n<td>Peirce<\/td>\n<\/tr>\n<tr>\n<td>Democratic experimentalism<\/td>\n<td>Science as open, free, critical, consensus seeking inquiry<\/td>\n<td>Pragmatists<\/td>\n<\/tr>\n<tr>\n<td>Fallibilism<\/td>\n<td>Nothing is absolutely certain or beyond revision<\/td>\n<td>Peirce<\/td>\n<\/tr>\n<tr>\n<td>Paper doubt<\/td>\n<td>Pretended, philosophical doubt with no real reason<\/td>\n<td>Peirce<\/td>\n<\/tr>\n<tr>\n<td>Neurath's boat<\/td>\n<td>Revising beliefs while relying on the rest<\/td>\n<td>Neurath<\/td>\n<\/tr>\n<tr>\n<td>Cable vs chain<\/td>\n<td>Many connected arguments, not one thread<\/td>\n<td>Peirce<\/td>\n<\/tr>\n<tr>\n<td>Prudence<\/td>\n<td>Acting to promote your own wellbeing<\/td>\n<td>Self lecture 1<\/td>\n<\/tr>\n<tr>\n<td>Pro tanto reason<\/td>\n<td>A reason that counts in favour but can be outweighed<\/td>\n<td>Self lecture 1<\/td>\n<\/tr>\n<tr>\n<td>Desire satisfaction theory<\/td>\n<td>Wellbeing is getting what you desire<\/td>\n<td>Self lecture 1<\/td>\n<\/tr>\n<tr>\n<td>Objective list theory<\/td>\n<td>Wellbeing is having listed goods, desired or not<\/td>\n<td>Self lecture 1<\/td>\n<\/tr>\n<tr>\n<td>Numerical identity<\/td>\n<td>Being one and the same thing<\/td>\n<td>Self lecture 1<\/td>\n<\/tr>\n<tr>\n<td>Qualitative identity<\/td>\n<td>Being exactly alike<\/td>\n<td>Self lecture 1<\/td>\n<\/tr>\n<tr>\n<td>Endurantism<\/td>\n<td>The very same object exists wholly at different times<\/td>\n<td>Self lecture 1<\/td>\n<\/tr>\n<tr>\n<td>Soul view<\/td>\n<td>You are your soul; you survive iff it does<\/td>\n<td>Miller in Perry<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Things to cite in the exam<\/h2>\n<ul>\n<li><strong>Peirce, \"Let us not pretend to doubt in philosophy what we do not doubt in our hearts.\"<\/strong><\/li>\n<li><strong>\"We cannot begin with complete doubt\"<\/strong>; the North Pole route to Constantinople.<\/li>\n<li><strong>\"The irritation of doubt\"... \"the sole object of inquiry is the settlement of opinion.\"<\/strong><\/li>\n<li><strong>The ostrich<\/strong> (tenacity); <strong>intellectual slaves<\/strong> (authority); <strong>metaphysics as taste<\/strong> (a priori).<\/li>\n<li><strong>The cable vs the chain.<\/strong><\/li>\n<li><strong>The pig decoy factory / Hollywood set:<\/strong> a positive reason to doubt.<\/li>\n<li><strong>Neurath's boat.<\/strong><\/li>\n<li><strong>Clark Kent and Superman; Jeremy and \"Jerald\":<\/strong> numerical identity.<\/li>\n<li><strong>Perry:<\/strong> Weirob in hospital after a motorcycle accident; the Kleenex box (similar vs identical); Barbara Walters' body; the chocolates; the Blue River.<\/li>\n<li><strong>The HAZON<\/strong> and the soul swapping demon.<\/li>\n<\/ul>\n<h2>Objections and replies<\/h2>\n<p><strong>Against Peirce's response to Descartes<\/strong><\/p>\n<ul>\n<li><em>Changing the subject:<\/em> the sceptic asks whether we <em>could<\/em> be deceived, not whether we actually doubt. Pointing out that our doubt isn't real doesn't show our beliefs are true. Reply: for a pragmatist, belief and doubt are tied to action; a doubt that changes nothing in practice is idle (\"merest babble\").<\/li>\n<li><em>Circularity:<\/em> the scientific method assumes Reals, then is used to support Reals. Peirce's reply: the method never generates doubt about them, and the dissatisfaction of doubt already presupposes there's one thing a proposition should represent.<\/li>\n<li><em>Truth as convergence:<\/em> what if inquiry never converges, or converges on falsehood? The \"fated\" consensus seems to need a guarantee.<\/li>\n<li><em>Isn't fallibilism a concession to the sceptic?<\/em> No: fallibilism admits anything <em>might<\/em> be revised, but denies we need certainty to know. That's the Radford and Austin lesson too.<\/li>\n<\/ul>\n<p><strong>Against Weirob (defending the soul view)<\/strong><\/p>\n<ul>\n<li><em>Miller's own case:<\/em> he can know from the inside that one soul goes with his body. Weirob: one case can't support billions, and even in his own case he can't rule out a flow of similar souls.<\/li>\n<li><em>Epistemology isn't metaphysics:<\/em> not being able to <em>tell<\/em> whether souls persist doesn't show they don't. Reply: if identity were sameness of soul, our ordinary, secure knowledge of who people are would be groundless. Since it isn't, identity isn't sameness of soul.<\/li>\n<li><em>Faith:<\/em> a believer may accept souls without evidence (Week 7: faith is belief without reason). But that gives up on the soul view explaining our everyday identity judgments.<\/li>\n<\/ul>\n<h2>Connections<\/h2>\n<ul>\n<li><strong>Week 8:<\/strong> Peirce's default and challenge structure is the default entitlement solution to Agrippa, and his paper doubt answers Descartes.<\/li>\n<li><strong>Week 7:<\/strong> Austin's relevant doubts; Craig's interested inquirer (\"facts about what?\").<\/li>\n<li><strong>Week 6 to 7:<\/strong> fallibilism matches Radford and Austin (knowledge without certainty).<\/li>\n<li><strong>Week 10:<\/strong> from identity to psychological continuity, fission and perdurantism.<\/li>\n<li><strong>Week 8 (Descartes):<\/strong> the soul view resembles Descartes's mind as a thinking thing separate from the body.<\/li>\n<\/ul>\n<h2>Practice questions<\/h2>\n<p><strong>1. How do pragmatists respond to Descartes's Evil Demon Hypothesis? Do you agree? (Brigitte's Q4)<\/strong><\/p>\n<ol>\n<li><strong>The hypothesis:<\/strong> an all powerful deceiver feeds us experiences as if there were an external world. Descartes uses it to show we lack scientia (the meditator's argument).<\/li>\n<li><strong>Pragmatist starting points:<\/strong> belief is a habit of action; doubt is an unsettled, paralysing state that drives inquiry; inquiry aims at settled opinion.<\/li>\n<li><strong>The response:<\/strong> the demon gives only <strong>paper doubt<\/strong>. \"We cannot begin with complete doubt.\" Real doubt needs a <strong>positive reason<\/strong> in a particular case (decoy factory, film set). \"Let us not pretend to doubt in philosophy what we do not doubt in our hearts.\"<\/li>\n<li><strong>Inquiry is social and has no pure form:<\/strong> no community of inquirers doubts the external world, and inquiry needs a specific question (\"facts about what?\").<\/li>\n<li><strong>Fallibilist, not dogmatic:<\/strong> they don't claim certainty. Anything could be revised given a real reason (Neurath's boat). So they concede we lack Cartesian certainty but deny we need it.<\/li>\n<li><strong>Objection:<\/strong> this changes the subject. The sceptic's question is whether we can <em>rule out<\/em> the demon, not whether we feel doubt.<\/li>\n<li><strong>Reply:<\/strong> link to Austin and Craig: knowledge only requires excluding relevant possibilities, and a hypothesis that makes no practical difference is not relevant. Also, Descartes himself calls the doubt \"metaphysical\" and unlivable.<\/li>\n<li><strong>Your verdict:<\/strong> e.g. agree that the pragmatist dissolves the threat to ordinary knowledge, while admitting the bare logical possibility isn't refuted.<\/li>\n<\/ol>\n<p><strong>2. What is the soul view of personal identity? Do you agree with it? (first half of Brigitte's Q5)<\/strong> Skeleton: identity and prudence; numerical vs qualitative identity; the soul view (you go where your soul goes; not your body); Weirob's arguments: undetectability, the correlation problem (chocolates), psychology isn't evidence of the same soul (Blue River), the five hypotheses; the HAZON point (why care about souls?); conclude against, pointing to psychological continuity (Week 10) for the second half of Q5.<\/p>\n<p><strong>3. Why is the scientific method the best of Peirce's four?<\/strong> Skeleton: belief and doubt; tenacity, authority, a priori each with their problem (social impulse, intellectual slavery, taste); their pros; only science distinguishes right from wrong ways to the truth and fits the realist hypothesis; science as democratic experimentalism, extendable to other fields; objection: circularity; Peirce's reply.<\/p>\n<p><strong>4. What is prudence, and does identity explain why we should care about our future selves?<\/strong> Skeleton: prudence and pro tanto reasons; desire satisfaction vs objective list; the identity answer and endurantism; the soul version fails (Weirob); preview fission (Week 10) as a problem for identity in general.<\/p>\n<p><strong>Quick self test<\/strong><\/p>\n<ul>\n<li>Name the three founding pragmatists. What inspired them?<\/li>\n<li>Why does Peirce start with belief rather than knowledge?<\/li>\n<li>State the convergence theory of truth.<\/li>\n<li>Give each of the four methods, its kind of faith or reason, and its problem.<\/li>\n<li>What is Neurath's boat?<\/li>\n<li>What are \"paper doubt\" and \"real and living doubt\"?<\/li>\n<li>What's the difference between a pro tanto and an all things considered reason?<\/li>\n<li>Why does the desire satisfaction theory struggle?<\/li>\n<li>Distinguish numerical and qualitative identity with an example of each.<\/li>\n<li>What is the chocolates argument? The Blue River argument?<\/li>\n<li>What is the HAZON point?<\/li>\n<\/ul>", "Week 10": "<h2>Overview<\/h2>\n<p>This week tests the idea that <strong>identity<\/strong> grounds prudence. A teletransporter that makes two of you suggests it doesn't: you'd still care about both, though you can't be identical with both. Then a different picture: <strong>perdurantism<\/strong>, where you're a big self made of many little selves linked by <strong>continuity<\/strong>, psychological or bodily. This is the core of Brigitte's Q5 (soul vs psychological continuity) and Q6 (the teletransporter).<\/p>\n<h2>Does identity ground prudence?<\/h2>\n<p><strong>The identity view:<\/strong> you have reason to promote your future self's wellbeing because it <em>is you<\/em>. Set souls aside; just focus on identity.<\/p>\n<h3>The doubled teletransporter (Star Trek; it happened to Will Riker)<\/h3>\n<ol>\n<li>A teletransporter normally sends you from one place to another. Today it makes <strong>two<\/strong> of you, exactly alike, at A and at C.<\/li>\n<li>You know this will happen and can't stop it. An oracle tells you both the A person and the C person will be kidnapped and tortured for a day on arrival.<\/li>\n<li>You can pay $500 (easily affordable) to prevent both tortures.<\/li>\n<li>Most of us think we would, and <strong>should<\/strong>, pay. Not just for moral reasons, but <strong>prudential<\/strong> ones: it's <em>me<\/em> who'll be tortured.<\/li>\n<li>Compare the normal case (only A): you'd obviously pay. Being transported <em>twice<\/em> doesn't seem to remove the worry.<\/li>\n<\/ol>\n<h3>Why you can't be identical with both: transitivity<\/h3>\n<ul>\n<li>A guy and C guy are two people, so they're <strong>not numerically identical with each other<\/strong>.<\/li>\n<li>Natural thought: you're identical with both. If C hadn't appeared you'd be A; if A hadn't, you'd be C. Surely C's appearing doesn't undo your being A.<\/li>\n<li>But identity is <strong>transitive<\/strong>: if x = y and y = z, then x = z. (Other transitive relations: taller than, richer than. Clark Kent = Superman, Superman = Kal El, so Clark Kent = Kal El.)<\/li>\n<li>If you = A and you = C, then A = C. But there are two of them. <strong>Contradiction.<\/strong><\/li>\n<li>Saying you're A but not C (or vice versa) is arbitrary, since they're exactly alike.<\/li>\n<li>So many philosophers conclude you're identical with <strong>neither<\/strong>. <strong>You don't survive.<\/strong><\/li>\n<\/ul>\n<h3>The upshot<\/h3>\n<p>Even so, it still seems you should pay the $500. If only A appeared you'd pay, and it's very odd that someone <em>also<\/em> appearing at C should leave you with <strong>no reason<\/strong> to pay. So you <strong>still have prudential reasons without any future self identical with you<\/strong>. Therefore it's <strong>not identity that grounds prudence<\/strong>.<\/p>\n<h2>Not identity, but something else: perdurantism<\/h2>\n<h3>The problem of change<\/h3>\n<p>Freddie's self at t is tired, at t1 not tired, at t2 muddy, at t3 not muddy. How can the tired self be numerically identical with the not tired one? Identical things must share all properties (Clark Kent and Superman are alike in every property because there's just one guy).<\/p>\n<p><strong>The endurantist's fix:<\/strong> Freddie has one set of time indexed properties: tired at t, not tired at t1, muddy at t2, not muddy at t3. That doesn't make it the right view, though.<\/p>\n<h3>Perdurantism<\/h3>\n<ul>\n<li>There are many selves, each existing at a different time, lined up through time. They're <strong>numerically distinct<\/strong>, but all <strong>parts of a bigger self<\/strong> stretched out through time.<\/li>\n<li>Analogy: you're extended in <strong>space<\/strong> by having parts (hands, legs, feet). On this view you're extended in <strong>time<\/strong> by having temporal parts.<\/li>\n<li><strong>Perdurantism:<\/strong> people are extended through time by being made up of many numerically distinct little selves.<\/li>\n<li>On this view my current self has reason to promote my future self's wellbeing because both are <strong>parts of one giant self<\/strong>.<\/li>\n<\/ul>\n<h3>What makes little selves parts of the same self?<\/h3>\n<p>Some combination of <strong>similarity and causal connection<\/strong>:<\/p>\n<ul>\n<li><strong>Psychological connections:<\/strong> you a moment ago and now share very similar beliefs, desires, values, projects, memories, perceptions. Form the belief Freddie is a labradoodle, and you still have it; see a chair, and you remember seeing it; like rhubarb, and you still do; plan spaghetti for lunch, and you still plan it.<\/li>\n<li><strong>Causal connections:<\/strong> get a tattoo and look down, there it is; your earlier self ate, so you're full. How you are now causally depends on your earlier self.<\/li>\n<\/ul>\n<p><strong>But connectedness alone fails:<\/strong> you now are barely connected to your 8 month old or 89 year old self, and probably more connected to the person sitting next to you, who surely isn't part of you.<\/p>\n<p><strong>Continuity, not connectedness:<\/strong> there's a <strong>chain<\/strong> of psychological and causal connections running from your 8 month old self to now (and on to 89). S1 is connected to S2, S2 to S3, and so on, even though S1 may be quite unlike S200. When such chains hold, there's a <strong>continuity relation<\/strong>, and two selves are parts of the same big self when they're continuous.<\/p>\n<h3>Psychological vs bodily continuity<\/h3>\n<p>Which continuity matters? Similar beliefs, values, memories, projects? Some say it's not psychological at all but <strong>bodily<\/strong>: similarity of the body or organism, causally dependent, in a chain. This is one of the biggest divides in the debate.<\/p>\n<table>\n<thead>\n<tr>\n<th>Case<\/th>\n<th>Psychological continuity says<\/th>\n<th>Bodily continuity says<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Brain wipe:<\/strong> my memories and experiences are copied, my brain wiped, and they're put into another, empty brain in another body<\/td>\n<td>I wake up in the new body. I've switched bodies, because that person is psychologically continuous with me.<\/td>\n<td>I didn't switch bodies. My mind was erased; I'm the wiped body with no mental states.<\/td>\n<\/tr>\n<tr>\n<td><strong>Teletransporter:<\/strong> copies all brain and body states, destroys the matter here, builds a duplicate there from new matter<\/td>\n<td>You <strong>survive<\/strong>: the person who steps out is psychologically continuous with you.<\/td>\n<td>You <strong>die<\/strong>, and a clone who isn't you is created, since there's no bodily continuity.<\/td>\n<\/tr>\n<tr>\n<td><strong>Gradual robot:<\/strong> over a week all my organic matter is replaced with inorganic matter<\/td>\n<td>(Likely survive, if psychology is preserved.)<\/td>\n<td>If \"body\" means human body or human animal, the robot isn't the same body, so I don't survive.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Next question (Week 11):<\/strong> if you're made of many distinct little selves, why should your current self care about future selves that are <em>not the same self<\/em>?<\/p>\n<h2>Key terms<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Transitivity<\/td>\n<td>If x R y and y R z, then x R z; identity is transitive<\/td>\n<\/tr>\n<tr>\n<td>Fission / branching<\/td>\n<td>One person splits into two qualitatively identical successors<\/td>\n<\/tr>\n<tr>\n<td>Perdurantism<\/td>\n<td>People are extended in time by having numerically distinct temporal parts (little selves)<\/td>\n<\/tr>\n<tr>\n<td>Psychological connectedness<\/td>\n<td>Direct similarity of beliefs, memories, values, plans between nearby selves; comes in degrees<\/td>\n<\/tr>\n<tr>\n<td>Psychological continuity<\/td>\n<td>Overlapping chains of connectedness; does not come in degrees<\/td>\n<\/tr>\n<tr>\n<td>Causal connectedness<\/td>\n<td>Later selves causally depend on earlier ones<\/td>\n<\/tr>\n<tr>\n<td>Bodily continuity<\/td>\n<td>Chains of bodily similarity and causal dependence<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Things to cite<\/h2>\n<ul>\n<li><strong>Will Riker<\/strong> and the doubled teletransporter; the oracle, the torture, the $500.<\/li>\n<li><strong>Transitivity:<\/strong> Clark Kent = Superman = Kal El; taller than, richer than.<\/li>\n<li><strong>Freddie<\/strong> tired and not tired (the problem of change); time indexed properties.<\/li>\n<li><strong>Spatial parts analogy<\/strong> (hands, legs) for temporal parts.<\/li>\n<li><strong>Labradoodle belief, rhubarb, spaghetti plan, tattoo:<\/strong> connections.<\/li>\n<li><strong>8 month old and 89 year old self vs the person next to you:<\/strong> connectedness isn't enough, continuity is needed.<\/li>\n<li><strong>Brain wipe, teletransporter, gradual robot:<\/strong> psychological vs bodily continuity.<\/li>\n<\/ul>\n<h2>Objections and replies<\/h2>\n<ul>\n<li><em>Fission for psychological continuity:<\/em> both A and C are psychologically continuous with you, so continuity seems to make you both. Standard fix: add a <strong>non branching<\/strong> clause (continuity counts only if it doesn't branch). But then whether you survive depends on whether some <em>other<\/em> person also appears, which seems absurd. Parfit (Week 11) concludes identity isn't what matters.<\/li>\n<li><em>Bodily continuity and the brain wipe:<\/em> most people's intuition is that you'd go with your memories, which favours psychology.<\/li>\n<li><em>Psychological continuity and duplicates:<\/em> a copy has your psychology too; the Week 11 fix is to require causal connection.<\/li>\n<li><em>Perdurantism and prudence:<\/em> if my future selves are distinct from me, why care about them? (Week 11.)<\/li>\n<\/ul>\n<h2>Connections<\/h2>\n<ul>\n<li><strong>Week 9:<\/strong> the soul view fails; this week offers the alternatives.<\/li>\n<li><strong>Week 11:<\/strong> Parfit on why identity isn't what matters; little selves and rationality (Brigitte's Q7).<\/li>\n<li><strong>Week 12:<\/strong> connectedness comes in degrees, the basis of the argument for near bias (Brigitte's Q8).<\/li>\n<\/ul>\n<h2>Practice questions<\/h2>\n<p><strong>1. What is the soul view of personal identity and how does it differ from the psychological continuity view? Do you agree with either? (Brigitte's Q5)<\/strong><\/p>\n<ol>\n<li><strong>Frame:<\/strong> what makes a future self mine? The identity answer.<\/li>\n<li><strong>Soul view:<\/strong> you are your immaterial soul; same soul, same person; you can survive the body's death.<\/li>\n<li><strong>Psychological continuity view:<\/strong> you persist through overlapping chains of psychological connections (beliefs, memories, values, plans), with the right causal connections.<\/li>\n<li><strong>Differences:<\/strong> souls are undetectable and all or nothing; continuity is observable and built from connectedness that comes in degrees. The soul view makes our everyday identity judgments groundless (Weirob); continuity explains them. The soul view ties identity to something we don't care about (the HAZON); continuity ties it to what we do care about. Continuity can branch (fission); a soul can't.<\/li>\n<li><strong>Against the soul view:<\/strong> Perry's chocolates and Blue River arguments.<\/li>\n<li><strong>Against psychological continuity:<\/strong> duplicates (fixed by causal connection) and fission (non branching clause looks ad hoc).<\/li>\n<li><strong>Verdict:<\/strong> e.g. reject the soul view; accept psychological continuity as the best account of what matters, perhaps with Parfit's twist that what matters isn't identity at all.<\/li>\n<\/ol>\n<p><strong>2. How would you respond to the teletransporter case? Argue with reference to the views discussed. (Brigitte's Q6)<\/strong><\/p>\n<ol>\n<li><strong>The case:<\/strong> your brain and body states are scanned, your matter destroyed, and an exact duplicate built elsewhere from new matter.<\/li>\n<li><strong>Map the views:<\/strong><ul>\n<li><em>Soul view:<\/em> depends whether the soul goes along, which we can't know, so the view gives no usable answer.<\/li>\n<li><em>Bodily continuity:<\/em> you die; a clone is made.<\/li>\n<li><em>Psychological continuity:<\/em> you survive; the person who steps out is continuous with you (if the right causal link counts).<\/li>\n<\/ul>\n<\/li>\n<li><strong>The doubled version:<\/strong> two of you appear at A and C. Transitivity means you can't be both, and choosing one is arbitrary, so you survive as neither. Yet you'd still pay the $500 to spare them.<\/li>\n<li><strong>Conclusion from the doubled case:<\/strong> what matters prudentially isn't identity. In the single case you have everything that matters (psychological continuity and connectedness), so it's as good as ordinary survival (Parfit, Week 11).<\/li>\n<li><strong>Objection:<\/strong> but the original is destroyed, it <em>feels<\/em> like death. Reply: in the doubled case you'd care about both, so what you care about is the continuity, not the matter.<\/li>\n<li><strong>Your verdict:<\/strong> step in, or don't, and say which view you're relying on.<\/li>\n<\/ol>\n<p><strong>3. Does identity ground prudence?<\/strong> Skeleton: the identity view; the doubled teletransporter; transitivity; you're neither A nor C; but you still have reason to pay; so identity doesn't ground prudence; alternative: perdurantism plus continuity; objection: then why care about distinct selves? (Week 11).<\/p>\n<p><strong>Quick self test<\/strong><\/p>\n<ul>\n<li>Run the doubled teletransporter case. Why can't you be identical with both?<\/li>\n<li>Why does it follow that identity doesn't ground prudence?<\/li>\n<li>What's the problem of change, and the endurantist fix?<\/li>\n<li>Define perdurantism using the spatial analogy.<\/li>\n<li>Why is connectedness not enough, and how does continuity fix it?<\/li>\n<li>What do psychological and bodily theorists say about the brain wipe, the teletransporter and the robot?<\/li>\n<\/ul>", "Week 11": "<h2>Overview<\/h2>\n<p>Psychological continuity needs causal connection, not just similarity. But if you're a perduring big self made of distinct little selves, why should a little self care about later ones? The lecture's Humean answer: through its own desires (anticipation and projects). That makes the self and other distinction a matter of degree. Parfit argues identity isn't what matters at all; Kind asks what this means for our special concern for the future. This week is the core of Brigitte's Q7.<\/p>\n<h2>Lecture: psychological continuity and little selves<\/h2>\n<h3>Similarity isn't enough<\/h3>\n<ul>\n<li><strong>Psychological continuity theory:<\/strong> selves are united into one big self by chains of psychological connections.<\/li>\n<li><strong>Objection 1, the evil scientist:<\/strong> he duplicates all your matter, making a qualitative twin with your psychology. Chains of connectedness link both you and the twin to your 3 year old self. But you and the twin can't both be parts of the same big self.<\/li>\n<li><strong>Objection 2, the 7000 year fluke:<\/strong> your body and brain are vaporised; by sheer fluke a duplicate appears in 7000 years. It's psychologically connected to you, but it doesn't seem to be your future self.<\/li>\n<li><strong>Response: add causal connection.<\/strong> Two selves are parts of the same big self when chains of psychological <strong>and<\/strong> causal connections link them. The twin's \"memory\" of swimming wasn't <em>caused<\/em> by your past swimming. The same goes for the fluke duplicate. So neither is part of your big self.<\/li>\n<\/ul>\n<h3>Why should little selves care about each other?<\/h3>\n<ul>\n<li>Suggested answer: S1 and S5 are both parts of one big self, the big self has reason to care about itself, and you at t1 just <em>are<\/em> (are constituted by) S1. So S1 has reason to care about S5.<\/li>\n<li><strong>The inconsistency problem:<\/strong> if you're the big temporally extended thing, <em>you<\/em> have inconsistent beliefs and desires: you believe it's raining and not raining, you're 10 and 20, you love ice cream and hate it. That's not itself puzzling, since different parts believe different things.<\/li>\n<li><strong>But decisions need consistent beliefs and desires.<\/strong> I go next door because I want ice cream and believe the shop sells it. How could the big self decide anything with contradictory beliefs and desires?<\/li>\n<li><strong>Obvious answer:<\/strong> when deciding, it's the beliefs and desires of the <strong>current little self<\/strong> that matter. It has basically consistent attitudes.<\/li>\n<li><strong>So each little self is the \"seat\" of decision.<\/strong> The little selves plan and act; <em>you<\/em> only count as planning and acting because you're made of them. (This is the key point for Brigitte's Q7: the whole perduring person can't be the subject of rational assessment, because its attitudes are inconsistent; the little selves are.)<\/li>\n<li><strong>The savings problem:<\/strong> suppose a little self lasts 5 minutes and is deciding whether to save money. It won't be around to see the savings. Why should <em>it<\/em> save? The selves are distinct. We're all parts of the university, but that gives us no special, prudential reason to care about the other parts.<\/li>\n<\/ul>\n<h3>The Humean answer<\/h3>\n<ul>\n<li><strong>Humeans about rationality:<\/strong> you have reasons only in so far as you have certain desires and beliefs. I want chocolate ice cream and believe it's down the street, so I have reason to walk there. Desires themselves aren't rational or irrational (chocolate vs strawberry); beliefs can be better or worse given evidence.<\/li>\n<li>So a current self's reason to care about future selves must come from <strong>its own<\/strong> desires and beliefs.<\/li>\n<li><strong>Anticipation:<\/strong> I anticipate my future selves' experiences: tomorrow's painful dentist visit, tomorrow's public prize. I want to anticipate good things, not awful ones, so I have reason to promote their wellbeing, at least for near selves. Tomorrow's self anticipates the next day's, so the reason may extend further.<\/li>\n<li><strong>Projects:<\/strong> I want world peace, to save the dolphins, to see a polar bear. My current self can't do these; a \"consortium\" of my selves must. Like building a tower with a fixed team (not the ancient Egyptians' endless supply), I need my team healthy. So I have a purely self interested reason to promote their wellbeing.<\/li>\n<\/ul>\n<h3>The upshot: self and other differ only in degree<\/h3>\n<ul>\n<li>On this view there's <strong>no special<\/strong> prudential duty to future selves <em>because<\/em> they're mine. Reasons come from banal facts: my desires are satisfied by promoting their wellbeing.<\/li>\n<li>I can have the same kind of reason to promote <strong>your<\/strong> future selves' wellbeing, e.g. if future you is crucial for world peace or my polar bear trip.<\/li>\n<li>The differences are only <strong>of degree<\/strong>: I'm far more psychologically and causally connected to my future selves, who remember my projects and are motivated to finish them. Easier to influence, but not different <strong>in kind<\/strong>.<\/li>\n<li>So the self and other distinction is much less stark. My current self is distinct from my future selves <em>and<\/em> from yours; all relations are of the same kind, mine are just stronger. You may think this is a nice upshot, or not.<\/li>\n<\/ul>\n<h2>Reading: Derek Parfit, \"The Unimportance of Identity\"<\/h2>\n<p><strong>Teletransporter (his opening):<\/strong> a machine destroys my body on Earth while recording all my cells' states; on Mars a perfect copy is made from organic material. The person who wakes seems to remember my life and is in every way like me. Some think it's just fast travel; others that I'd die and a mere <strong>Replica<\/strong> would wake.<\/p>\n<h3>Two kinds of sameness<\/h3>\n<p>Two white billiard balls can be qualitatively identical but not numerically identical. Paint one red and it's still the same ball. \"Since her accident, she is no longer the same person\" is no contradiction: one person, qualitatively changed. Philosophers mean numerical identity, and that's what we have in mind when we care about our futures. Marrying may make me \"a different person\", but marriage isn't death.<\/p>\n<h3>Criteria<\/h3>\n<ul>\n<li><strong>Bodily criterion:<\/strong> same body, uninterrupted bodily continuity. The Replica isn't me.<\/li>\n<li><strong>Psychological criterion (Locke):<\/strong> on some versions, the Replica is me.<\/li>\n<li>Imagined cases are useful not to discover the truth but to discover <strong>what we believe<\/strong> about what kind of fact identity is.<\/li>\n<\/ul>\n<h3>Non reductionism vs reductionism<\/h3>\n<ul>\n<li>We tend to assume our identity is always <strong>determinate<\/strong>, yes or no. That would be true if we were <strong>Cartesian Egos<\/strong> (souls): indivisible, all or nothing. Parfit thinks such a view might have been true, but there's no good evidence for it.<\/li>\n<li><strong>Reductionism:<\/strong> a person's existence just consists in a body and a series of thoughts, experiences and other events.<\/li>\n<li><strong>Identifying reductionism:<\/strong> persons just are bodies (hyper reductionist; too simple).<\/li>\n<li><strong>Constitutive reductionism (Parfit's):<\/strong> a person is distinct from body and experiences but <strong>consists in<\/strong> them, like a statue and its bronze.<\/li>\n<li>On reductionism, in <strong>problem cases<\/strong> we can know all the facts and still not know whether the future person is me. The question is <strong>empty<\/strong>, merely verbal.<\/li>\n<li><strong>Physical Spectrum:<\/strong> replace 0% to 100% of my cells. The far end is teletransportation. In the middle (30%, 50%, 70%) we can't say yes or no. <strong>Combined Spectrum:<\/strong> varying physical <em>and<\/em> psychological connectedness.<\/li>\n<li><strong>Branch line variant:<\/strong> the scanner copies me without destroying me. Then the Replica clearly isn't me, which may shake the view that he is in the normal case.<\/li>\n<\/ul>\n<h3>Identity is not what matters<\/h3>\n<ul>\n<li>Future Tuesday indifference is irrational: that a pain is on Tuesday is no reason to care less. Is the fact that a pain will be <em>mine<\/em> a reason to care more? Most say yes: <strong>identity is what matters in survival<\/strong>. Parfit rejects this.<\/li>\n<li><strong>What matters<\/strong> is mostly <strong>psychological continuity and connectedness<\/strong> (with Kind, call it <strong>Relation R<\/strong>), which partly come in degrees and only roughly coincide with identity.<\/li>\n<li><strong>Argument from below:<\/strong> (1) personal identity just consists in certain other facts; (2) if a fact just consists in others, only those other facts can matter; (3) so identity can't matter in itself. Mark Johnston replies with an <strong>argument from above<\/strong>: the higher level fact can matter and lend importance to the lower facts.<\/li>\n<li><strong>Parfit's reply, realism about importance:<\/strong> once you know the lower level facts, whether the person \"is me\" adds no further information about <strong>reality<\/strong>, only about our <strong>language<\/strong>. Treating it as important is treating language as more important than reality. Analogy: asking the doctor whether I'll be in pain (a real question) vs asking whether sea sickness can be <em>called<\/em> pain (a verbal one).<\/li>\n<li><strong>My head on my brother's body:<\/strong> I'm partly paralysed; my identical twin brother is dying of a brain disease. My head could be grafted onto his body. On the bodily criterion I'd die. Parfit: I should accept anyway. The resulting person has my brain, psychology and a body just like mine. Whether he \"is me\" is irrelevant.<\/li>\n<li><strong>Brain cell replacement:<\/strong> Case One, replace 1/100th of my brain cells in each of 100 operations (like a ship replaced plank by plank); Case Two, remove all then insert replicas. The difference is much smaller than that between ordinary survival and teletransportation.<\/li>\n<\/ul>\n<h3>My Division (the double case)<\/h3>\n<ol>\n<li>Suppose each half of my brain could fully support psychological functioning.<\/li>\n<li><strong>Single case:<\/strong> one half is destroyed, the other transplanted into a body like mine. I survive.<\/li>\n<li><strong>Double case:<\/strong> both halves are transplanted into two bodies. Two people wake, each physically and psychologically like me.<\/li>\n<li>They can't <strong>both<\/strong> be me (that's a contradiction), and there's nothing to make me <strong>one<\/strong> rather than the other.<\/li>\n<li>But my relation to each is exactly what it would be in the single case, which contains what matters. <strong>Nothing is missing.<\/strong> So <strong>identity cannot be what matters.<\/strong><\/li>\n<li>\"But <em>I'm<\/em> missing!\" Parfit: that's not a real absence. The only difference is that the relation now holds to two people, so the word \"same\" can't be applied.<\/li>\n<li><strong>The triplets analogy:<\/strong> a community where all children are twins and being an only child is harmful. Triplets are born; they aren't \"twins\", but that's no disaster. What mattered was having at least one sibling. Likewise what matters is that at least one future person is psychologically continuous with me.<\/li>\n<\/ol>\n<h2>Reading: Amy Kind, \"The Metaphysics of Personal Identity and Our Special Concern for the Future\" (<em>Metaphilosophy<\/em>, 2004)<\/h2>\n<p><strong>Special concern:<\/strong> we all care specially about our own futures (contracts, mortgages, promises, and more personally our own wellbeing). It differs from concern for others <strong>in kind<\/strong>, not just degree.<\/p>\n<p><strong>The debate:<\/strong> since Butler, critics say <strong>reductionism<\/strong> (Parfit) can't justify special concern.<\/p>\n<ul>\n<li><strong>Non reductionism<\/strong> (Butler, Reid, Chisholm, Geach): persons involve a <strong>further fact<\/strong> (a Cartesian ego, soul or shared consciousness), all or nothing.<\/li>\n<li><strong>Parfit's reductionism:<\/strong> what matters is Relation R, which comes in degrees. Parfit himself says reductionism made him care less about his future and his death: \"my death seems to me less bad.\"<\/li>\n<li><strong>The extreme claim:<\/strong> reductionism gives us no reason for special concern (accepted by many on both sides, including Perry). <strong>The moderate claim:<\/strong> Relation R gives us reason for special concern even without the further fact (Parfit leans this way but can't support it; \"night is not day\").<\/li>\n<li>Reductionists conclude special concern isn't justified; non reductionists conclude reductionism is false. <strong>Kind: both are wrong.<\/strong><\/li>\n<\/ul>\n<p><strong>Kind's argument:<\/strong><\/p>\n<ol>\n<li>Non reductionists need a bridge principle. <strong>(A)<\/strong> an adequate theory of identity can reasonably be <em>expected<\/em> to justify special concern: too weak, it only shifts the burden of proof. <strong>(B)<\/strong> it's <em>necessary<\/em> for adequacy that it justify special concern: strong enough, but wrong.<\/li>\n<li>It's not even clear non reductionism justifies special concern: sameness of a bare subject, independent of memories and character, seems a poor basis for concern (Leibniz's King of China who forgets his past).<\/li>\n<li>Kind's alternative, <strong>(C):<\/strong> theories of personal identity are <strong>relevant<\/strong> to the rational justification of special concern. They help us interpret the intuitive answer \"because she's me\", but their verdict may be that the concern <em>isn't<\/em> justified. So the link can't be used to choose between theories.<\/li>\n<li><strong>Against Susan Wolf<\/strong> (\"Self Interest and Interest in Selves\", 1986), who says identity theories are irrelevant. Wolf splits self interest into Q1 (why care for <em>myself<\/em>?) and Q2 (why care for the <em>person<\/em> that is myself?). Kind's split: <strong>Q1n<\/strong> why care for my present self, and <strong>Q2n<\/strong> why care for my future self. Present self concern may be basic (Shoemaker: it's inconceivable a creature should be indifferent to its present pains). Then Q2n asks which future self to carry that concern to, and identity theories are exactly what tell us.<\/li>\n<li><strong>Rejects (D):<\/strong> the assumption that if special concern is justified, the justification must come <em>solely<\/em> from the true theory of identity. Other considerations (e.g. the value of persons) also bear on it. So reductionism doesn't by itself make special concern unjustified.<\/li>\n<\/ol>\n<h2>Key terms<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<th>Who<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Causal connection requirement<\/td>\n<td>Continuity counts only if later states are caused by earlier ones<\/td>\n<td>Lecture<\/td>\n<\/tr>\n<tr>\n<td>Seat of decision<\/td>\n<td>The little (current) self whose attitudes determine choice<\/td>\n<td>Lecture<\/td>\n<\/tr>\n<tr>\n<td>Humeanism about reasons<\/td>\n<td>Reasons depend on your desires and beliefs; desires aren't rational or irrational<\/td>\n<td>Lecture<\/td>\n<\/tr>\n<tr>\n<td>Anticipation<\/td>\n<td>Looking forward to (or dreading) future selves' experiences<\/td>\n<td>Lecture<\/td>\n<\/tr>\n<tr>\n<td>Consortium of selves<\/td>\n<td>Many selves jointly completing long projects<\/td>\n<td>Lecture<\/td>\n<\/tr>\n<tr>\n<td>Replica<\/td>\n<td>A qualitative duplicate made from new matter<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<tr>\n<td>Reductionism<\/td>\n<td>A person's existence consists in body, brain and mental events<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<tr>\n<td>Constitutive reductionism<\/td>\n<td>Persons are distinct from but consist in those facts<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<tr>\n<td>Empty question<\/td>\n<td>Can't be answered though all the facts are known; merely verbal<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<tr>\n<td>Relation R<\/td>\n<td>Psychological continuity and connectedness<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<tr>\n<td>Argument from below / above<\/td>\n<td>Only lower level facts matter / higher fact can matter<\/td>\n<td>Parfit / Johnston<\/td>\n<\/tr>\n<tr>\n<td>Realism about importance<\/td>\n<td>What matters is reality, not how it's described<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<tr>\n<td>Further fact<\/td>\n<td>The all or nothing identity fact non reductionists posit<\/td>\n<td>Kind<\/td>\n<\/tr>\n<tr>\n<td>Extreme vs moderate claim<\/td>\n<td>Reductionism gives no reason for special concern / R gives reason<\/td>\n<td>Kind on Parfit<\/td>\n<\/tr>\n<tr>\n<td>Principles A, B, C, D<\/td>\n<td>Expected / necessary / relevant / sole justification<\/td>\n<td>Kind<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Things to cite<\/h2>\n<ul>\n<li><strong>The evil scientist's twin and the 7000 year fluke:<\/strong> why causal connection is needed.<\/li>\n<li><strong>Believing it's raining and not raining; loving and hating ice cream:<\/strong> the big self's inconsistent attitudes.<\/li>\n<li><strong>The 5 minute self deciding to save; parts of the university.<\/strong><\/li>\n<li><strong>The dentist and the public prize<\/strong> (anticipation); <strong>world peace, dolphins, polar bears, the tower team<\/strong> (projects).<\/li>\n<li><strong>Parfit:<\/strong> teletransporter to Mars; billiard balls; head on the brother's body; doctor vs Channel crossing; ship of planks; My Division; triplets.<\/li>\n<li><strong>Parfit quoted by Kind:<\/strong> \"my death seems to me less bad\"; \"night is not day\".<\/li>\n<li><strong>Kind:<\/strong> Leibniz's King of China; Shoemaker on present pains; Wolf's Q1 and Q2 vs Kind's Q1n and Q2n.<\/li>\n<\/ul>\n<h2>Objections and replies<\/h2>\n<ul>\n<li><em>Against \"identity isn't what matters\":<\/em> in My Division, the thought \"I'm missing\" feels like a real loss. Parfit: it's like the triplets, a fact about which word applies, not about what happens.<\/li>\n<li><em>Against realism about importance (Johnston):<\/em> if only lower level facts matter, and physicalism is true, nothing matters. Parfit: identity is \"conceptual\" relative to the continuities in a way that a person isn't relative to particles.<\/li>\n<li><em>Against the Humean answer:<\/em> it makes prudence depend on contingent desires; someone without anticipation or projects would have no reason to save. The desire satisfaction worry from Week 9 returns.<\/li>\n<li><em>Against degree only:<\/em> we feel a difference in <em>kind<\/em> between concern for ourselves and for others (Kind). Reply: maybe that feeling is the illusion Parfit says we should revise.<\/li>\n<\/ul>\n<h2>Practice questions<\/h2>\n<p><strong>1. What is a reason to think that it is not whole perduring persons that count as being rational or not? Do you agree or disagree? (Brigitte's Q7)<\/strong><\/p>\n<ol>\n<li><strong>Perdurantism:<\/strong> a person is a big self made of many numerically distinct little selves (temporal parts) linked by psychological and causal continuity.<\/li>\n<li><strong>The reason:<\/strong> the whole perduring person has massively <strong>inconsistent<\/strong> beliefs and desires, because its parts believe and want different things (raining and not raining; loving and hating ice cream). Rational decision means acting on consistent beliefs and desires (ice cream next door). A whole with contradictory attitudes can't deliberate. So it's the <strong>current little self<\/strong> that deliberates, decides and acts: the <strong>seat of decision<\/strong>. Rationality is assessed at that level.<\/li>\n<li><strong>Consequence:<\/strong> the savings problem. Why should a 5 minute self save for a future it won't see? Being parts of one whole (like parts of a university) gives no prudential reason.<\/li>\n<li><strong>The Humean answer:<\/strong> the current self's own desires (anticipation; projects needing a consortium of selves) give it reasons to promote future selves' wellbeing. So prudence survives, but the self and other difference is only one of degree.<\/li>\n<li><strong>Agree or disagree:<\/strong><ul>\n<li><em>Agree:<\/em> it explains why we assess choices at a time, and fits Parfit's view that identity isn't what matters.<\/li>\n<li><em>Disagree:<\/em> planning, promising (Austin!) and long projects seem to belong to the whole person; and we judge people as rational or irrational over a lifetime (e.g. someone who keeps changing their mind).<\/li>\n<li><em>Middle:<\/em> the whole person counts as rational in a derived sense, if its little selves coordinate well.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Link to Q8:<\/strong> if little selves are the seat of rationality, near bias might be rational if connectedness (which falls with distance) is what grounds concern (Week 12).<\/li>\n<\/ol>\n<p><strong>2. Is identity what matters? Answer with reference to Parfit.<\/strong> Skeleton: numerical vs qualitative; bodily vs psychological criteria; reductionism and empty questions (the spectrum); argument from below and realism about importance; the head transplant; My Division and the triplets; objection: \"I'm missing\"; your verdict.<\/p>\n<p><strong>3. Can reductionism justify our special concern for the future? (Kind)<\/strong> Skeleton: special concern; non reductionism vs reductionism; the extreme and moderate claims; Kind's critique of (A) and (B); doubt that non reductionism does better (King of China); principle (C); Wolf's challenge and Kind's Q1n and Q2n; rejecting (D); conclude.<\/p>\n<p><strong>Quick self test<\/strong><\/p>\n<ul>\n<li>Why does psychological similarity alone fail? What's the fix?<\/li>\n<li>Why can't the whole big self be the seat of decision?<\/li>\n<li>What's the savings problem?<\/li>\n<li>What two sources of reasons does the Humean give a current self?<\/li>\n<li>Why does the self and other distinction become one of degree?<\/li>\n<li>State Parfit's argument from below. What's Johnston's reply?<\/li>\n<li>Run My Division and the triplets analogy.<\/li>\n<li>What are the extreme and moderate claims? What is Kind's principle (C)?<\/li>\n<\/ul>", "Week 12": "<h2>Overview<\/h2>\n<p>Dennett's story tests where a person is when brain and body come apart. Parfit argues that if identity consists in continuities that come in degrees, <strong>Classical Prudence<\/strong> (equal concern for all your future) is indefensible. The lecture then asks whether we should distribute wellbeing equally across our selves, or whether <strong>near bias<\/strong> and <strong>future bias<\/strong> can be rational. This is the core of Brigitte's Q8.<\/p>\n<h2>Reading: Daniel Dennett, \"Where Am I?\"<\/h2>\n<p><strong>The story:<\/strong><\/p>\n<ol>\n<li>The Pentagon asks Dennett to recover a radioactive warhead lodged a mile under <strong>Tulsa<\/strong>. The radiation damages only brain tissue, so his brain is removed and kept in a vat in <strong>Houston<\/strong>, linked to his body by radio transceivers (\"a mere stretching of the nerves\").<\/li>\n<li>Looking at his own brain in the vat, he asks: where am I? He names his brain <strong>Yorick<\/strong> and his body <strong>Hamlet<\/strong>.<\/li>\n<li>Three principles:<ul>\n<li><strong>\"Where Hamlet goes, there goes Dennett\":<\/strong> refuted by brain transplant cases (Tom and Dick swap brains; Tom is the one with Dick's old body).<\/li>\n<li><strong>\"Where Yorick goes, there goes Dennett\":<\/strong> unappealing, he plainly seems to be standing outside the vat looking in. Legal puzzle: if Hamlet commits a crime in California and Yorick is in Texas, where is he tried?<\/li>\n<li><strong>\"Dennett is wherever he thinks he is\":<\/strong> a person has a <strong>point of view<\/strong>, and its location is the person's location. But we can be wrong about where we are, and point of view can shift (like a Necker cube).<\/li>\n<\/ul>\n<\/li>\n<li>In the mine, the radio link fails and <strong>Hamlet dies<\/strong>. Dennett finds himself suddenly \"disembodied in Houston\".<\/li>\n<li>He's given a new body, <strong>Fortinbras<\/strong>. Then the twist: the lab had built a computer duplicate of his brain, <strong>Hubert<\/strong>, running in parallel with Yorick. A master switch (B for brain, H for Hubert) lets either drive Fortinbras with no felt difference. He has a \"spare brain\".<\/li>\n<li><strong>Puzzle:<\/strong> if the spare were hooked to another body, which would be Dennett? Yorick, by causal priority and its link to the original body? That seems \"legalistic\". Hubert, by \"squatter's rights\" if it had been driving the body for years? His strongest intuition: he'd survive as long as <em>either<\/em> brain body pair remained, but he didn't want two Dennetts (rivals for his wife's affection, sharing a professor's salary).<\/li>\n<li><strong>The ending:<\/strong> he carries the unmarked switch with him. He flips it during the talk, and the <em>other<\/em> Dennett speaks: the two brains drifted out of sync two weeks ago, and the other has been trapped, unable to control the body, \"like being possessed\". Now the roles reverse.<\/li>\n<\/ol>\n<p><strong>Lessons for the course:<\/strong> location and identity can come apart from body and brain; point of view matters but is unreliable; duplication (Hubert and Yorick) is fission again, and once the two drift apart there are clearly two subjects with separate concern. Dennett: not knowing which brain he is barely dents \"my essential Dennettness\", a philosophical truth \"of underwhelming significance\" (compare Parfit: identity isn't what matters).<\/p>\n<h2>Reading: Derek Parfit, \"Personal Identity and Rationality\" (<em>Synthese<\/em>, 1982)<\/h2>\n<p><strong>Two views of identity:<\/strong><\/p>\n<ul>\n<li><strong>Complex View (reductionist):<\/strong> Hume, Locke, Grice, Ayer, Perry, Lewis, Parfit. Identity over time just consists in psychological continuities (memory, character, intention) resting on bodily continuity, like the identity of ships (Hobbes) or nations (Hume). When continuities hold to an intermediate degree there may be no answer, and that's not puzzling.<\/li>\n<li><strong>Simple View (non reductionist):<\/strong> Butler, Reid, Chisholm, Geach, Swinburne. Identity is a separate, all or nothing <strong>further fact<\/strong>.<\/li>\n<\/ul>\n<p><strong>Prudence:<\/strong> the view that the rational thing is to do what's best for yourself. <strong>Classical Prudence<\/strong> includes:<\/p>\n<blockquote>\n<p><strong>The Equal Concern Claim:<\/strong> a rational person should be equally concerned about all the parts of his future.<\/p>\n<\/blockquote>\n<p>Sidgwick: \"my feelings a year hence should be just as important to me as my feelings next minute\". On Classical Prudence, one of the grossest irrationalities is postponing an inevitable painful event knowing it will be worse later.<\/p>\n<p><strong>Parfit's argument against equal concern:<\/strong><\/p>\n<ol>\n<li>Grant, for argument's sake, that mere temporal distance can't matter, and that identity has supreme rational significance.<\/li>\n<li>On the Complex View, identity just consists in psychological continuity and <strong>connectedness<\/strong>. Continuity is transitive and has no degrees; <strong>connectedness comes in degrees<\/strong> and weakens over long periods (memory, intention, character, desire, ambition).<\/li>\n<li><strong>(B):<\/strong> when some important relation holds to a lesser degree, it is not irrational to think it less important.<\/li>\n<li>So it's not irrational to care less about parts of your future to which you'll be <strong>less connected<\/strong>.<\/li>\n<li>This is a <strong>discount rate on connectedness, not on time<\/strong>. It rarely applies to the near future: me in 5 minutes vs 5 days vs maybe 5 years are about equally connected, but me in 50 years is much less.<\/li>\n<li>To resist, the prudentialist must deny (B), and \"it seems very doubtful that he can honestly make this claim.\" So <strong>Classical Prudence must be abandoned.<\/strong><\/li>\n<\/ol>\n<p><strong>Revised Prudence and its cost:<\/strong> you may care less about less connected parts of your future. But this breaks the link between prudence and your own best interests. Example: as a young man I care less about myself in old age (because less connected, not because further away), so I spend rather than save. I act against my best interests, but on Revised Prudence that's not <em>irrational<\/em>.<\/p>\n<p><strong>Parfit's twist:<\/strong> it's still open to criticism, \"often (as in the case of smoking) a tragic thing.\" So perhaps <strong>morality<\/strong> should annex the territory prudence abandoned: it may be <strong>morally wrong<\/strong> to impose greater burdens on your future self for smaller benefits now, as it would be to impose them on someone else. This also bears on justifying <strong>paternalism<\/strong>.<\/p>\n<h2>Lecture: The Self and Wellbeing (time bias)<\/h2>\n<h3>Should you promote all your selves' wellbeing equally?<\/h3>\n<ul>\n<li>Picture your extended self from a god's eye view, with a <strong>bucket of wellbeing<\/strong> to distribute among your little selves. Equally, or more to some?<\/li>\n<li>Equal <em>wellbeing<\/em> doesn't mean equal <em>goods<\/em> or the same kinds of stuff: your 2 month old self needs nappies and soft food, your 20 year old self doesn't.<\/li>\n<li>It seems obvious you should distribute it evenly: why should <em>where in time<\/em> a self is matter? Surely Sunday selves don't deserve less just because it's Sunday.<\/li>\n<\/ul>\n<h3>Future bias<\/h3>\n<ul>\n<li><strong>Hospital case:<\/strong> you wake groggy, knowing you need a 2 hour painful operation but unsure whether it was yesterday or is tomorrow. Most prefer it was yesterday, even if yesterday's was <strong>twice as long<\/strong>. Empirical work: people prefer a <strong>10 hour<\/strong> painful operation yesterday to a <strong>1 hour<\/strong> one tomorrow.<\/li>\n<li><strong>Party case:<\/strong> groggy, unsure whether the fun party was last night or is tonight. Most prefer tonight, even if last night's was 7 hours of fun and tonight's 4.<\/li>\n<li><strong>Future bias:<\/strong> preferring pleasant events in the future, not the past, and unpleasant ones in the past, not the future. It <strong>discounts the value of past experiences<\/strong> compared to future ones (a 1 hour party yesterday has less value than one tomorrow).<\/li>\n<\/ul>\n<h3>Time bias in general<\/h3>\n<ul>\n<li><strong>Time bias:<\/strong> holding all else fixed, your preferences are sensitive to where in time you represent events as located.<\/li>\n<li><strong>Hold all else fixed:<\/strong> preferring cake soon to cake in 7 hours because it'll go stale isn't time bias; that's sensitivity to value and probability. If you still prefer cake now with all that fixed, you're time biased.<\/li>\n<li><strong>Near bias:<\/strong> preferring pleasant events in the near rather than far future, and unpleasant ones in the far rather than near future; discounting temporally further selves.<\/li>\n<li><strong>Future bias:<\/strong> preferring pleasant events in the future rather than past, unpleasant ones in the past rather than future; discounting past experiences.<\/li>\n<li>People are both near biased and future biased in fact. <strong>But is it rational?<\/strong><\/li>\n<\/ul>\n<h3>Against near bias<\/h3>\n<p><strong>Non arbitrariness:<\/strong> at any time, a prudentially rational agent's preferences are insensitive to <strong>arbitrary differences<\/strong> (something irrelevant, or overestimating relevance).<\/p>\n<p><strong>Parfit's Future Tuesday Indifference:<\/strong> a hedonist cares normally about his future experiences except that he never cares about pains or pleasures on a <em>future Tuesday<\/em>. He'd choose a painful operation next Tuesday over a much milder one on Wednesday. He has no false beliefs; it's a brute preference. What's wrong: it's entirely <strong>arbitrary<\/strong>, sensitive to something irrelevant.<\/p>\n<p><strong>The beans:<\/strong> I always buy the beans on the left of the shelf. There's an explanation (spatial location), but it's not a relevant difference. I should care about price, taste, environmental impact, slave labour, not shelf position.<\/p>\n<p><strong>Argument 1, non arbitrariness:<\/strong><\/p>\n<ol>\n<li>A prudentially rational agent's preferences are insensitive to arbitrary differences.<\/li>\n<li>Relative distance from the present is an arbitrary difference between events.<\/li>\n<li>Near biased agents are sensitive to when an event is scheduled relative to the present.<\/li>\n<li>So near biased preferences are not rationally permissible.<\/li>\n<\/ol>\n<p>It's rational to be sensitive to how <em>probable<\/em> and how <em>good or bad<\/em> an event is, not just to <em>where<\/em> it falls.<\/p>\n<p><strong>Argument 2, life going well:<\/strong><\/p>\n<ol>\n<li>At any time a rational agent prefers that her life going forward go as well as possible.<\/li>\n<li>Near biased agents sometimes choose a present lesser good over a greater future good.<\/li>\n<li>Their life would go better if they preferred the greater future good.<\/li>\n<li>So near bias isn't rationally permissible.<\/li>\n<\/ol>\n<p><strong>The life store:<\/strong> choosing between two otherwise identical lives, one with 20 units of pain on Tuesday and one with 10 on Wednesday, we'd all pick the second. Choosing futures \"as if they're on a hook\", we shouldn't be near biased.<\/p>\n<h3>For near bias (the connectedness argument)<\/h3>\n<ol>\n<li>Some criterion <strong>C<\/strong> grounds your self concern, and C comes in degrees.<\/li>\n<li>It's prudentially rational to discount events by the degree to which they have the basis of your self concern.<\/li>\n<li>C holds to a lesser degree the further into the future events are.<\/li>\n<li>So it's rational to discount further future events: to be near biased.<\/li>\n<\/ol>\n<p><strong>What's C?<\/strong> Not <strong>identity<\/strong> (no degrees). Not psychological or bodily <strong>continuity<\/strong> (no degrees either). But continuity is made of <strong>connectedness<\/strong>, and that <strong>does<\/strong> come in degrees. Me now and me at 89 are continuous but barely connected. If, like <strong>Parfit<\/strong>, you think connectedness is what matters for self concern, nearer selves are more connected, so you should care more about them: near bias is rational.<\/p>\n<h3>Future bias: rational or not?<\/h3>\n<ul>\n<li><strong>For:<\/strong> many think it's obviously rational. The past is \"over and done with\", the future is still to come. Of course you'd want bad things finished and good things ahead.<\/li>\n<li><strong>Arbitrariness objection:<\/strong> why should <em>past vs future<\/em> location matter, if near vs far location doesn't? Future bias is sensitivity to where in time events are; that's arbitrary; so we shouldn't be future biased.<\/li>\n<li><strong>Sullivan's Carrie:<\/strong> Carrie's Crossfit goal is one tough 45 minute workout a day. After 45 minutes she reasons: that's all <em>past<\/em> pain, worth nothing (or less) to me now, so I need to do more. If past pain is worth nothing, she can <strong>never<\/strong> finish, and would work out until she dies. Surely she's done her workout. So she shouldn't discount past suffering, i.e. shouldn't be future biased.<\/li>\n<\/ul>\n<p>The lecture leaves it open: philosophers disagree, so form your own view.<\/p>\n<h3>The big questions of the Self section<\/h3>\n<ol>\n<li>Do we have reason to care about our past or future selves' wellbeing?<\/li>\n<li>What makes something a past or future self of mine?<\/li>\n<li>What gives us reason to care about them?<\/li>\n<li>If we should care, should we care equally?<\/li>\n<\/ol>\n<h2>Key terms<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<th>Who<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Yorick, Hamlet, Fortinbras, Hubert<\/td>\n<td>Dennett's brain, first body, second body, computer brain<\/td>\n<td>Dennett<\/td>\n<\/tr>\n<tr>\n<td>Point of view principle<\/td>\n<td>You are wherever your point of view is<\/td>\n<td>Dennett<\/td>\n<\/tr>\n<tr>\n<td>Complex vs Simple View<\/td>\n<td>Identity consists in continuities / is a further fact<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<tr>\n<td>Classical Prudence<\/td>\n<td>Do what's best for yourself, with equal concern for all your future<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<tr>\n<td>Equal Concern Claim<\/td>\n<td>Be equally concerned about all parts of your future<\/td>\n<td>Sidgwick, Parfit<\/td>\n<\/tr>\n<tr>\n<td>Principle (B)<\/td>\n<td>Less of an important relation can rationally matter less<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<tr>\n<td>Revised Prudence<\/td>\n<td>Care chiefly for your future, but less for less connected parts<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<tr>\n<td>Time bias<\/td>\n<td>Preferences sensitive to temporal location, all else fixed<\/td>\n<td>Lecture<\/td>\n<\/tr>\n<tr>\n<td>Near bias<\/td>\n<td>Good things sooner, bad things later<\/td>\n<td>Lecture<\/td>\n<\/tr>\n<tr>\n<td>Future bias<\/td>\n<td>Good things future, bad things past<\/td>\n<td>Lecture<\/td>\n<\/tr>\n<tr>\n<td>Time neutrality<\/td>\n<td>No time bias at all<\/td>\n<td>Lecture<\/td>\n<\/tr>\n<tr>\n<td>Non arbitrariness<\/td>\n<td>Rational preferences ignore arbitrary differences<\/td>\n<td>Lecture<\/td>\n<\/tr>\n<tr>\n<td>Future Tuesday Indifference<\/td>\n<td>Not caring about pains on future Tuesdays<\/td>\n<td>Parfit<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Things to cite<\/h2>\n<ul>\n<li><strong>Dennett:<\/strong> Tulsa and Houston; Yorick and Hamlet; three location principles; Hubert and the master switch; the out of sync ending.<\/li>\n<li><strong>Parfit (1982):<\/strong> ships and nations; Sidgwick's \"a year hence... next minute\"; principle (B); the young man who doesn't save; smoking; morality annexing prudence; paternalism.<\/li>\n<li><strong>Lecture:<\/strong> the bucket of wellbeing; nappies; the hospital and party cases; 10 hours yesterday vs 1 hour tomorrow; stale cake; Future Tuesday Indifference; beans on the shelf; the life store (20 units Tuesday vs 10 Wednesday); Carrie's Crossfit.<\/li>\n<\/ul>\n<h2>Objections and replies<\/h2>\n<ul>\n<li><em>Against the connectedness argument for near bias:<\/em> Parfit himself says the connectedness discount rarely applies to the near future (5 minutes vs 5 days). So it doesn't justify ordinary near bias (cake now vs cake tonight), only caring less about the far future.<\/li>\n<li><em>Against non arbitrariness for future bias:<\/em> the past is causally inaccessible and \"done\"; maybe that's a relevant difference, not an arbitrary one (see Week 13 reading on passage and causal inaccessibility).<\/li>\n<li><em>Against Carrie:<\/em> a moderate future biased agent who only partly discounts the past could still finish. Reply: absolute or strong discounting is the problem, and moderate discounting still leads to exploitability (Week 13: Dougherty).<\/li>\n<li><em>Against Revised Prudence:<\/em> it seems to excuse imprudence. Parfit accepts it may still be criticised, as morally wrong.<\/li>\n<\/ul>\n<h2>Practice questions<\/h2>\n<p><strong>1. Is it rational to be time biased (near biased or future biased)? Answer with reference to the course content. (Brigitte's Q8)<\/strong><\/p>\n<ol>\n<li><strong>Define:<\/strong> time bias (all else fixed); near bias; future bias (hospital, party; 10 hours past vs 1 future).<\/li>\n<li><strong>Against near bias:<\/strong> non arbitrariness (Future Tuesday Indifference, the beans); the life going well argument (life store).<\/li>\n<li><strong>For near bias:<\/strong> the connectedness argument. Identity and continuity don't come in degrees, connectedness does (Parfit). Parfit's principle (B) and the collapse of the Equal Concern Claim.<\/li>\n<li><strong>Assess:<\/strong> connectedness justifies discounting the far future, not the near future (Parfit's own point), so ordinary near bias remains irrational, while a connectedness discount over decades may be permissible.<\/li>\n<li><strong>Future bias:<\/strong> the intuitive case (\"over and done with\"); the arbitrariness objection; Carrie; and from the Week 13 reading, Dougherty's pain pump, Greene and Sullivan's scheduling problem, and the first person vs third person asymmetry.<\/li>\n<li><strong>Defence of future bias:<\/strong> temporal passage; causal inaccessibility (reply: that explains it, maybe doesn't justify it).<\/li>\n<li><strong>Your verdict:<\/strong> e.g. near bias irrational except as a connectedness discount; future bias irrational given exploitability, or permissible as a tiebreaker only.<\/li>\n<li><strong>Optional link to Q7:<\/strong> if the little self is the seat of rationality, its concern may track its connectedness to other selves, which supports a connectedness discount.<\/li>\n<\/ol>\n<p><strong>2. Can Classical Prudence survive a reductionist view of personal identity?<\/strong> Skeleton: Simple vs Complex View; the Equal Concern Claim; Parfit's argument from degrees of connectedness and (B); the discount on connectedness, not time; Revised Prudence and its cost (the young man not saving); morality annexes prudence; your view.<\/p>\n<p><strong>3. Where is Dennett? What does the story show about personal identity?<\/strong> Skeleton: the setup; the three principles and their problems; Hamlet's death; Hubert and fission; the out of sync ending; connect to Parfit (identity of \"underwhelming significance\") and to the psychological vs bodily debate.<\/p>\n<p><strong>Quick self test<\/strong><\/p>\n<ul>\n<li>State the three location principles in Dennett, and a problem with each.<\/li>\n<li>What is the Equal Concern Claim? How does Parfit argue against it?<\/li>\n<li>Why is Parfit's discount rate \"not with respect to time\"?<\/li>\n<li>Define near bias and future bias. Give the hospital case.<\/li>\n<li>What is Future Tuesday Indifference supposed to show?<\/li>\n<li>Give the connectedness argument for near bias. Why can't C be identity or continuity?<\/li>\n<li>What does Carrie's Crossfit case show?<\/li>\n<\/ul>", "Week 13": "<p>Reading: \"Bias Towards the Future\" (<em>Philosophy Compass<\/em>), set for Lecture 24. It asks whether future biased preferences are rationally permissible or, as <strong>time neutralists<\/strong> say, impermissible, using two kinds of argument (arbitrariness and practical upshots) checked against empirical research. Use it to strengthen the future bias half of Brigitte's Q8 (the lecture is in the Week 12 tab).<\/p>\n<h2>The phenomenon<\/h2>\n<ul>\n<li>All else equal, most of us prefer positive experiences in the future and negative ones in the past. Hume discussed this asymmetry in the <em>Treatise<\/em>.<\/li>\n<li>Empirical work: people prefer positive hedonic events (pleasure) in the future and negative ones (pain) in the past, and many prefer <strong>more<\/strong> pain in the past to <strong>less<\/strong> in the future.<\/li>\n<li>Debated in Parfit 1984, Hare, Brink, Dougherty, Greene and Sullivan 2015, Sullivan 2018, Dorsey, Kauppinen.<\/li>\n<\/ul>\n<h2>1. Arbitrariness arguments<\/h2>\n<p><strong>Modelled on near bias:<\/strong> Sidgwick and Rawls argue the mere fact that one time is nearer the present is no reason to care more about wellbeing then. Time neutralists say the same goes for past vs future: it's arbitrary to care less about wellbeing just because it's past.<\/p>\n<p><strong>Defenders' reply: the temporal metaphysics explanation<\/strong> (Prior, Schlesinger, Craig, Pearson). Our experience of the \"flow of time\" (<strong>passage phenomenology hypothesis<\/strong>) or our belief in robust objective passage (<strong>passage belief hypothesis<\/strong>) explains future bias. If passage is real, past events are \"over and done with\" and future ones still to become present, which could make future bias rational. But it's proven notoriously hard to turn this into a clear argument.<\/p>\n<p><strong>Time neutralists' explanation: causal inaccessibility<\/strong> (Horwich, Suhler and Callender, Greene and Sullivan). We evolved a heuristic to care less about the past because we can't affect it. That explains future bias without justifying it.<\/p>\n<p><strong>Preference pattern arguments<\/strong> (our future bias is sensitive to irrelevant factors):<\/p>\n<table>\n<thead>\n<tr>\n<th>Asymmetry<\/th>\n<th>What people do<\/th>\n<th>Time neutralist conclusion<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>First person vs third person<\/td>\n<td>Future biased about our own painful operation, but time neutral about others' (even loved ones')<\/td>\n<td>One set is irrational; third person preferences are more dispassionate, so first person future bias is the irrational one<\/td>\n<\/tr>\n<tr>\n<td>Hedonic vs non hedonic<\/td>\n<td>Future biased about experiences (pleasure at a paper being published) but not about non experiential goods (the publication itself)<\/td>\n<td>That difference shouldn't matter, so hedonic future bias is irrational<\/td>\n<\/tr>\n<tr>\n<td>Negative vs positive<\/td>\n<td>More future biased about negative events than positive ones (Greene et al. 2021b)<\/td>\n<td>Valence shouldn't matter; negative events provoke stronger emotion, so those reactions are the irrational ones<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. Practical upshots arguments<\/h2>\n<p><strong>Dougherty's pain pump (future bias plus risk aversion):<\/strong><\/p>\n<ol>\n<li>You'll face either (i) a 4 hour operation Tuesday and a 1 hour one Thursday, or (ii) a 3 hour operation Thursday. Each minute is equally painful.<\/li>\n<li>Offered a <strong>help early<\/strong> pill: cuts Thursday by 29 minutes if (i), adds 31 minutes if (ii). Risk averse, you take it (one extra minute of expected pain to reduce the worst case).<\/li>\n<li>Wednesday, with temporary amnesia, you're offered a <strong>help late<\/strong> pill: adds 30 minutes Thursday if (i), cuts 30 if (ii). Future biased and risk averse, you take it (less risk, same expected future pain).<\/li>\n<li>Result: you've guaranteed yourself <strong>one more minute of pain<\/strong> on Thursday for nothing.<\/li>\n<li>So either risk aversion or future bias is irrational. Dougherty blames future bias, since rejecting risk aversion would make buying insurance irrational.<\/li>\n<\/ol>\n<p><strong>Greene and Sullivan (future bias plus regret aversion):<\/strong><\/p>\n<ul>\n<li><strong>Scheduling problem:<\/strong> Billy and Sally both want to ride the roller coaster but can't go together. If future biased Billy goes first, he'll regret it afterwards (Sally still has the ride ahead). If he goes second, he'll never regret it. So he insists on going second, which seems irrational.<\/li>\n<li><strong>Meagre returns problem:<\/strong> absolutely future biased Billy (doesn't care about past pleasure at all) would wait an hour for <em>slightly less than one<\/em> cookie rather than eat a whole one now, to avoid regret. Waiting longer for less is awry.<\/li>\n<\/ul>\n<p><strong>Others:<\/strong> Tarsney's Newcomb style case (future biased and time neutral evidential decision theorists choose differently). <strong>Hedden:<\/strong> future biased agents violate <strong>utility conditionalisation<\/strong> (don't change ultimate preferences over time) and <strong>preference reflection<\/strong> (prefer now what you know you'll later prefer), which leads to predictable exploitability.<\/p>\n<h2>3. What the empirical work shows<\/h2>\n<ul>\n<li><strong>Tiebreaker or more?<\/strong> The practical upshots arguments only work if future bias is more than a tiebreaker. Lee et al. 2020: when past amounts are bigger, most children and about half of adults abandon future bias, so for many it's a tiebreaker. Greene et al. 2021b: most prefer ten negative past events to one negative future event (strong future bias for pain), but ten positive past events over one positive future one; a follow up found most prefer one positive future event to two past ones.<\/li>\n<li><strong>Explaining the difference:<\/strong> asking who you'd prefer to <em>be<\/em> (Lee) may prompt a third person, time neutral view; and remembered events bring their own pleasure or pain. Controlling for memory, future bias seems more than a tiebreaker, which supports the practical upshot arguments.<\/li>\n<li><strong>Causal inaccessibility:<\/strong> future bias is reduced but not eliminated when people can causally influence the past (Latham et al. 2021). Anticipation is emotionally stronger than retrospection. Taking an agentive perspective (\"placing\" events) reduces future bias.<\/li>\n<li><strong>Temporal metaphysics:<\/strong> no study shows beliefs about time or passage phenomenology alone cause future bias. Descriptions of a world without passage reduce it, but people's actual beliefs had no effect. Perhaps passage phenomenology <em>taken as veridical<\/em> contributes, in which case the rationality of future bias would depend partly on whether time really passes, and even then, approaching and receding events don't obviously justify it.<\/li>\n<\/ul>\n<h2>Exam use<\/h2>\n<p>For the future bias half of Q8:<\/p>\n<ol>\n<li>Define future bias, with the lecture's hospital case and the reading's empirical result (more past pain preferred to less future pain).<\/li>\n<li><strong>Case for:<\/strong> the past is over and done with (temporal passage).<\/li>\n<li><strong>Case against:<\/strong> arbitrariness (Sidgwick, Rawls; the first person vs third person asymmetry), Carrie (lecture), Dougherty's pain pump, Greene and Sullivan's scheduling and meagre returns problems, Hedden's exploitability.<\/li>\n<li><strong>Evaluate:<\/strong> causal inaccessibility explains rather than justifies; the passage defence is hard to make precise and the evidence for it is weak; if future bias is only a tiebreaker it's harmless, but evidence suggests it's often stronger.<\/li>\n<li><strong>Verdict:<\/strong> e.g. future bias is not rationally required, and is impermissible at least when strong enough to be exploited.<\/li>\n<\/ol>\n<h2>Quick self test<\/h2>\n<ul>\n<li>What do time neutralists claim?<\/li>\n<li>What are the passage phenomenology and passage belief hypotheses?<\/li>\n<li>What is the causal inaccessibility explanation, and does it justify future bias?<\/li>\n<li>Give the three preference pattern asymmetries.<\/li>\n<li>Run Dougherty's pain pump. What does it show?<\/li>\n<li>Explain the scheduling and meagre returns problems.<\/li>\n<li>Why does it matter whether future bias is just a tiebreaker?<\/li>\n<\/ul>"};
