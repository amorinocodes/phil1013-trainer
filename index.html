ers<\/td>\n<td>Lecture 11<\/td>\n<\/tr>\n<tr>\n<td>Molecular model<\/td>\n<td>Knowledge built from true belief plus extras<\/td>\n<td>Plato, criticised<\/td>\n<\/tr>\n<tr>\n<td>Retreat to belief<\/td>\n<td>Falling back from \"I know\" to \"I believe\" under challenge<\/td>\n<td>Lecture 11<\/td>\n<\/tr>\n<tr>\n<td>Evidentialism<\/td>\n<td>Always have good evidence for beliefs<\/td>\n<td>Clifford<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Things to cite in the exam<\/h2>\n<ul>\n<li><strong>Gettier (1963):<\/strong> Smith, Jones and the ten coins; Jones's Ford and Brown in Barcelona.<\/li>\n<li><strong>Stopped clock<\/strong> and <strong>sheep in the meadow:<\/strong> Gettier cases without a false premise.<\/li>\n<li><strong>Geocentrism:<\/strong> justified but false belief.<\/li>\n<li><strong>Goodman (1955):<\/strong> reflective equilibrium.<\/li>\n<li><strong>Radford (1966):<\/strong> the locked car, Miss Tercy the librarian, Jean's history quiz (Elizabeth 1603, James I 1625).<\/li>\n<li><strong>Lecture cases:<\/strong> Jenny the shard sorter, Jack the doubtful chicken sexer.<\/li>\n<li><strong>Radford's method quote:<\/strong> whether Jean knows depends on when English speakers would say someone knows.<\/li>\n<li><strong>The two challenge formats:<\/strong> \"Then you don't know\" makes sense; \"Then you don't believe\" doesn't.<\/li>\n<li><strong>Clifford, \"The Ethics of Belief\":<\/strong> evidentialism and its regress.<\/li>\n<\/ul>\n<h2>Objections and replies<\/h2>\n<p><strong>Responses to Gettier<\/strong><\/p>\n<ul>\n<li><em>No false lemmas:<\/em> add a fourth condition that the belief isn't inferred from anything false. Reply: the stopped clock and sheep cases involve no false premise.<\/li>\n<li><em>Infallibility:<\/em> demand certain justification. Reply: blocks Gettier but makes almost all empirical knowledge impossible, failing reflective equilibrium.<\/li>\n<li><em>Reliability (good grounds):<\/em> the lecture's lesson is that knowledge needs an objective likelihood of being right, not just blamelessness. Worry: the stopped clock is normally reliable, so reliability of the type of process may not be enough either.<\/li>\n<li><em>Give up analysis:<\/em> knowledge may be basic and undefinable (the lecture's direction).<\/li>\n<\/ul>\n<p><strong>Against Radford<\/strong><\/p>\n<ul>\n<li><em>Jean does believe, unconsciously or dispositionally:<\/em> his answers come from memory, so he has a belief he doesn't recognise. Reply: belief is a commitment to truth, and Jean is fairly sure his answers are wrong, so he isn't committed.<\/li>\n<li><em>It's just intuition:<\/em> the verdict rests on what English speakers would say. Reply: Radford gives reasons, it's wildly implausible he guessed so many right, so he must remember.<\/li>\n<li><em>Too weak to count:<\/em> Jean's knowledge is \"a poor thing\". Reply: Radford concedes this but says weak knowledge is still knowledge.<\/li>\n<li><em>Does the social status view lose the knower's perspective?<\/em> If others can credit you with knowledge you'd deny, knowledge becomes a third person matter. Reply: that's exactly the point of the Miss Tercy and Jenny cases.<\/li>\n<\/ul>\n<h2>Connections<\/h2>\n<ul>\n<li><strong>Plato (Week 5):<\/strong> Gettier shows the rational account condition doesn't remove luck. Plato's \"fastened by a reasoned understanding of causes\" arguably points toward the good grounds fix.<\/li>\n<li><strong>Austin (later):<\/strong> knowledge as a social, second personal status, like giving your word. Pairs with Brigitte's Q2: if knowledge doesn't require belief, you can know p while believing not p?<\/li>\n<li><strong>Agrippa's Trilemma (Lecture 6):<\/strong> evidentialism's regress of reasons. Brigitte's Q3.<\/li>\n<li><strong>Descartes (later):<\/strong> wanted scientia, absolutely certain knowledge. Radford's cases show knowledge doesn't need certainty.<\/li>\n<\/ul>\n<h2>Practice questions<\/h2>\n<p><strong>1. How does Plato's view of the difference between true belief and knowledge differ from Gettier's view? Is either correct? (Brigitte's Q1)<\/strong> Skeleton: thesis. Plato: knowledge is true belief fastened by a rational account (Larissa, Daedalus), three necessary and jointly sufficient conditions. Gettier: JTB is not sufficient; he attacks the definition rather than offering a new one. Run one case in full (the ten coins), using the two assumptions (justified false belief, closure). Add the stopped clock to show it's not just false premises. Evaluate: Gettier is right that justification doesn't remove luck; strengthening to infallibility fails; the lesson is that knowledge needs good grounds (reliability), not just blamelessness. Optional: Plato's \"understanding of causes\" anticipates this. Conclude.<\/p>\n<p><strong>2. Does knowledge require certainty? Does it require belief?<\/strong> Skeleton: thesis (neither, following Radford). Certainty: locked car, Miss Tercy. Belief: Jean's history quiz, why Tom credits knowledge, KK failure; Jack the chicken sexer. Knowledge as a social status with public criteria vs belief as a psychological commitment. Objection: Jean believes unconsciously. Reply: belief is commitment, and Jean is fairly sure he's wrong. Explain Plato's mistake with the retreat to belief. Conclude.<\/p>\n<p><strong>3. Why does strengthening the justification condition fail to rescue JTB?<\/strong> Skeleton: Gettier cases rely on fallible justification; infallibilism would block them; but all empirical evidence is fallible (senses, memory, testimony, inference); so knowledge would be nearly impossible; that fails reflective equilibrium; better diagnosis is the two senses of justification; conclude that analysis itself may be the wrong project.<\/p>\n<p><strong>4. How can we investigate knowledge if we don't know what it is, or if it has no essence?<\/strong> Skeleton: the paradox of inquiry; reflective equilibrium as the answer (cases aren't sacrosanct); after Gettier, analysis fails, so switch to conceptual connections (truth yes, certainty and belief no) and the function of the concept; Radford's method of asking when speakers would say someone knows; objection: that's just polling intuitions; reply: we give reasons too.<\/p>\n<p><strong>Can you believe something you know to be false? (Brigitte's Q2, starter)<\/strong> This week supplies half the answer: if knowledge doesn't require belief (Radford), knowing not p and believing p aren't straightforwardly contradictory. Add Austin when you send that week.<\/p>\n<p><strong>Quick self test<\/strong><\/p>\n<ul>\n<li>State JTB formally. Which philosophers did Gettier cite as holding versions of it?<\/li>\n<li>What two assumptions do Gettier's cases rely on?<\/li>\n<li>Run the ten coins case from memory. Then the Ford case. What logical principle does each use?<\/li>\n<li>Why does the lecture add the stopped clock and sheep cases?<\/li>\n<li>Why does demanding infallible justification fail?<\/li>\n<li>What are the two senses of justification, and which one do Gettier cases show is missing?<\/li>\n<li>What does the locked car case show? The librarian case?<\/li>\n<li>What is the KK principle and how does Jean refute it?<\/li>\n<li>Why does \"Then you don't believe\" make no sense as a reply?<\/li>\n<li>Why does evidentialism lead to a regress?<\/li>\n<\/ul>", "Week 7": "<h2>Overview<\/h2>\n<p>With logical analysis abandoned, Week 7 gives two positive accounts of knowledge:<\/p>\n<ul>\n<li><strong>Lecture 12, Austin:<\/strong> knowing is like promising, believing is like intending. Saying \"I know\" gives others your word and entitles them to rely on you. Knowledge is a social status with social responsibility, which is what makes testimony, and testimonial injustice, possible.<\/li>\n<li><strong>Lecture 13, Craig:<\/strong> instead of analysing knowledge, ask what the concept is <em>for<\/em>. His answer: to flag approved informants. Along the way, Nozick's tracking analysis fails (Jesse James). Austin and Craig fit together because knowledge's point is tied to testimony.<\/li>\n<\/ul>\n<p>This week is the core of Brigitte's Q2 (can you believe what you know is false, with reference to Austin).<\/p>\n<h2>Lecture 12: Austin's Deontic Account of Knowledge<\/h2>\n<p>Reading: J. L. Austin, selections from \"Other Minds\" (1946). <strong>J. L. Austin (1911 to 1960):<\/strong> English ordinary language philosopher.<\/p>\n<h3>The story so far (recap)<\/h3>\n<ul>\n<li>Plato's JTB failed (Gettier). The new project: (i) explore the conceptual relations knowledge enters into, (ii) explain what function the concept serves.<\/li>\n<li>Knowledge doesn't require KK, being sure, or even belief (Radford). It's a social status involving a commitment to truth and a public standard of good grounds. The attributer needn't be the knower.<\/li>\n<li>Belief is a psychological state expressing a commitment to the truth.<\/li>\n<\/ul>\n<h3>Objective vs personal commitment<\/h3>\n<ul>\n<li><strong>\"I know that p\":<\/strong> an <em>objective<\/em> commitment to p's truth. It implies you've met a public standard of good grounds.<\/li>\n<li><strong>\"I believe that p\":<\/strong> a <em>personal<\/em> commitment. You only need to satisfy yourself (though that may involve thinking there's good reason).<\/li>\n<\/ul>\n<p><strong>God example:<\/strong> claim to <em>know<\/em> God exists and you can expect \"How do you know?\". If you can't show good grounds, it doesn't count as knowledge, and you don't decide what counts as good grounds; that's a social matter. <em>Believe<\/em> God exists and you needn't answer why. Faith is precisely believing without reason; here the personal commitment side of belief is to the fore.<\/p>\n<h3>Austin against Plato<\/h3>\n<ul>\n<li>Plato made the 2,000 year old mistake of treating belief as a component of knowledge, pictured on a divided line of increasing epistemic worth.<\/li>\n<li>Austin: belief is not an element of knowledge. Belief and knowledge are <strong>two distinct truth commitments<\/strong>.<\/li>\n<li><strong>The deontic analogy:<\/strong> knowing is like promising; believing is like intending. (Deontic: to do with duties, rights and entitlements.)<\/li>\n<\/ul>\n<h3>Believing is like intending<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Believing<\/th>\n<th>Intending<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Expresses<\/td>\n<td>Personal commitment to the truth of p<\/td>\n<td>Personal commitment to doing φ<\/td>\n<\/tr>\n<tr>\n<td>If wrong / it fails<\/td>\n<td>My own responsibility<\/td>\n<td>My own responsibility<\/td>\n<\/tr>\n<tr>\n<td>If you rely on it<\/td>\n<td>Your responsibility if you're misled<\/td>\n<td>Your responsibility if your plans fail<\/td>\n<\/tr>\n<tr>\n<td>Scale<\/td>\n<td>Doubtful acceptance up to being sure<\/td>\n<td>Doubtful intending up to fully intending<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>All points on these scales are matters of your own psychology and your own responsibility.<\/p>\n<h3>Knowing is not the top of the belief scale<\/h3>\n<p>One of Austin's main arguments against Plato: the top of the belief scale is <strong>being sure<\/strong>, not knowing. Being sure, even for excellent reasons, isn't knowledge. It's a firmly held belief, your own psychological state, \"not in the same line of business\" as knowledge.<\/p>\n<h3>Knowing is like promising: the \"new plunge\"<\/h3>\n<blockquote>\n<p>\"When I say 'I promise', a new plunge is taken... it is not saying 'I have performed a specially striking feat of cognition, superior, in the same scale as believing and being sure'... When I say 'I know', I give others my word: I give others my authority for saying that 'S is P'.\"<\/p>\n<\/blockquote>\n<ul>\n<li>Saying \"I know that p\" gives others <strong>your word<\/strong> that p is true and the <strong>entitlement to rely on it<\/strong>, so they can now say \"I know that p\" too. That's <strong>knowledge by testimony<\/strong>.<\/li>\n<li>Saying \"I promise to φ\" binds you to others and entitles them to rely on your doing it.<\/li>\n<li>\"I know\" differs from \"I'm sure\" as \"I promise\" differs from \"I fully intend\". Austin: we all feel the great difference between even \"I'm absolutely sure\" and \"I know\".<\/li>\n<li>Being sure: \"you can take it or leave it\". Saying \"I know\": you don't mean that. With a promise \"you are entitled to act on it, whether or not you choose to do so.\"<\/li>\n<li>Knowing and promising are <strong>social statuses with social responsibility<\/strong>: you take responsibility for entitling others to rely on you. Being sure and fully intending lack these social commitments.<\/li>\n<\/ul>\n<h3>Errors in knowing and promising<\/h3>\n<ul>\n<li><strong>Refusing<\/strong> someone's \"I know\" or \"I promise\" is \"a special form of insult\": it says they can't be relied on.<\/li>\n<li>If I wrongly say \"I know\" or \"I promise\", others can criticise me for presuming authority over their claims or actions. If I say it lightly I may get you into trouble. Lecture: \"With social power comes social responsibility\" (adapting a saying the slides attribute to Voltaire).<\/li>\n<li><strong>First challenge<\/strong> to \"I know\" is \"Are you in a position to know?\", i.e. is it within your cognisance? Parallel for promising: is it within your power?<\/li>\n<\/ul>\n<h3>Knowledge and fallibility<\/h3>\n<ul>\n<li>You can't say \"I know that p, but I might be wrong\", just as you can't say \"I promise I will, but I may fail.\" So \"when you know you can't be wrong\" is perfectly good sense.<\/li>\n<li>But that doesn't mean knowers are infallible, any more than promisers are clairvoyant. \"We are not gods!\"<\/li>\n<li>Saying \"I know\" isn't predicting how things will turn out no matter what. It's taking responsibility for the truth of something.<\/li>\n<li>Austin: the intellect and senses are \"inherently fallible... but not by any means inveterately so. Machines are inherently liable to break down, but good machines don't (often).\" A theory of knowledge that denies this ends up denying knowledge exists.<\/li>\n<li>The conditions for being in a position to know (or promise) are about the present and past, not the future.<\/li>\n<\/ul>\n<h3>Testimony<\/h3>\n<ul>\n<li>If S says \"I know that p\" and I believe him, I know p at second hand, provided there's no special reason to doubt S's sincerity and reliability.<\/li>\n<li><strong>Most of what we know is by testimony.<\/strong> Our grounds cite an authority: a person, institution, newspaper, book, website. (Austin: \"How do you know the election is today?\" \"I read it in <em>The Times<\/em>.\")<\/li>\n<li>Austin: \"we are entitled to trust others, except in so far as there is some concrete reason to distrust them. Believing persons, accepting testimony, is the, or one main, point of talking.\"<\/li>\n<li><strong>Suspicious contexts:<\/strong> testimony in a police interview or courtroom is treated as evidence, not accepted as knowledge straight off.<\/li>\n<li><strong>Suspicious persons:<\/strong> we're reluctant to accept the testimony of young children, dogmatists, fanatics, the gullible, psychotics, bullshitters. So there's a real question of who we take seriously for epistemic purposes.<\/li>\n<\/ul>\n<h3>Testimonial (epistemic) injustice<\/h3>\n<p><strong>Miranda Fricker<\/strong> (the Canvas outline says \"Elizabeth Fricker\", a different philosopher; the slides correctly say Miranda): <strong>testimonial injustice<\/strong> is when someone's credibility is unjustly lowered or denied simply because they belong to a social group (race, gender, lifestyle, age). The injustice is denying that people of that type can be given the social status of a knower. This only makes sense if knowledge is a social status, which is Austin's point.<\/p>\n<h2>Lecture 13: Craig's Practical Explication of Knowledge<\/h2>\n<p>Reading: Edward Craig, \"The Practical Explication of Knowledge\".<\/p>\n<h3>Logical analysis vs practical explication<\/h3>\n<ul>\n<li><strong>Logical analysis:<\/strong> find necessary and jointly sufficient conditions for applying a concept. It tries to make explicit the <strong>intension<\/strong> (meaning or content of a concept) to fit the <strong>extension<\/strong> (the things the concept applies to). Craig: \"We are to provide an explicit intension to fit the intuitive extension.\"<\/li>\n<li><strong>Practical explication:<\/strong> traditional epistemology starts from \"what do I know?\". Craig starts from the <strong>social perspective of an inquirer<\/strong> who wants to find out whether p. Hypothesise what the concept does for us, build a concept fit for that role, then check how well it matches our everyday concept and existing theories.<\/li>\n<li>If the result is very different from our actual concept, the hypothesis about its role is \"the first casualty\". The aim isn't to invent a concept but to illuminate our actual practice.<\/li>\n<li>The result needn't be a list of necessary and sufficient conditions. An explication is more like a set of <strong>desiderata<\/strong> that can be waived in some cases.<\/li>\n<\/ul>\n<h3>The hypothesis: knowledge flags approved informants<\/h3>\n<p>Craig: \"the hypothesis I wish to try out is that the concept of knowledge is used to flag approved informants.\" It answers: what do we have the concept of knowledge for?<\/p>\n<p>Why: humans need true beliefs to act successfully. We have <strong>\"on board\" sources<\/strong> (eyes, ears, reasoning). It's hugely useful to tap other people's stocks too: \"the tiger that Fred can see and I can't may be after me and not Fred.\" Some informants are more likely than others to have the truth, so every community needs a way to evaluate sources.<\/p>\n<h3>Unreliable sources of truth (what the inquirer wants to avoid)<\/h3>\n<ol>\n<li><strong>Truth by accident:<\/strong> picking the winning horse because it has the most outlandish name (\"Mudweiser\").<\/li>\n<li><strong>True lies:<\/strong> a liar says \"I've never seen that man before\" and is right because, unknown to him, he's pointing at the man's identical twin.<\/li>\n<li><strong>The double bluff:<\/strong> someone seems to be lying but is telling the truth, e.g. \"confessing\" to a crime they committed, knowing an alibi will clear them.<\/li>\n<\/ol>\n<h3>What the inquirer wants<\/h3>\n<ul>\n<li>An informant such that: either p and he believes p, or not p and he believes not p.<\/li>\n<li>And: if he tells us p, we'll believe p.<\/li>\n<li>So at minimum the informant is a <strong>true believer<\/strong>.<\/li>\n<li>We need some <strong>detectable property X<\/strong>, detectable by people who don't yet know whether p, that <strong>correlates well with being right about p<\/strong>.<\/li>\n<li>Possible worlds framing: since we're ignorant of much, many possible worlds fit what we know. We want the truth about p whichever of them is actual.<\/li>\n<\/ul>\n<h3>Nozick's tracking analysis<\/h3>\n<p>S knows that p if and only if:<\/p>\n<ol>\n<li>S believes that p.<\/li>\n<li>p is true.<\/li>\n<li>If p were not true, S would not believe it.<\/li>\n<li>If p were true (in close possible worlds), S would believe it.<\/li>\n<\/ol>\n<p>Conditions 3 and 4 are the <strong>tracking<\/strong> conditions. Designed to avoid Gettier cases and sceptical scenarios.<\/p>\n<p><strong>Sceptical argument (brain in a vat):<\/strong><\/p>\n<ol>\n<li>I know I have two hands.<\/li>\n<li>If I know I have two hands, I know I'm not a BIV.<\/li>\n<li>I don't know I'm not a BIV.<\/li>\n<li>So I don't know I have two hands.<\/li>\n<\/ol>\n<p><strong>Nozick denies premise 2<\/strong> (he denies closure of knowledge). In the closest world where I lack two hands (an explosion, say) I wouldn't believe I had them, so tracking succeeds. In the distant BIV world I'd wrongly believe I had hands, so tracking fails. <strong>Paradoxical result:<\/strong> I can know I have two hands without knowing I'm not a BIV.<\/p>\n<p><strong>Problem 1, it begs the question against the sceptic:<\/strong> it only works if sceptical worlds are distant. But perhaps the actual world <em>is<\/em> a sceptical world.<\/p>\n<p><strong>Problem 2, the Great Bank Robbery (Craig's counterexample):<\/strong> Jesse James rides off with a scarf over his face; the mask slips and a bystander recognises him. Surely the bystander now knows James robbed the bank. But in a close possible world the mask didn't slip (or slipped only once he'd passed), so the bystander wouldn't believe it, though it would still be true. So condition 4 fails, and Nozick wrongly says the bystander doesn't know.<\/p>\n<p><strong>Craig's diagnosis:<\/strong> from the inquirer's perspective the only worlds that matter are those where the mask slipped. What would have happened otherwise is irrelevant. Nozick's \"close possible worlds\" don't pick out the <strong>epistemically relevant<\/strong> worlds. We want an informant who tracks p in worlds that are both close and epistemically relevant (e.g. maybe James has a twin).<\/p>\n<h3>Indicators of reliability<\/h3>\n<ul>\n<li>X is \"any detectable property which has been found to correlate closely with holding a true belief as to whether p\", provided the correlation is lawlike rather than accidental.<\/li>\n<li>X varies by subject matter: sometimes causation, sometimes a reliable method, sometimes awareness that conditions aren't abnormal.<\/li>\n<li><strong>\"If you want to know the way ask a policeman.\"<\/strong> Being a policeman correlates well with right answers, but it isn't the same property as having used a reliable method. The inquirer doesn't need to know how the informant got reliable.<\/li>\n<\/ul>\n<h3>Summary of Craig<\/h3>\n<ul>\n<li>An explication, not an analysis: desiderata, not strict necessary conditions.<\/li>\n<li>In most cases a good informant has <strong>a true belief with an objective indicator of reliability<\/strong>.<\/li>\n<li>The point of knowledge is to flag approved informants, which greatly increases our cognitive resources.<\/li>\n<li>Craig mentions Radford's denial of the belief condition. His approach doesn't settle it but explains why it became an issue.<\/li>\n<li><strong>Why make belief a desideratum?<\/strong> Craig: we wouldn't believe an informant who wasn't a believer. Lecture's reply: we would if they were a knower!<\/li>\n<\/ul>\n<h3>Austinian criticism of Craig<\/h3>\n<ul>\n<li>Belief is a personal commitment to truth, compatible with being wrong.<\/li>\n<li>Knowledge is an objective commitment to truth that is <strong>factive<\/strong>: not compatible with being wrong.<\/li>\n<li>Knowledge isn't definable in more basic terms. It isn't built out of belief, however much evidence.<\/li>\n<li><strong>Austin's pig:<\/strong> you collect evidence a pig lives somewhere (pig food buckets, marks, smell, mud). When the pig appears, \"there is no longer any question of collecting evidence; its coming into view doesn't provide me with more evidence that it's a pig, I can now just see that it is, the question is settled.\" Knowledge isn't evidence piled high enough.<\/li>\n<\/ul>\n<h3>Reconciling Austin and Craig (the lecture's view)<\/h3>\n<ol>\n<li>Knowing is an <strong>objective apprehension of the truth<\/strong>, not true belief plus evidence (Austin).<\/li>\n<li>The point of the concept of knowledge is tied to the <strong>social practice of testimony<\/strong>: transmitting an objective apprehension of truth person to person (Craig's function, Austin's mechanism).<\/li>\n<li>As inquirers we rely on others for information, which vastly increases our cognitive resources.<\/li>\n<li>Approving informants isn't about the reliability of <em>beliefs<\/em>. It's about who we're willing to accord the status of knower, who we trust epistemically.<\/li>\n<li>Giving good grounds isn't supporting a belief but <strong>showing you have the authority to speak from knowledge<\/strong>.<\/li>\n<\/ol>\n<h2>Key terms<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<th>Who<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Deontic<\/td>\n<td>To do with duties, rights, entitlements<\/td>\n<td>Austin<\/td>\n<\/tr>\n<tr>\n<td>Objective commitment<\/td>\n<td>Claim to meet a public standard of good grounds (knowing)<\/td>\n<td>Lecture 12<\/td>\n<\/tr>\n<tr>\n<td>Personal commitment<\/td>\n<td>Commitment you need only satisfy yourself of (believing)<\/td>\n<td>Lecture 12<\/td>\n<\/tr>\n<tr>\n<td>New plunge<\/td>\n<td>What \"I know\" / \"I promise\" add: giving your word to others<\/td>\n<td>Austin<\/td>\n<\/tr>\n<tr>\n<td>Being sure<\/td>\n<td>Top of the belief scale, a psychological state, not knowledge<\/td>\n<td>Austin<\/td>\n<\/tr>\n<tr>\n<td>Knowledge by testimony<\/td>\n<td>Knowing at second hand by being told by a knower<\/td>\n<td>Austin<\/td>\n<\/tr>\n<tr>\n<td>Testimonial injustice<\/td>\n<td>Credibility unjustly denied because of social group<\/td>\n<td>Miranda Fricker<\/td>\n<\/tr>\n<tr>\n<td>Faith<\/td>\n<td>Believing without reason<\/td>\n<td>Lecture 12<\/td>\n<\/tr>\n<tr>\n<td>Intension / extension<\/td>\n<td>A concept's meaning / the things it applies to<\/td>\n<td>Craig<\/td>\n<\/tr>\n<tr>\n<td>Practical explication<\/td>\n<td>Build the concept from what it's for, then compare<\/td>\n<td>Craig<\/td>\n<\/tr>\n<tr>\n<td>Approved informant<\/td>\n<td>Someone flagged as a reliable source on whether p<\/td>\n<td>Craig<\/td>\n<\/tr>\n<tr>\n<td>On board sources<\/td>\n<td>Our own senses and reasoning<\/td>\n<td>Craig<\/td>\n<\/tr>\n<tr>\n<td>Property X<\/td>\n<td>A detectable property that correlates lawfully with being right<\/td>\n<td>Craig<\/td>\n<\/tr>\n<tr>\n<td>Tracking<\/td>\n<td>Wouldn't believe p if false; would believe p if true<\/td>\n<td>Nozick<\/td>\n<\/tr>\n<tr>\n<td>Epistemically relevant worlds<\/td>\n<td>The possibilities that matter to the inquirer<\/td>\n<td>Craig<\/td>\n<\/tr>\n<tr>\n<td>Factive<\/td>\n<td>Can't be held of a falsehood (knowledge is, belief isn't)<\/td>\n<td>Lecture 13<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Things to cite in the exam<\/h2>\n<ul>\n<li><strong>Austin, \"new plunge\":<\/strong> \"When I say 'I know', I give others my word: I give others my authority for saying that 'S is P'.\"<\/li>\n<li><strong>Austin on refusal:<\/strong> refusing someone's \"I know\" or \"I promise\" insults them in a special way.<\/li>\n<li><strong>Austin on fallibility:<\/strong> you can't say \"I know it is so, but I may be wrong\", just as you can't say \"I promise I will, but I may fail\"; good machines don't (often) break down.<\/li>\n<li><strong>Austin on testimony:<\/strong> we're entitled to trust others unless there's concrete reason to distrust them.<\/li>\n<li><strong>Austin's pig:<\/strong> when it comes into view the question is settled; no more evidence.<\/li>\n<li><strong>God example:<\/strong> knowledge invites \"how do you know?\", faith doesn't.<\/li>\n<li><strong>Miranda Fricker:<\/strong> testimonial injustice.<\/li>\n<li><strong>Craig:<\/strong> \"the concept of knowledge is used to flag approved informants\"; Fred and the tiger; ask a policeman.<\/li>\n<li><strong>Craig's unreliable sources:<\/strong> Mudweiser, true lies (the twin), the double bluff.<\/li>\n<li><strong>Nozick:<\/strong> the four tracking conditions and the BIV argument (denying premise 2).<\/li>\n<li><strong>Jesse James and the slipping mask:<\/strong> Craig's counterexample to tracking.<\/li>\n<\/ul>\n<h2>Objections and replies<\/h2>\n<p><strong>Against Austin<\/strong><\/p>\n<ul>\n<li><em>Disanalogy (Austin raises it himself):<\/em> if things go wrong we say \"you didn't know\" but \"you promised and failed\". Austin: the contrast is \"more apparent than real\". In both cases what you <em>did<\/em> was say \"I know\" or \"I promise\", and that's what you're held to.<\/li>\n<li><em>Unspoken knowledge:<\/em> we know countless things we never claim aloud. Does the promise model only describe <em>claims<\/em> to know? Reply: knowledge is a status others can credit you with (Radford's Jean, Miss Tercy), not only one you claim.<\/li>\n<li><em>Is the status view too social?<\/em> Knowledge seems to be about the world, not about who's trusted. Reply: the status still needs good grounds and truth; it's factive.<\/li>\n<\/ul>\n<p><strong>Against Craig<\/strong><\/p>\n<ul>\n<li><em>Belief desideratum:<\/em> Craig keeps belief because we wouldn't trust a non believer. Lecture reply: we would if they were a knower (Radford's cases).<\/li>\n<li><em>Analysis in disguise?<\/em> Desiderata that can be waived might just be a vaguer analysis. Reply: the aim is to explain the concept's point, not fix its boundaries.<\/li>\n<li><em>First person knowledge:<\/em> starting from the inquirer seems to ignore knowing things for yourself. Craig: \"on board\" sources are taken for granted; we only examine them when things go wrong.<\/li>\n<\/ul>\n<p><strong>Against Nozick<\/strong><\/p>\n<ul>\n<li>Begs the question against the sceptic (assumes sceptical worlds are distant).<\/li>\n<li>Jesse James: counts genuine knowledge as non knowledge.<\/li>\n<li>Denying closure is itself paradoxical: knowing you have hands but not that you're not a handless BIV.<\/li>\n<\/ul>\n<h2>Connections<\/h2>\n<ul>\n<li><strong>Radford (Week 6):<\/strong> knowledge as social status and knowing without belief, now explained by Austin's two distinct commitments.<\/li>\n<li><strong>Plato (Week 5):<\/strong> Austin targets Plato's divided line, belief and knowledge on one scale.<\/li>\n<li><strong>Arendt (Week 5):<\/strong> testimony and trust; the bullshitter appears on Austin's list of untrustworthy informants.<\/li>\n<li><strong>Scepticism, Descartes and pragmatists (later):<\/strong> Nozick's BIV case is a version of the evil demon (Brigitte's Q4).<\/li>\n<\/ul>\n<h2>Practice questions<\/h2>\n<p><strong>1. Can one believe something one knows to be false? Answer with reference to Austin's view on knowledge and belief. (Brigitte's Q2)<\/strong><\/p>\n<p>A possible line: yes, it's possible, but it's a defective, conflicted state, like making a promise you don't intend to keep.<\/p>\n<ol>\n<li><strong>Set up:<\/strong> the question is whether S can know not p while believing p. On Plato's molecular model this is impossible: knowing not p includes believing not p, and you can't fully believe both p and not p.<\/li>\n<li><strong>Austin's view:<\/strong> belief is not a part of knowledge. Believing is like intending (a personal commitment); knowing is like promising (giving your word, an objective, social commitment). The top of the belief scale is being sure, not knowing. So knowledge and belief are two distinct truth commitments.<\/li>\n<li><strong>Consequence:<\/strong> since knowing not p doesn't contain believing not p, there's no straightforward contradiction in knowing not p while believing p. Radford's Jean is the mirror case: he knows the date James I died yet is fairly sure his answer is wrong.<\/li>\n<li><strong>The analogy shows the cost:<\/strong> you can promise to φ while intending not to, and it's still a promise, but an insincere one (Austin: saying \"I shall\" without fully intending is deceiving). Likewise, knowing not p while believing p puts your personal commitment against your objective one. It's possible, but irrational or self deceived.<\/li>\n<li><strong>Objection:<\/strong> both are commitments to truth, so committing to p and to not p is incoherent, like saying \"I know not p but I believe p\" (Moorean absurdity). And \"<em>knows<\/em> to be false\" suggests awareness, which Jean lacks (KK fails for him).<\/li>\n<li><strong>Reply:<\/strong> the absurdity is in <em>asserting<\/em> both, not in being in both states. Everyday cases fit: someone who knows flying is safe but believes (is sure) this plane will crash; someone who knows their partner is unfaithful but can't believe it.<\/li>\n<li><strong>Conclude:<\/strong> Austin's split between knowledge and belief makes it possible, and his promise analogy explains what's wrong with it.<\/li>\n<\/ol>\n<p><strong>2. Explain the analogy between knowing and promising. Is it a good one?<\/strong> Skeleton: believing like intending (table); knowing like promising, the \"new plunge\"; giving your word and entitling others to rely; the insult of refusal; fallibility (\"I promise but I may fail\"); testimony as transmission of authority. Objection: the you didn't know / you promised and failed asymmetry. Austin's reply. Evaluate.<\/p>\n<p><strong>3. What is testimonial injustice and why does Austin's view help explain it?<\/strong> Skeleton: Fricker's definition; it requires knowledge to be a social status we can grant or withhold; Austin's view of knowledge as giving your word and testimony as the main point of talking; legitimate vs prejudicial reasons for withholding credibility (children and fanatics vs race and gender); conclude.<\/p>\n<p><strong>4. What is a practical explication, and how does Craig's differ from Nozick's analysis?<\/strong> Skeleton: analysis (intension to fit extension) vs explication (start from the concept's role); approved informants and property X; Nozick's four conditions and the BIV argument; Jesse James counterexample; Craig's diagnosis (epistemically relevant worlds); evaluate.<\/p>\n<p><strong>5. How can the insights of Austin and Craig be combined?<\/strong> Skeleton: Craig gives the function (flag informants), Austin gives the mechanism (giving your word, testimony); disagreement over belief (Craig keeps it as a desideratum, Austin rejects it; the pig); the lecture's reconciliation in five points; your view.<\/p>\n<p><strong>Quick self test<\/strong><\/p>\n<ul>\n<li>What is the difference between an objective and a personal commitment to truth?<\/li>\n<li>Fill in: believing is to intending as knowing is to ____.<\/li>\n<li>What is the \"new plunge\"?<\/li>\n<li>Why is \"I know but I might be wrong\" unsayable, and why doesn't that make knowers infallible?<\/li>\n<li>Which kinds of people are we reluctant to take testimony from?<\/li>\n<li>What is testimonial injustice?<\/li>\n<li>What are Craig's three unreliable sources of truth?<\/li>\n<li>State Nozick's four conditions. Which premise of the BIV argument does he deny?<\/li>\n<li>Run the Jesse James case. What does it show?<\/li>\n<li>What is Austin's pig example for?<\/li>\n<\/ul>", "Week 8": "<h2>Overview<\/h2>\n<p>Week 8 turns to scepticism:<\/p>\n<ul>\n<li><strong>Lecture 14, ancient Pyrrhonism:<\/strong> scepticism as a way of life aimed at tranquillity. Agrippa's Trilemma argues that any reason for p ends in an infinite regress, a circle or an arbitrary assumption. The lecture's way out: <strong>default entitlements<\/strong>, like the default legal rights of a citizen.<\/li>\n<li><strong>Lecture 15, Descartes:<\/strong> scepticism as a <em>method<\/em> for finding absolutely certain foundations for the new science. The dream and evil demon doubts, the cogito, and God as guarantor. Plus how modern scepticism differs from ancient.<\/li>\n<\/ul>\n<p>This week covers Brigitte's Q3 (Agrippa's Trilemma, vicious regress) and sets up Q4 (pragmatists on the evil demon).<\/p>\n<h2>Lecture 14: Pyrrhonism and Agrippa's Trilemma<\/h2>\n<p>Reading: Jonathan Barnes, review of <em>Pyrrhonian Skepticism<\/em>, ed. Walter Sinnott Armstrong (<em>Mind<\/em>, 2006).<\/p>\n<h3>Recap from Austin and Craig<\/h3>\n<p>Knowing is factive; belief can be wrong. Knowledge is an objective apprehension of truth transmissible by testimony. Being counted a knower needs good (public, reliable) grounds. The concept's point is to give us access to others' cognitive resources.<\/p>\n<h3>Pyrrhonism: scepticism as a way of life<\/h3>\n<ul>\n<li><strong>Pyrrho of Elis (360 to 270 BC)<\/strong>; our main source is <strong>Sextus Empiricus (160 to 210 AD)<\/strong>.<\/li>\n<li>Their wisdom consisted in <em>not<\/em> having a doctrine (compare Wittgenstein). The way to a tranquil life is not to take sides in disputes but to suspend belief on all contentious matters.<\/li>\n<li><strong>Method:<\/strong> for any p, produce equally good reasons for p and for not p. This <strong>equipollence<\/strong> leads to <strong>suspension of belief<\/strong> (epochē), in the hope that it brings <strong>tranquillity (ataraxia)<\/strong>. They can't <em>predict<\/em> it will, since that would be dogmatic.<\/li>\n<\/ul>\n<p><strong>Map of ancient philosophers (lovers of wisdom):<\/strong><\/p>\n<ol>\n<li>Those who argue for a claim to truth or falsity:<ul>\n<li><strong>Dogmatists<\/strong>, e.g. Plato (think they've reached the truth by reasoning; not today's insult).<\/li>\n<li><strong>Negative dogmatists<\/strong>, e.g. <strong>Academic sceptics<\/strong>, who argue for the claim \"there is no knowledge\".<\/li>\n<\/ul>\n<\/li>\n<li>Those who make no claims but keep inquiring: <strong>Pyrrhonian sceptics<\/strong>, who use argument only to suspend judgment.<\/li>\n<\/ol>\n<h3>Agrippa's Trilemma<\/h3>\n<p><strong>Agrippa<\/strong> (1st to 2nd century AD) formulated the <strong>Five Modes<\/strong>, argument types used to induce suspension of belief. Three of them form the <strong>trilemma: regress, circle, assumption<\/strong>. It argues in the abstract that we have no reason to believe any p. In Pyrrhonian practice it's used to counterbalance someone else's reasons for p.<\/p>\n<p><strong>1. Infinite regress:<\/strong> believe p, and you can be asked \"why believe that?\" Give a reason, and the same question applies to it, and so on. Demanding independent reasons generates an infinite regress of reasons for reasons. (Compare the child who keeps asking \"why?\")<\/p>\n<p><strong>2. Arguing in a circle:<\/strong> block the regress by looping: P1 because P2, P2 because P3, P3 because P1. But then none of P1, P2, P3 has any independent support.<\/p>\n<p><strong>3. Ad hoc assumption:<\/strong> just stop somewhere. But stopping arbitrarily, without good reason, confers no entitlement on anything along the chain, including the original belief.<\/p>\n<p>None of the three is acceptable, so the demand for independent reasons produces an intolerable trilemma.<\/p>\n<h3>Virtuous vs vicious (key to Brigitte's Q3)<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Virtuous<\/th>\n<th>Vicious<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Infinite regress<\/td>\n<td>Adding \"it is true that\" again and again to p. It does nothing to undermine p.<\/td>\n<td>The reasons regress: entitlement to the original belief is never established, only endlessly deferred.<\/td>\n<\/tr>\n<tr>\n<td>Circle<\/td>\n<td>Inter definable concepts, e.g. description, fact, true proposition.<\/td>\n<td>The circle of reasons: entitlement to the original belief is never established.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The test:<\/strong> a regress or circle is vicious when the thing you need (entitlement) is never actually delivered, only passed along. It's virtuous when nothing depends on completing it.<\/p>\n<h3>Traditional responses<\/h3>\n<p>Standard positions in epistemology can be read as reactions to the trilemma:<\/p>\n<ul>\n<li><strong>Foundationalism:<\/strong> stop the regress in a principled way, with self justifying beliefs as non ad hoc stopping points. Candidates: \"I exist\", \"I am thinking\" (to think them they must be true; Descartes's cogito). <strong>Problem:<\/strong> too few such beliefs to build a plausible epistemology.<\/li>\n<li><strong>Coherentism:<\/strong> justification is a large web, not a chain, so the circularity charge loses force. <strong>Problem:<\/strong> too many coherent sets of beliefs. How do we tell which is right?<\/li>\n<\/ul>\n<h3>The lecture's way out: default entitlements<\/h3>\n<ol>\n<li>Recall the distinction: <strong>justification<\/strong> = being epistemically blameless, <em>entitled<\/em>; <strong>grounds<\/strong> = an objective likelihood of being right, whether you're aware of it or not.<\/li>\n<li>The trilemma's power rests on the assumption that to be entitled to p you must have an <strong>independent reason<\/strong> for it.<\/li>\n<li><strong>Block it at the first step:<\/strong> deny that entitlement <em>always<\/em> requires an independent reason. Some entitlement is earned another way.<\/li>\n<li>But entitlement can't be free, or we'd be entitled to anything: astral travel, astrology, healing crystals, witches, flying elephants.<\/li>\n<li><strong>Responsible epistemic citizens:<\/strong> knowing what justifies what, which sources to trust, how to weigh evidence, when to be suspicious. Being such a believer earns you entitlements.<\/li>\n<li><strong>Default entitlements:<\/strong> we're entitled to many beliefs just by holding them as responsible believers within shared epistemic practices.<\/li>\n<li><strong>Legal analogy:<\/strong> Australian citizens have default legal rights just by being citizens. They can be lost (treason, renunciation, psychosis, crime).<\/li>\n<li><strong>Stopping the regress:<\/strong> default entitlements are <strong>non arbitrary<\/strong> stopping places (unlike ad hoc assumption) but <strong>not self justifying<\/strong> (unlike foundationalism). Entitlement flows up the chain. <strong>The trilemma dissolves.<\/strong><\/li>\n<\/ol>\n<p><strong>Where defaults come from:<\/strong> learning a language inducts you into \"the game of giving and asking for reasons\". You couldn't learn a language without becoming a reliable reporter of your surroundings, so default entitlement goes with a <strong>defeasible assumption of reliability<\/strong>.<\/p>\n<p><strong>Perception:<\/strong> most perceptual truths come unselfconsciously, without reasoning (\"I see that there is a pig in the sty\"). We're default entitled because they come from a reliable capacity, and they normally count as knowledge.<\/p>\n<p><strong>Losing a default:<\/strong> an appropriate challenge removes the entitlement (\"That's not a pig. It's a decoy.\"). Now you need a reason to defeat the challenge (\"It just oinked. So it's a pig after all!\").<\/p>\n<h3>Barnes's review (the reading)<\/h3>\n<ul>\n<li>Barnes reconstructs the old argument: either you have nothing to say for P1 (so suspend judgment, since any choice is arbitrary), or you offer P2. If P2 is just P1 again, that's circular (\"we're here because we're here because we're here\"). If it's new, the same applies to P2, and so on ad infinitum. \"But you can't go on ad infinitum.\"<\/li>\n<li>Many contributors (Stroud, Williams, Fogelin) say the argument only shows <strong>\"If Q, then scepticism\"<\/strong>, where Q is some philosophical theory of knowledge. Drop Q and escape. Williams: \"skepticism about philosophy is the answer to philosophical skepticism.\"<\/li>\n<li><strong>Barnes disagrees.<\/strong> The Pyrrhonian argument is not a challenge but an invitation to reflect on what judgments we can reasonably make. It uses no special theory, only three \"utterly humdrum ideas\": don't plump for p when you've no reason to prefer it to not p; circular reasoning is no good; you can't reason forever.<\/li>\n<li>His verdict: Pyrrhonism is \"an enemy to common sense\", and philosophical epistemology doesn't release scepticism, it tries to dam it.<\/li>\n<li><strong>Exam use:<\/strong> Barnes is the strongest statement that the trilemma is hard. The default entitlement reply effectively rejects his first humdrum idea, that you need a reason to prefer p.<\/li>\n<\/ul>\n<h2>Lecture 15: Descartes and Modern Scepticism<\/h2>\n<p>Reading: Descartes, <em>Meditations on First Philosophy<\/em> (1641), Meditations 1 to 3.<\/p>\n<h3>Recap<\/h3>\n<p>The demand that entitlement always needs an independent reason creates the vicious regress (and the trilemma). Way out: question the assumption. Learning language inducts us into giving and asking for reasons, making us responsible epistemic citizens with default entitlements to knowledge (testimony) and beliefs (perception, memory, inference).<\/p>\n<h3>Descartes and \"first philosophy\"<\/h3>\n<ul>\n<li><strong>René Descartes (1596 to 1650):<\/strong> French mathematician, scientist and philosopher. Modern philosophy starts with his sceptical doubts.<\/li>\n<li><strong>The meditator:<\/strong> the philosopher must meditate alone, \"seriously\", and withdraw the mind from all preconceived opinions (parents, teachers, religious and political authorities). Med 1: it was necessary \"once in the course of my life, to demolish everything completely and start again right from the foundations\".<\/li>\n<li><strong>A priori foundationalism:<\/strong> \"first\" philosophy aims at foundations for the new science, especially mathematical physics.<\/li>\n<li><strong>Literary form borrowed from religion:<\/strong> the reader meditates along with him to undergo a cognitive transformation (like a spiritual one).<\/li>\n<\/ul>\n<h3>Scepticism used for other purposes<\/h3>\n<table>\n<thead>\n<tr>\n<th>Use<\/th>\n<th>Who<\/th>\n<th>Aim<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Way of life<\/td>\n<td>Ancient Pyrrhonists<\/td>\n<td>Tranquillity<\/td>\n<\/tr>\n<tr>\n<td>Fideism<\/td>\n<td>Catholic theologians, 16th century Reformation<\/td>\n<td>Pyrrhonism undermines any reason to become Protestant, so stay in your Catholic faith<\/td>\n<\/tr>\n<tr>\n<td>Method<\/td>\n<td>Descartes<\/td>\n<td>Foundations for the new mechanistic science<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Descartes was no sceptic.<\/strong> He called the ancients' scepticism \"stale cabbage\". He takes a <strong>foundationalist<\/strong> response to Agrippa: find self evident knowledge (the cogito) to stop the regress of doubt, then build everything else on that \"meagre foundation\". Excessive doubt is a method for discovering absolutely certain knowledge.<\/p>\n<h3>External world scepticism<\/h3>\n<ul>\n<li>To have <strong>scientia<\/strong> (absolutely certain knowledge) we must eliminate all possible doubt, an extremely demanding standard.<\/li>\n<li><strong>Madness:<\/strong> he sets aside likening himself to madmen.<\/li>\n<li><strong>Dreaming:<\/strong> \"I see plainly that there are never any sure signs by means of which being awake can be distinguished from being asleep.\" Even painters building sirens and satyrs must use simpler real elements (colours, shapes), so at first simple things like extension and number seem to survive.<\/li>\n<li><strong>Maths doubt:<\/strong> \"may I not similarly go wrong every time I add two and three?\" God could have made us so that we can't conceive 3 + 2 = 5 is wrong though it is. Descartes even holds God could have <em>chosen<\/em> that it be false (<strong>voluntarism<\/strong>, a very odd doctrine).<\/li>\n<li><strong>The evil demon:<\/strong> \"some malicious demon of the utmost power and cunning has employed all his energies in order to deceive me\". Sky, earth, colours, shapes, sounds might all be delusions he sets up. Modern version: the <strong>brain in a vat<\/strong>.<\/li>\n<li>So we don't know anything about the external world.<\/li>\n<\/ul>\n<p><strong>The meditator's argument<\/strong> (KNOW in capitals = scientia, absolutely certain knowledge):<\/p>\n<ol>\n<li>Assume I KNOW I have two hands.<\/li>\n<li>If I KNOW I have two hands, I KNOW I'm not dreaming (or a BIV).<\/li>\n<li>I don't KNOW I'm not dreaming (or a BIV).<\/li>\n<li>So I don't KNOW I have two hands.<\/li>\n<\/ol>\n<p>(Same structure as the BIV argument Nozick attacks in Week 7.)<\/p>\n<h3>Possible vs relevant doubts<\/h3>\n<ul>\n<li>\"Possible\" can't mean physically possible: we've never met evil demons and science doesn't posit them (or brains in vats).<\/li>\n<li><strong>Austin:<\/strong> if S knows p then logically there's no possibility of not p. But it doesn't follow that S must investigate and eliminate <em>every<\/em> way not p could be true. Ordinarily we only deal with a small class of <strong>relevant doubts<\/strong> (compare Craig's epistemically relevant worlds).<\/li>\n<\/ul>\n<h3>Ordinary vs metaphysical doubt<\/h3>\n<ul>\n<li>Courts, police, labs and Arctic explorers never doubt a witness because they might be dreaming or deceived by a demon.<\/li>\n<li>Descartes knows his doubts are extraordinary, bizarre, crazy in normal life. He calls them <strong>\"metaphysical\"<\/strong>, to be taken seriously only within this special inquiry.<\/li>\n<li><strong>Ordinary sensory doubt:<\/strong> worry about your eyesight? Check at the optometrist.<\/li>\n<li><strong>Philosophical sensory doubt:<\/strong> doubt about the senses <em>in general<\/em>. No perception can check another without begging the question; you can't rely on others either. How could you show perception is reliable without using perception?<\/li>\n<\/ul>\n<h3>Unlivability<\/h3>\n<ul>\n<li><strong>Pyrrhonism:<\/strong> you can't act without beliefs. Pyrrho reportedly needed minders to stop him walking off cliffs or into fires. Pyrrhonians concede they have beliefs forced on them by appearances (the senses); what they give up are reason based beliefs (\"dogmas\").<\/li>\n<li><strong>Descartes avoids the problem:<\/strong> he only doubts that we have <em>absolutely certain<\/em> knowledge. For the inquiry he brackets reasonable beliefs and treats them as if false.<\/li>\n<li><strong>Mitigated scepticism:<\/strong> concede we lack the demanding knowledge the sceptic wants, but keep everyday knowledge, knowledge for practical purposes.<\/li>\n<\/ul>\n<h3>Other kinds of scepticism<\/h3>\n<ul>\n<li><strong>Memory:<\/strong> Russell: \"there is no logical impossibility in the hypothesis that the world sprang into being five minutes ago, exactly as it then was, with a population that 'remembered' a wholly unreal past.\"<\/li>\n<li><strong>Testimony:<\/strong> conspiracy theorists doubt authorities (e.g. on JFK). But could <em>no<\/em> testimony from <em>anyone<\/em> be reliable?<\/li>\n<li><strong>Other minds:<\/strong> Descartes: from the window I see men crossing the square, \"yet do I see any more than hats and coats which could conceal automatons?\" Even seeing faces and bodies, how do we know others have minds, since all we see is behaviour?<\/li>\n<li><strong>Mathematics:<\/strong> the 2 + 3 doubt and voluntarism (above).<\/li>\n<\/ul>\n<h3>The cogito<\/h3>\n<p>In trying to doubt everything I find I can't doubt that I exist, and that in doubting I'm thinking. Med 2: \"this proposition, I am, I exist, is necessarily true whenever it is put forward by me or conceived in my mind.\" Canonical form: <strong>I think, therefore I am.<\/strong> And: \"I am, then, in the strict sense only a thing that thinks.\"<\/p>\n<p><strong>Why \"I think\" and not \"I drink, therefore I am\"?<\/strong> Three essential features:<\/p>\n<ol>\n<li><strong>First person:<\/strong> \"Descartes thinks\" or \"Descartes exists\" is easy to doubt from the third person.<\/li>\n<li><strong>Present tense:<\/strong> \"I was thinking last Tuesday\" is easy to doubt.<\/li>\n<li><strong>Mental acts only:<\/strong> \"I drink\" can be doubted, since you can doubt you have a body.<\/li>\n<\/ol>\n<p><strong>The wax (Med 2):<\/strong> wax fresh from the honeycomb has a taste, smell, colour, shape, sound. Put it by the fire and every sensory quality changes, yet it's the same wax. So what we grasp of the wax is something extended, flexible and changeable, known \"by the mind alone\", not by the senses or imagination. This supports the claim that the mind is better known than body.<\/p>\n<h3>God and the aftermath<\/h3>\n<ul>\n<li>Med 3 rule: whatever I perceive <strong>clearly and distinctly<\/strong> is true. But a deceiving God could make even that unreliable, so Descartes must prove a good God exists who isn't a deceiver.<\/li>\n<li>Descartes's method finds absolute certainties, tested by <strong>indubitability<\/strong>. But certainties sit at the top of the belief scale (compare Austin on being sure), so they're compatible with being wrong. On his view certainty and doubt are matters of psychology.<\/li>\n<li><strong>Theistic guarantee:<\/strong> God guarantees our certainties are truths, and that the shaky inference from sensory \"seemings\" to an external world is largely correct.<\/li>\n<li>Unsurprisingly, the sceptical half of the <em>Meditations<\/em> has been far more influential than the constructive half with its questionable theistic epistemology.<\/li>\n<\/ul>\n<h3>Ancient vs modern scepticism<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Ancient (Pyrrhonian)<\/th>\n<th>Modern (Cartesian)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Status<\/td>\n<td>A way of life<\/td>\n<td>An intellectual position or method<\/td>\n<\/tr>\n<tr>\n<td>Aim<\/td>\n<td>Tranquillity through suspending belief<\/td>\n<td>Certain foundations for science<\/td>\n<\/tr>\n<tr>\n<td>Targets<\/td>\n<td>All reason based belief (dogma)<\/td>\n<td>Knowledge of the external world<\/td>\n<\/tr>\n<tr>\n<td>Keeps<\/td>\n<td>Appearances<\/td>\n<td>Knowledge of the contents of one's own mind<\/td>\n<\/tr>\n<tr>\n<td>From the other's view<\/td>\n<td>Sees modern scepticism as <strong>negative dogmatism<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Picture of mind<\/td>\n<td><\/td>\n<td>A mind radically autonomous from body, society and world<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Key terms<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<th>Who<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pyrrhonism<\/td>\n<td>Scepticism as a way of life; suspend belief to reach tranquillity<\/td>\n<td>Pyrrho, Sextus<\/td>\n<\/tr>\n<tr>\n<td>Equipollence<\/td>\n<td>Equally good reasons for p and not p<\/td>\n<td>Pyrrhonists<\/td>\n<\/tr>\n<tr>\n<td>Ataraxia<\/td>\n<td>Tranquillity, the hoped for result<\/td>\n<td>Pyrrhonists<\/td>\n<\/tr>\n<tr>\n<td>Dogmatist<\/td>\n<td>Anyone who thinks they've reached truth by reasoning (not an insult here)<\/td>\n<td>Ancient usage<\/td>\n<\/tr>\n<tr>\n<td>Academic sceptic<\/td>\n<td>Negative dogmatist: argues \"there is no knowledge\"<\/td>\n<td>Ancient<\/td>\n<\/tr>\n<tr>\n<td>Agrippa's Trilemma<\/td>\n<td>Reasons end in regress, circle or ad hoc assumption<\/td>\n<td>Agrippa<\/td>\n<\/tr>\n<tr>\n<td>Vicious regress / circle<\/td>\n<td>Entitlement never delivered, only deferred<\/td>\n<td>Lecture 14<\/td>\n<\/tr>\n<tr>\n<td>Virtuous regress / circle<\/td>\n<td>Nothing depends on completing it (\"it is true that\"; inter definable concepts)<\/td>\n<td>Lecture 14<\/td>\n<\/tr>\n<tr>\n<td>Foundationalism<\/td>\n<td>Stop the regress with self justifying beliefs<\/td>\n<td>Descartes<\/td>\n<\/tr>\n<tr>\n<td>Coherentism<\/td>\n<td>Justification as a web, not a chain<\/td>\n<td>Lecture 14<\/td>\n<\/tr>\n<tr>\n<td>Default entitlement<\/td>\n<td>Entitled to a belief as a responsible believer, unless challenged<\/td>\n<td>Lecture 14<\/td>\n<\/tr>\n<tr>\n<td>Responsible epistemic citizen<\/td>\n<td>Knows what justifies what, whom to trust, when to doubt<\/td>\n<td>Lecture 14<\/td>\n<\/tr>\n<tr>\n<td>Defeasible<\/td>\n<td>Can be lost under appropriate challenge<\/td>\n<td>Lecture 14<\/td>\n<\/tr>\n<tr>\n<td>Scientia<\/td>\n<td>Absolutely certain knowledge<\/td>\n<td>Descartes<\/td>\n<\/tr>\n<tr>\n<td>Methodological scepticism<\/td>\n<td>Doubt as a method, not a doctrine<\/td>\n<td>Descartes<\/td>\n<\/tr>\n<tr>\n<td>Fideism<\/td>\n<td>Use scepticism to defend staying in one's faith<\/td>\n<td>Catholic theologians<\/td>\n<\/tr>\n<tr>\n<td>Metaphysical doubt<\/td>\n<td>Extraordinary doubt (dreams, demon) only for philosophy<\/td>\n<td>Descartes<\/td>\n<\/tr>\n<tr>\n<td>Relevant doubts<\/td>\n<td>The small class ordinary inquiry must rule out<\/td>\n<td>Austin, Craig<\/td>\n<\/tr>\n<tr>\n<td>Cogito<\/td>\n<td>I think, therefore I am<\/td>\n<td>Descartes<\/td>\n<\/tr>\n<tr>\n<td>Voluntarism<\/td>\n<td>God could have made 2 + 3 = 5 false<\/td>\n<td>Descartes<\/td>\n<\/tr>\n<tr>\n<td>Mitigated scepticism<\/td>\n<td>No scientia, but everyday knowledge remains<\/td>\n<td>Lecture 15<\/td>\n<\/tr>\n<tr>\n<td>Negative dogmatism<\/td>\n<td>How Pyrrhonists see modern scepticism<\/td>\n<td>Lecture 15<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Things to cite in the exam<\/h2>\n<ul>\n<li><strong>Pyrrho of Elis<\/strong> and his minders (unlivability); <strong>Sextus Empiricus<\/strong> as source.<\/li>\n<li><strong>Agrippa's Five Modes<\/strong>, three of which make the trilemma.<\/li>\n<li><strong>The child who keeps asking \"why?\"<\/strong>: the regress in everyday form.<\/li>\n<li><strong>\"It is true that...\"<\/strong> regress (virtuous) vs reasons regress (vicious).<\/li>\n<li><strong>Description, fact, true proposition:<\/strong> a virtuous circle.<\/li>\n<li><strong>Citizenship analogy:<\/strong> default legal rights, lost through treason, renunciation, crime.<\/li>\n<li><strong>The pig in the sty, the decoy, the oink:<\/strong> how a default entitlement is challenged and restored.<\/li>\n<li><strong>Barnes:<\/strong> three \"utterly humdrum ideas\"; \"If Q, then scepticism\"; Pyrrhonism as \"an enemy to common sense\".<\/li>\n<li><strong>Descartes:<\/strong> \"stale cabbage\"; dream argument; malicious demon; \"I am, I exist\"; the wax; hats and coats that could hide automatons.<\/li>\n<li><strong>Russell's five minute hypothesis<\/strong> (memory scepticism).<\/li>\n<li><strong>Optometrist vs senses in general:<\/strong> ordinary vs philosophical doubt.<\/li>\n<\/ul>\n<h2>Objections and replies<\/h2>\n<p><strong>On default entitlements<\/strong><\/p>\n<ul>\n<li><em>Isn't this just the ad hoc horn?<\/em> Reply: no, defaults are non arbitrary, earned by being a responsible believer in shared practices, with a defeasible presumption of reliability. And they're defeasible, unlike dogma.<\/li>\n<li><em>Too permissive:<\/em> why not a default entitlement to astrology? Reply: responsible epistemic citizens know which sources and practices are reliable; astrology isn't one.<\/li>\n<li><em>Barnes's challenge:<\/em> it rejects his humdrum idea that you need a reason to prefer p. Is that cheating? Reply: in practice we don't need reasons for perception or testimony until there's a concrete challenge (Austin: trust unless there's reason to distrust).<\/li>\n<li><em>Relativism:<\/em> whose shared practices? Different communities have different defaults.<\/li>\n<\/ul>\n<p><strong>On Descartes<\/strong><\/p>\n<ul>\n<li><em>Too few foundations:<\/em> the cogito alone can't support the rest of knowledge.<\/li>\n<li><em>The Cartesian circle<\/em> (a standard objection, not in the slides): he uses clear and distinct perception to prove God exists, then uses God to guarantee clear and distinct perception. That's the vicious circle horn of the trilemma.<\/li>\n<li><em>Certainty is psychological:<\/em> indubitability is being sure, the top of the belief scale, which Austin says isn't knowledge.<\/li>\n<li><em>Irrelevant doubts:<\/em> the demon isn't a relevant possibility, so the standard of scientia is the problem, not our knowledge.<\/li>\n<li><em>The isolated mind:<\/em> Descartes assumes a mind independent of body and society; the pragmatists and the Week 6 to 7 social view of knowledge reject this.<\/li>\n<\/ul>\n<h2>Connections<\/h2>\n<ul>\n<li><strong>Week 6 (Gettier):<\/strong> strengthening to infallible justification failed, as Descartes's scientia demands too much.<\/li>\n<li><strong>Week 6 (Radford) and Week 7 (Austin):<\/strong> knowledge doesn't need certainty, and certainty is only being sure.<\/li>\n<li><strong>Week 7 (Nozick):<\/strong> the BIV argument is the meditator's argument.<\/li>\n<li><strong>Week 7 (Craig):<\/strong> relevant possibilities, which Descartes ignores.<\/li>\n<li><strong>Week 9 (pragmatists):<\/strong> Peirce's response to the evil demon (Brigitte's Q4).<\/li>\n<li><strong>Week 6 (evidentialism):<\/strong> Clifford's regress is the trilemma's first horn.<\/li>\n<\/ul>\n<h2>Practice questions<\/h2>\n<p><strong>1. What is Agrippa's Trilemma? Does it involve a vicious infinite regress? (Brigitte's Q3)<\/strong><\/p>\n<p>A possible line: yes, the reasons regress is vicious, but only given an assumption we can reject.<\/p>\n<ol>\n<li><strong>Context:<\/strong> Pyrrhonian sceptics (Pyrrho, Sextus) used Agrippa's modes to induce suspension of belief and tranquillity. Three of the Five Modes form the trilemma.<\/li>\n<li><strong>The trilemma:<\/strong> demand an independent reason for p and you face (a) an infinite regress of reasons for reasons, (b) a circle, or (c) an ad hoc stopping point. Explain why each confers no entitlement. Barnes's reconstruction is a clean statement.<\/li>\n<li><strong>Virtuous vs vicious:<\/strong> not every regress is vicious. Adding \"it is true that\" forever doesn't threaten p. The reasons regress is vicious because entitlement to the first belief is endlessly deferred and never established. Same for circles: inter definable concepts are fine, a circle of reasons isn't.<\/li>\n<li><strong>So yes<\/strong>, given its assumption, the trilemma's regress is vicious.<\/li>\n<li><strong>Traditional responses:<\/strong> foundationalism (Descartes's cogito, but too few foundations) and coherentism (a web, but too many coherent webs).<\/li>\n<li><strong>The better response:<\/strong> deny the assumption that entitlement always requires an independent reason. Default entitlements for responsible epistemic citizens (the citizenship analogy) are non arbitrary but not self justifying stopping points. They're defeasible (the decoy pig). So the regress never gets started, and the trilemma dissolves.<\/li>\n<li><strong>Objection:<\/strong> Barnes says the argument rests only on humdrum ideas, not on a theory. Reply: the first humdrum idea (never accept p without a reason to prefer it) is exactly what default entitlement denies, and our actual practice (perception, testimony) supports denying it.<\/li>\n<li><strong>Conclude.<\/strong><\/li>\n<\/ol>\n<p><strong>2. Is Cartesian foundationalism a good response to Agrippa's Trilemma?<\/strong> Skeleton: Descartes's aim (scientia for the new science); foundationalism as stopping the regress in a principled way; the cogito and its three features; the problems: too few foundations, reliance on God, the Cartesian circle (vicious circle horn), certainty is only psychological (Austin); compare default entitlements; verdict.<\/p>\n<p><strong>3. What is the difference between philosophical doubt and everyday doubt? Does it matter?<\/strong> Skeleton: everyday doubt is local and checkable (optometrist, courts, labs); Descartes's metaphysical doubt is global (dream, demon, senses in general) and can't be checked without begging the question; possible vs relevant doubts (Austin, Craig); Descartes admits his doubts would be crazy in ordinary life; argue that knowledge only requires ruling out relevant doubts, so global doubt shows scientia is out of reach, not that ordinary knowledge is; preview the pragmatists.<\/p>\n<p><strong>4. Compare ancient and modern scepticism.<\/strong> Skeleton: Pyrrhonism as a way of life (equipollence, suspension, ataraxia; Pyrrho's minders) vs Descartes's method (scientia, dream and demon, keeps knowledge of his own mind); unlivability and how each handles it; Pyrrhonists see Descartes as a negative dogmatist; Descartes's new conception of the isolated mind; which is the stronger challenge? (Barnes suggests the ancient one.)<\/p>\n<p><strong>5. Can we answer the child who constantly asks \"Why do you believe that?\" Does it matter?<\/strong> Skeleton: the child is running the regress horn; we can't satisfy the demand for independent reasons forever; but we can reject the demand: default entitlements, the game of giving and asking for reasons, challenges must be appropriate (the decoy) to require an answer.<\/p>\n<p><strong>Quick self test<\/strong><\/p>\n<ul>\n<li>What did Pyrrhonists hope suspension of belief would bring, and why couldn't they predict it?<\/li>\n<li>Draw the map: dogmatists, negative dogmatists, Pyrrhonists.<\/li>\n<li>Name the trilemma's three horns and say why each fails.<\/li>\n<li>Give one virtuous regress and one virtuous circle.<\/li>\n<li>What does foundationalism try to do, and what's its problem? Coherentism?<\/li>\n<li>What's a default entitlement, and how can it be lost? Give the citizenship analogy.<\/li>\n<li>What are Barnes's three humdrum ideas?<\/li>\n<li>Why did Descartes call ancient scepticism \"stale cabbage\"?<\/li>\n<li>State the meditator's argument.<\/li>\n<li>What are the three essential features of the cogito? Why doesn't \"I drink, therefore I am\" work?<\/li>\n<li>Why does Descartes need God?<\/li>\n<\/ul>", "Week 9": "<h2>Overview<\/h2>\n<ul>\n<li><strong>Lecture 16, Peirce (last Knowledge lecture):<\/strong> pragmatism rebuilds epistemology around inquiry modelled on science. Of four methods of fixing belief, only the scientific method fits a mind independent reality. Pragmatism is <strong>fallibilist but anti sceptical<\/strong>: Cartesian \"paper doubt\" isn't real doubt. This is Brigitte's Q4.<\/li>\n<li><strong>Self section, lecture 1, plus Perry's dialogue:<\/strong> we care about our future selves (prudence). What makes a future self <em>mine<\/em>? First answer: numerical identity, and one version of it, the soul view, which Perry's Gretchen Weirob attacks. This is Brigitte's Q5.<\/li>\n<\/ul>\n<h2>Lecture 16: Peirce and American Pragmatism<\/h2>\n<p>Reading: C. S. Peirce, selections from \"The Fixation of Belief\" (1877) and \"Some Consequences of Four Incapacities\" (1868).<\/p>\n<h3>Descartes recap<\/h3>\n<p>Scientia requires absolute certainty, the impossibility of doubt. In that special inquiry every possible doubt is relevant, but that doesn't make every possible doubt relevant to ordinary knowledge (Austin). Certainties aren't guaranteed true, so Descartes needs an implausible proof of a good God. The cogito seems self justifying in the first person, present tense.<\/p>\n<h3>American pragmatism<\/h3>\n<ul>\n<li>Late 19th to early 20th century movement: <strong>C. S. Peirce<\/strong> (logician, the founder), <strong>William James<\/strong> (psychologist), <strong>John Dewey<\/strong> (polymath).<\/li>\n<li>Inspired by <strong>Darwin<\/strong>; gives priority to <strong>human practices and the agent's point of view<\/strong>.<\/li>\n<li>Pragmatism also has distinctive views of truth and meaning, but the course focuses on Peirce's science inspired epistemology.<\/li>\n<\/ul>\n<p><strong>Focus on belief, not knowledge:<\/strong> a strategic move. First get clear on belief and its relation to doubt, setting aside the need to show knowledge worthy grounds. Once the theory is running, many \"beliefs\" turn out to be <strong>knowledge for practical purposes<\/strong>.<\/p>\n<p><strong>Convergence theory of truth:<\/strong> Peirce rejects the correspondence theory as empty, since you can't get outside your beliefs to compare them with reality. Instead: \"The opinion which is fated to be ultimately agreed to by all who investigate is what we mean by truth, and the object represented in that opinion is the real.\" Assumption: our beliefs aim at a mind independent reality.<\/p>\n<p><strong>Reasoning:<\/strong> controlled deliberation that follows standards and can be done well or badly. We want arguments from true premises to true conclusions. Peirce's interest is in the right standards.<\/p>\n<h3>Belief and doubt<\/h3>\n<ul>\n<li><strong>Belief<\/strong> is a <strong>habit of action<\/strong>: a stable, calm and satisfying state, the absence of doubt.<\/li>\n<li><strong>Doubt<\/strong> isn't disbelief. It's being undecided, wavering between belief and disbelief (James Joyce: \"twosome twiminds\"). It's an uneasy, unstable state, a kind of paralysis, an inability to act.<\/li>\n<li>\"The irritation of doubt causes a struggle to attain a state of belief... the sole object of inquiry is the settlement of opinion.\"<\/li>\n<li><strong>Inquiry path:<\/strong> belief, surprise, doubt, inquiry, belief.<\/li>\n<li>We start with the beliefs we have. Inquiry is self correcting: fallible yet anti sceptical.<\/li>\n<\/ul>\n<h3>The four methods of fixing belief<\/h3>\n<table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Kind<\/th>\n<th>How it works<\/th>\n<th>Problem<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tenacity<\/td>\n<td>Personal faith<\/td>\n<td>\"Strength of one's convictions\": ignore contrary evidence, repeat the same considerations, keep like minded company. Peirce's image: the ostrich burying its head in the sand.<\/td>\n<td>The <strong>social impulse<\/strong>: others no less reasonable disagree. Solution: treat inquiry as a social task.<\/td>\n<\/tr>\n<tr>\n<td>Authority<\/td>\n<td>Organised faith<\/td>\n<td>An institution (e.g. the church) indoctrinates the young, blocks contrary views, suppresses dissent.<\/td>\n<td>We become \"intellectual slaves\"; doubt arises because reasonable people in other cultures and ages believe differently.<\/td>\n<\/tr>\n<tr>\n<td>A priori<\/td>\n<td>Individual reason<\/td>\n<td>The method of metaphysics: free reasoning that responds to doubt.<\/td>\n<td>Metaphysical systems are a matter of taste; they conflict with no way to settle disputes.<\/td>\n<\/tr>\n<tr>\n<td>Science<\/td>\n<td>Social reasoning plus empirical testing<\/td>\n<td>Public inquiry into a reality anyone can investigate; values data, experiment, corroboration; aims at rational consensus.<\/td>\n<td>None decisive. Peirce: it's the only one that fits the realist hypothesis.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Pros of the others:<\/strong> tenacity and authority bring peace of mind; authority enables great collaborative projects (the Pyramids); the a priori method gives freedom of mind and \"comfortable conclusions\".<\/p>\n<p><strong>Cons:<\/strong> none of them distinguishes right from wrong ways of reaching the truth, and nothing suggests their results match an independent reality not of our making. <strong>Only the scientific method fits the fundamental \"realist\" hypothesis<\/strong> of a mind independent reality our beliefs aim at.<\/p>\n<p><strong>Peirce's realist hypothesis:<\/strong> \"There are Real things, whose characters are entirely independent of our opinions about them\", which affect our senses by regular laws, so that anyone with enough experience and reasoning \"will be led to the one True conclusion\". Isn't this circular? Peirce replies: the method never leads to doubting the hypothesis; the dissatisfaction that drives inquiry already assumes there's one thing a proposition should represent; everyone uses the method on many things; and it has had wonderful success.<\/p>\n<p><strong>Science as democratic experimentalism:<\/strong> it runs on democratic norms of rationality: freedom, openness to criticism, equal right to speak, tolerance of rival views. For pragmatists the \"method\" isn't limited to science; science is just its best example. It can be used to study the novel, political justice, aesthetic norms.<\/p>\n<h3>Fallibilism<\/h3>\n<ul>\n<li>There are <strong>no absolute certainties<\/strong>, since nothing is indubitable.<\/li>\n<li>There are many things we don't <em>actually<\/em> doubt, but that doesn't mean they <em>can't<\/em> be doubted. Nothing is guaranteed true come what may.<\/li>\n<li>Even the cogito can be doubted, e.g. we can doubt what we mean by \"I\", \"exist\" and \"think\".<\/li>\n<\/ul>\n<h3>Default and challenge structure<\/h3>\n<ul>\n<li>We're <strong>default entitled<\/strong> to the beliefs we actually have, without reasons.<\/li>\n<li>The entitlement is <strong>defeasible<\/strong>: it lasts until the belief is appropriately challenged (compare Lecture 14).<\/li>\n<li><strong>Neurath's boat:<\/strong> revising beliefs is like repairing a boat at sea. You can't strip it down to the keel and rebuild from scratch; you replace planks while staying afloat.<\/li>\n<\/ul>\n<p><strong>Knowledge on this view:<\/strong> \"know\" takes question forms (what, when, where, how, who) because a genuine question stimulates inquiry. When it's settled, we have knowledge if our method was reliable, or passes a public standard of good grounds.<\/p>\n<p><strong>No pure inquiry:<\/strong> Descartes is wrong that there's inquiry defined just by wanting the truth free of all preconceptions. \"Tell me the facts!\" invites \"Facts about what? What's your interest or purpose?\" Inquiry needs a specific question or doubt.<\/p>\n<h3>Peirce against Cartesianism (\"Four Incapacities\")<\/h3>\n<p>Peirce lists the spirit of Cartesianism: (1) begin with universal doubt; (2) the ultimate test of certainty is individual consciousness; (3) a single thread of inference; (4) facts made inexplicable except by \"God makes them so\". His replies:<\/p>\n<ol>\n<li><strong>\"We cannot begin with complete doubt.\"<\/strong> We must begin with all the prejudices we actually have. Cartesian doubt is \"a mere self deception, and not real doubt\", and the Cartesian just formally recovers what he pretended to give up. It's as useless as going to the North Pole to get to Constantinople. Doubt needs a positive reason. <strong>\"Let us not pretend to doubt in philosophy what we do not doubt in our hearts.\"<\/strong><\/li>\n<li>Making the individual the absolute judge of truth (\"whatever I am clearly convinced of, is true\") is \"most pernicious\". Metaphysicians all claim certainty but agree on nothing else. We can only seek the truth for the <strong>community<\/strong> of inquirers.<\/li>\n<li>Philosophy should imitate science: its reasoning should be <strong>not a chain<\/strong> no stronger than its weakest link, but <strong>a cable<\/strong> whose fibres may be slender if numerous and connected.<\/li>\n<\/ol>\n<h3>Pragmatist responses to scepticism<\/h3>\n<p><strong>To Pyrrhonism:<\/strong> simply asking \"why?\" raises no genuine doubt. You need a <strong>positive reason<\/strong> to doubt in each particular case: you can doubt you see a pig if you're in a pig decoy factory, on a Hollywood set, or your eyesight is poor. Responsible participants in shared practices have default entitlements to belief and knowledge. (\"Fixation\": just putting a proposition as a question doesn't stimulate inquiry; \"There must be a real and living doubt\".)<\/p>\n<p><strong>To Descartes (and the evil demon):<\/strong><\/p>\n<ul>\n<li>Distinguish philosophical <strong>\"paper\" doubt<\/strong> from <strong>\"real and living\" doubt<\/strong>.<\/li>\n<li>We can't inquire by doubting (or pretending to doubt) everything.<\/li>\n<li>Inquiry is social, not individual: a community of inquirers, modelled on a team of scientists.<\/li>\n<li>It needs a genuine reason to doubt, against a background of many things we don't doubt.<\/li>\n<li>Yet nothing is absolutely certain: even our most cherished beliefs and methods might need revision. That's what makes it fallibilist and anti sceptical at once.<\/li>\n<\/ul>\n<h2>Self, Lecture 1: Prudence and the Self<\/h2>\n<p>Reading: John Perry, <em>A Dialogue on Personal Identity and Immortality<\/em> (1978), the First Night (set for Lectures 17 and 18).<\/p>\n<h3>Prudence<\/h3>\n<ul>\n<li>Most of us care what happens to us in the future and act on it. We make sacrifices now for our <strong>future selves<\/strong>: studying for a degree and a job, not eating the whole chocolate cake, saving money with interest.<\/li>\n<li>Many philosophers think you now have a reason (maybe only a <strong>pro tanto<\/strong> reason) to promote your future selves' wellbeing.<\/li>\n<li><strong>Pro tanto vs all things considered:<\/strong> a pro tanto reason speaks in favour of an action but can be outweighed. Lecture example: being super hungry gives me a pro tanto reason to eat someone in the lecture theatre, but not an all things considered one, since moral, prudential (I'd be arrested) and maybe aesthetic reasons (you might taste bad) outweigh it.<\/li>\n<li>These reasons seem <strong>distinctively prudential<\/strong>: caring about <em>me<\/em> and <em>my<\/em> welfare. A reason to promote <em>your<\/em> wellbeing seems moral. And the <em>way<\/em> I care about my future selves differs from how I care about a child or partner, even if I care about them a lot. It's not <em>how much<\/em> but the <em>way<\/em>.<\/li>\n<\/ul>\n<h3>What is wellbeing?<\/h3>\n<p>Prudence is roughly acting to promote your own wellbeing. But what's wellbeing?<\/p>\n<table>\n<thead>\n<tr>\n<th>Theory<\/th>\n<th>Wellbeing is<\/th>\n<th>Prudential reasons are<\/th>\n<th>Problem / point<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Desire satisfaction<\/td>\n<td>Having your desires satisfied<\/td>\n<td>Reasons that arise from your own desires (most fundamental desire is ice cream? Then you have prudential reason to get ice cream)<\/td>\n<td>Some desires, if satisfied, destroy you: e.g. a desire that would ruin your health, or to spend everything now and leave your future selves in poverty. Satisfying them isn't prudent.<\/td>\n<\/tr>\n<tr>\n<td>Objective list<\/td>\n<td>Having things on an objective list (health, happy experiences, friends, fulfilling work) whether or not you desire them<\/td>\n<td>Reasons to promote the items on the list, even against your desires<\/td>\n<td>Controversial what's on the list.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Either way, most philosophers agree we have prudential reasons to promote our own wellbeing.<\/p>\n<h3>The three questions<\/h3>\n<ol>\n<li>Why do we have reason to promote our future selves' wellbeing?<\/li>\n<li>What makes something a future self <em>of mine<\/em>?<\/li>\n<li>Do I have reason to promote all my future selves' wellbeing <em>equally<\/em>? (Time bias, later.)<\/li>\n<\/ol>\n<p>You might think 1 and 2 go together: whatever makes a self mine is what gives me reason to care about it.<\/p>\n<h3>First answer: identity<\/h3>\n<p><strong>Numerical vs qualitative identity:<\/strong><\/p>\n<ul>\n<li><strong>Qualitative identity:<\/strong> exactly alike, sharing all the same qualities. Identical twins, two apples, two pens. But there are still <em>two<\/em> of them.<\/li>\n<li><strong>Numerical identity:<\/strong> there is <em>just one thing<\/em>. Clark Kent is numerically identical with Superman: one guy (the alien) known by two names.<\/li>\n<li><strong>Jeremy and \"Jerald\":<\/strong> dazed on antihistamines, you meet Jeremy on Tuesday and \"Jerald\" on Friday and think you've met two men. In fact you met one man twice. Tuesday guy is numerically identical with Friday guy.<\/li>\n<\/ul>\n<p><strong>Endurantism:<\/strong> objects <strong>endure<\/strong> over time. The very same object (you) is wholly present at one time and at another. There's just one thing, me, here and there. (The \"enduring Suzy\" slide.)<\/p>\n<p><strong>Identity grounds prudence:<\/strong> I have reason to promote my future self's wellbeing because that future self <em>is me<\/em>, and of course I have reason to promote my <em>own<\/em> wellbeing.<\/p>\n<p>But you're very different from the baby you were. So what makes you numerically identical with earlier and later selves?<\/p>\n<h3>The soul view<\/h3>\n<ul>\n<li>There's a single soul at each time, and <strong>you are your soul<\/strong>. Same soul, same you. You survive just in case your soul survives; you go where your soul goes.<\/li>\n<li>Since a soul can survive the body's death, so can you. So you're <strong>not identical with your body<\/strong>; you inhabit it, like a container.<\/li>\n<li>Sounds good, but...<\/li>\n<\/ul>\n<h3>Problems for the soul view (lecture and Perry)<\/h3>\n<p><strong>1. Souls are undetectable.<\/strong> If souls are non physical, we can't see, touch or detect them. So how do we know \"my\" body yesterday and today housed the same soul? Maybe souls switched bodies overnight, and I'm somewhere else.<\/p>\n<p><strong>2. The correlation problem.<\/strong> Maybe same body is good evidence of same soul? But we only establish correlations by tracking <strong>both<\/strong> things (smoking and cancer: measure both). We can track bodies, not souls. So w
