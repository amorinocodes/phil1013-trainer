<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amorino's PHIL1013 Exam Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* stone, parchment and papyrus, with ochre and pastel pigments */
  --bg:#ebe6dc; --panel:#f8f4ec; --ink:#3b3630; --muted:#857d71; --line:#d9d1c3;
  --accent:#d9b44a; --accent-ink:#3b3630; --accent-soft:#f6ebc6;
  --good:#8fae8b; --good-soft:#e3ecdd; --bad:#c98f86; --bad-soft:#f3e0dc;
  --sky:#b9cbd6; --lav:#cfc4dc; --stone:#a9a297;
  --shadow:0 1px 2px rgba(60,50,35,.05),0 6px 18px rgba(60,50,35,.07);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#24221f;--panel:#2e2b27;--ink:#ece4d4;--muted:#a89e8e;--line:#423d36;--accent:#e2c264;--accent-ink:#2a2723;--accent-soft:#3d3524;--good:#9dbb98;--good-soft:#2c3529;--bad:#d29a91;--bad-soft:#3b2b28;--sky:#7f95a3;--lav:#958aa6;--stone:#6f685f;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;
  background-image:radial-gradient(rgba(120,105,80,.06) 1px,transparent 1px);background-size:18px 18px}
header{max-width:960px;margin:0 auto;padding:28px 20px 8px}
header::after{content:"";display:block;height:10px;margin-top:16px;opacity:.55;
  background:repeating-linear-gradient(90deg,var(--stone) 0 2px,transparent 2px 12px),linear-gradient(var(--stone),var(--stone));
  background-size:12px 10px,100% 2px;background-repeat:repeat-x,no-repeat;background-position:0 0,0 100%}
h1::before{content:"\0391 \039B \0397 \0398 \0395 \0399 \0391";display:block;font-family:Fraunces,Georgia,serif;font-size:12px;letter-spacing:.35em;color:var(--accent);margin-bottom:6px;font-weight:500}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
nav{max-width:960px;margin:16px auto 0;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:960px;margin:0 auto;padding:18px 20px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--good);color:var(--accent-ink)}
.btn.bad{background:var(--bad);color:var(--accent-ink)}
.chip.on{color:var(--ink)!important}
.chips .chip:nth-child(3n+2).on{background:#e8eff3;border-color:var(--sky)}
.chips .chip:nth-child(3n).on{background:#ece6f2;border-color:var(--lav)}
@media (prefers-color-scheme: dark){.chips .chip:nth-child(3n+2).on{background:#2b343a}.chips .chip:nth-child(3n).on{background:#332e3a}}
.stat:nth-child(4n+1){border-top:4px solid var(--accent)}
.stat:nth-child(4n+2){border-top:4px solid var(--sky)}
.stat:nth-child(4n+3){border-top:4px solid var(--good)}
.stat:nth-child(4n){border-top:4px solid var(--lav)}
nav button.on{background:var(--ink);color:var(--panel)}
.face.back{background:var(--accent-soft)}
.btn:disabled{opacity:.4;cursor:default}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{perspective:1200px;margin:14px 0 16px;cursor:pointer;user-select:none}
.card-in{position:relative;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:26px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.face .q{font-family:Fraunces,Georgia,serif;font-size:22px;line-height:1.35}
.face .a{font-size:16px}
.face .tag{position:absolute;top:14px;left:18px;font-size:12px;color:var(--muted)}
.face .hint{position:absolute;bottom:12px;right:16px;font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.stat b{font-size:15px}
.stat small{color:var(--muted)}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 14px;border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.qtext{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.35;margin:8px 0 0}
.score{font-family:Fraunces,Georgia,serif;font-size:40px;margin:6px 0}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.timer{font-family:Fraunces,Georgia,serif;font-size:28px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
ol.outline{padding-left:20px;margin:8px 0}
ol.outline li{margin:6px 0}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.muted{color:var(--muted)}
.esq{display:grid;gap:8px;margin-top:12px}
.esq button{text-align:left}
.kbd{font-size:12px;color:var(--muted);margin-top:8px}
.hide{display:none}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.split{grid-template-columns:1fr}.face .q{font-size:19px}}

#ham{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#ham img{width:84px;height:auto;cursor:pointer;pointer-events:auto;filter:drop-shadow(0 4px 8px rgba(60,50,35,.18));transition:transform .2s;user-select:none;-webkit-user-drag:none;animation:hamIdle 3.2s ease-in-out infinite}
#ham img:hover{transform:scale(1.06) rotate(-4deg)}
#ham .bubble{pointer-events:auto;max-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:13px;line-height:1.4;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
#ham .bubble.show{opacity:1;transform:none}
#ham .count{display:block;font-size:11px;color:var(--muted);margin-top:4px}
@keyframes hamIdle{0%,100%{translate:0 0}50%{translate:0 -3px}}
@keyframes hamHop{0%{transform:translateY(0)}30%{transform:translateY(-26px) rotate(-8deg)}55%{transform:translateY(0) rotate(4deg)}70%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes hamSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes hamShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-5deg)}40%{transform:translateX(6px) rotate(5deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#ham img.hop{animation:hamHop .6s ease}
#ham img.spin{animation:hamSpin .7s ease}
#ham img.shake{animation:hamShake .5s ease}
@media (max-width:720px){#ham img{width:64px}#ham .bubble{max-width:170px}}
@media (prefers-reduced-motion: reduce){#ham img,#ham img.hop,#ham img.spin,#ham img.shake{animation:none}}

.xp{max-width:960px;margin:12px auto 0;padding:0 20px}
.xp-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.xp-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
.xp-rank{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:16px}
.face{border-left:8px solid var(--wc,var(--line))}
.face.front{background:linear-gradient(135deg,color-mix(in srgb,var(--wc) 18%,var(--panel)),var(--panel) 60%)}
.face.back{background:color-mix(in srgb,var(--wc) 26%,var(--panel));border-color:var(--wc)}
.face .sym{position:absolute;right:18px;top:6px;font-family:Fraunces,Georgia,serif;font-size:64px;line-height:1;color:var(--wc);opacity:.35;pointer-events:none}
.face .tag{background:color-mix(in srgb,var(--wc) 35%,transparent);color:var(--ink);padding:2px 9px;border-radius:99px}
.chip.wk.on{background:color-mix(in srgb,var(--wc) 35%,var(--panel))!important;border-color:var(--wc)!important}
.chip.wk{border-left:5px solid var(--wc)}
.stat{border-top:5px solid var(--wc)!important}
.qpanel{border-top:6px solid var(--wc)}
.qtag{display:inline-block;background:color-mix(in srgb,var(--wc) 35%,transparent);padding:2px 9px;border-radius:99px}
.mgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mt{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 12px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;transition:opacity .3s,background .2s}
.mt.term{border-left:6px solid var(--wc)}
.mt small{display:block;font-size:11px;color:var(--muted)}
.mt.sel{outline:2px solid var(--accent);outline-offset:1px}
.mt.ok{background:color-mix(in srgb,var(--wc) 40%,var(--panel));border-color:var(--wc);opacity:.55;cursor:default}
.mt.bad{background:var(--bad-soft);border-color:var(--bad)}
.mt.shake{animation:hamShake .4s ease}
.laurels{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.laurels span{position:absolute;top:-30px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:.2}}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:13px;color:var(--ink);background:var(--accent-soft);padding:3px 10px;border-radius:99px}
@media (max-width:720px){.mgrid{grid-template-columns:1fr}}

.sumnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--wc);background:var(--panel);color:var(--ink);font-family:Fraunces,Georgia,serif;font-size:17px;cursor:pointer}
.dot.on{background:var(--wc)}
.sum{position:relative;border-top:8px solid var(--wc);background:linear-gradient(160deg,color-mix(in srgb,var(--wc) 16%,var(--panel)),var(--panel) 45%);overflow:hidden}
.sum h2{font-family:Fraunces,Georgia,serif;font-size:28px;margin:4px 0 8px}
.sum .sym.big{position:absolute;right:20px;top:4px;font-family:Fraunces,Georgia,serif;font-size:110px;line-height:1;color:var(--wc);opacity:.3;pointer-events:none}
.bigidea{font-size:17px;line-height:1.5;margin:0 0 16px;max-width:680px}
.sumgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
ol.keys{padding-left:20px;margin:8px 0}
ol.keys li{margin:7px 0}
ol.keys li::marker{color:var(--wc);font-weight:700}
ul.who{list-style:none;padding:0;margin:8px 0}
ul.who li{margin:6px 0;padding-left:10px;border-left:3px solid var(--wc)}
.cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cites span{background:color-mix(in srgb,var(--wc) 30%,var(--panel));padding:4px 10px;border-radius:99px;font-size:13px}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.step{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 12px;border-radius:12px;font:inherit;cursor:pointer}
.step:hover{border-color:var(--wc)}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--wc);display:grid;place-items:center;font-weight:700}
.step small{display:block;color:var(--muted);font-size:12px}
.step.done{background:color-mix(in srgb,var(--wc) 25%,var(--panel))}
@media (max-width:720px){.sumgrid{grid-template-columns:1fr}.path{grid-template-columns:1fr 1fr}.sum .sym.big{font-size:80px}}

.who-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:3px 10px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.modal{position:fixed;inset:0;z-index:80;background:rgba(40,34,26,.45);display:grid;place-items:center;padding:20px}
.modal .panel{width:min(440px,100%);position:relative}
.modal h3{font-family:Fraunces,Georgia,serif;font-size:22px;margin:0 0 6px}
.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);margin:8px 0}
.plist{display:grid;gap:6px;margin:10px 0}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.prow.on{border-color:var(--accent);background:var(--accent-soft)}
.prow small{color:var(--muted)}
.codebox{width:100%;min-height:90px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);word-break:break-all}
.msg{font-size:13px;margin-top:6px}
.x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Amorino's PHIL1013 Exam Trainer</h1>
  <p class="sub">Society, Knowledge and Self. Weeks 5 to 13. Flashcards, quick quizzes and timed essay drills.</p>
</header>
<div class="xp"><div class="xp-box" id="xp"></div></div>
<nav id="nav">
  <button data-v="summary" class="on">Summaries</button>
  <button data-v="cards">Flashcards</button>
  <button data-v="quiz">Quiz</button>
  <button data-v="match">Match</button>
  <button data-v="essay">Essay drill</button>
  <button data-v="progress">Progress</button>
</nav>
<main>
  <section id="v-summary"></section>
  <section id="v-cards" class="hide"></section>
  <section id="v-quiz" class="hide"></section>
  <section id="v-match" class="hide"></section>
  <section id="v-essay" class="hide"></section>
  <section id="v-progress" class="hide"></section>
</main>

<script>
const DECK = {
"Week 5": [
["What two problems does Arendt take from the Eichmann case?","Conceptual: define a new kind of evil that does not depend on the doer's intention. Legal: work out how such evil can be judged in law."],
["What does \"banality\" describe in \"the banality of evil\": the deed or the doer?","The doer. The Holocaust is not banal; Eichmann's shallowness is."],
["What is Arendt's specific charge against Eichmann?","Thoughtlessness: an inability to think from another's standpoint, shielded by cliché and the general climate of opinion."],
["What is the shallow reading of banality, and why does the lecture reject it?","Evil done for petty motives like career. Rejected because it just swaps diabolical intentions for ordinary ones and stays inside the category of intention."],
["What is theodicy?","The vindication of God's goodness in view of evil (theos, god; dikē, justice). Broadly, any scheme that lets us place evil and carry on."],
["What did the Lisbon earthquake (1755) do to the concept of evil?","It shook deism and led us to deny nature has moral meaning, so evil was confined to human intentions and wills."],
["Why does Eichmann break the post Lisbon settlement?","He produced more evil with less malice than ever before, so the intention criterion of evil fails."],
["What did the Israeli court say about distance and responsibility?","Responsibility generally increases the further you are from the person who uses the fatal instrument with his own hands (247)."],
["What do Eichmann's last words show?","Even facing his own death he reached for funeral oratory clichés, contradicting himself: language used to insulate himself from reality."],
["What are Arendt's three lessons?","Enormous crime without enormous malice; deep responsibility despite physical remoteness; knowing evil insulated by cliché, conformity and thoughtlessness."],
["What is the difference between philosophy and sophistry for Plato?","Sophistry is persuasive speech aimed at winning; philosophy is reason and argument aimed at truth."],
["Define a priori and a posteriori knowledge.","A priori: by reflection, not particular observation (maths, philosophy for Plato). A posteriori: based on particular observation and experiment."],
["What is the difference between know that and know how?","Know that is knowing a truth, shown by giving reasons in words. Know how is a skill, shown by doing something that works, like riding a bike."],
["Why is true opinion as good a guide as knowledge (Meno)?","Someone with a true belief about the road to Larissa leads you there just as well as someone who knows it."],
["What do the statues of Daedalus illustrate?","True beliefs run away unless fastened by a reasoned understanding of causes; fastened, they become knowledge and abide."],
["What is the clay analogy for?","Listing kinds of clay (or knowledge) is no answer; Socrates wants the nature of knowledge in the abstract."],
["State Plato's definition of knowledge.","True opinion combined with a rational account: truth, belief and justification, each necessary and jointly sufficient (JTB)."],
["What do the coin toss and L shaped cloud cases show?","Accidentally true belief is not knowledge; knowledge is non accidentally true belief."],
["What are Plato's two models of knowledge?","Craft (shoemaking, carpentry, knowing the way) and mathematics (geometry)."]
],
"Week 6": [
["State JTB formally.","S knows that p iff (1) p is true, (2) S believes p, (3) S is justified in believing p."],
["What are Gettier's two assumptions?","You can be justified in believing something false; justification is closed under known logical implication."],
["Run the ten coins case.","Smith justifiably believes Jones will get the job and has ten coins, so infers the man who gets the job has ten coins. Smith gets the job and has ten coins: a justified true belief that is not knowledge."],
["Run the Ford and Barcelona case.","Smith justifiably believes Jones owns a Ford, so believes Jones owns a Ford or Brown is in Barcelona. Jones has no Ford but Brown is luckily in Barcelona."],
["Why does the lecture add the stopped clock and sheep cases?","They are Gettier cases with no false premise, so the problem is not just inference from falsehood."],
["What is reflective equilibrium (Goodman)?","Adjusting definitions and cases against each other for the best fit; examples are not sacrosanct."],
["What is the paradox of inquiry?","To define knowledge we must pick out cases of it, but how can we before we have the definition?"],
["Why does demanding infallible justification fail?","It blocks Gettier cases but all our evidence is fallible, so knowledge would become almost impossible."],
["What are the two senses of justification?","Epistemic blamelessness (entitlement) and reliability (ground: objective likelihood of being right)."],
["What is the moral of the Gettier cases?","Knowing is not just being right and blameless; you also need good grounds."],
["What does the locked car case show?","You can know something (that you locked the car) without being sure of it."],
["What does the librarian Miss Tercy show?","A knower need not be aware of her good grounds; others can credit her with knowledge she would not claim."],
["What is the KK principle and how does Jean refute it?","If you know p you know that you know p. Jean knows the dates in the history quiz without knowing he knows."],
["Why does Radford think Jean knows that James I died in 1625?","It is wildly implausible he guessed so many right; he must have learned them and remembered, though he forgot learning."],
["What radical claim does the history quiz support against Plato?","Knowledge does not require belief: Jean knows p while fairly sure his answer is wrong."],
["What is the doubtful chicken sexer case?","Jack reliably sexes chicks but is made to doubt his ability, so he does not believe he is right, yet he knows."],
["Why does Plato's view that knowledge includes belief seem plausible?","Under challenge we retreat from \"I know\" to \"at least I believe\", because both involve commitment to the truth."],
["Why does \"Then you don't believe\" make no sense as a reply?","Belief needs no objectively good reasons; the natural reply is \"then you ought not to believe\"."],
["What is evidentialism and its problem?","Always have good evidence for beliefs (Clifford). It generates a vicious infinite regress of reasons for reasons."]
],
"Week 7": [
["What is the difference between an objective and a personal commitment to truth?","\"I know\" claims a public standard of good grounds; \"I believe\" only needs to satisfy oneself."],
["Complete Austin's analogy: believing is to intending as knowing is to ...","Promising."],
["What is the \"new plunge\"?","Saying \"I know\" or \"I promise\" gives others your word and entitles them to rely on you."],
["Why is knowing not at the top of the belief scale?","The top of that scale is being sure, a psychological state; knowing is a different line of business."],
["Why can't you say \"I know it, but I might be wrong\"?","Just as you can't say \"I promise, but I may fail\": you'd withdraw your word. That doesn't make knowers infallible."],
["What is Austin's point about refusing someone's \"I know\"?","It is a special form of insult: it says they cannot be relied on."],
["How is knowledge transmitted by testimony?","If S says \"I know p\" and I believe him, I know p at second hand, unless there is concrete reason to distrust him."],
["What is testimonial injustice (Miranda Fricker)?","Unjustly lowering or denying someone's credibility because of their social group (race, gender, age)."],
["What is the God and faith example?","Claim to know God exists and you face \"how do you know?\"; faith is believing without reason, a personal commitment."],
["What is a practical explication (Craig)?","Hypothesise what the concept does for us, build a concept fit for that role, then compare it with our actual concept."],
["What does Craig say the concept of knowledge is for?","To flag approved informants."],
["Name Craig's three unreliable sources of truth.","Truth by accident (Mudweiser), true lies (the twin), the double bluff (a confession with an alibi)."],
["State Nozick's tracking analysis.","S believes p; p is true; if p were false S would not believe it; if p were true S would believe it."],
["Which premise of the BIV argument does Nozick deny?","If I know I have two hands, I know I'm not a BIV (closure)."],
["Run the Jesse James case.","A bystander sees James's mask slip and knows he robbed the bank, but in a close world the mask didn't slip, so tracking says he doesn't know."],
["What is Craig's diagnosis of Nozick?","Close possible worlds are not the epistemically relevant ones; only worlds where the mask slipped matter to the inquirer."],
["What is the point of Austin's pig?","When the pig comes into view you don't gain more evidence, you just see it: knowledge is not evidence piled high."],
["How do Austin and Craig fit together?","Craig gives the function (flag informants), Austin the mechanism (giving your word in testimony)."]
],
"Week 8": [
["What did Pyrrhonists aim for, and how?","Tranquillity (ataraxia) through suspending belief, by finding equally good reasons for p and not p (equipollence)."],
["Who are dogmatists, negative dogmatists and Pyrrhonists?","Dogmatists (Plato) claim truths; negative dogmatists (Academic sceptics) claim there is no knowledge; Pyrrhonists claim nothing and keep inquiring."],
["What are the three horns of Agrippa's Trilemma?","Infinite regress, circular reasoning, and ad hoc assumption."],
["Why is the reasons regress vicious?","Entitlement to the original belief is never established, only endlessly deferred."],
["Give a virtuous regress and a virtuous circle.","Adding \"it is true that\" forever; inter definable concepts like description, fact, true proposition."],
["What does foundationalism try, and what's its problem?","Stop the regress with self justifying beliefs (the cogito); there are too few to build on."],
["What does coherentism try, and what's its problem?","Treat justification as a web; there are too many coherent sets of belief."],
["What is a default entitlement?","Being entitled to a belief as a responsible believer within shared practices, until it is appropriately challenged."],
["Give the lecture's legal analogy.","Citizens have default legal rights just by being citizens, which can be lost through treason, renunciation or crime."],
["How is a default entitlement lost and regained?","\"That's not a pig, it's a decoy\" removes it; \"it just oinked\" defeats the challenge."],
["What are Barnes's three humdrum ideas?","Don't plump for p without reason to prefer it; circular reasoning is no good; you can't reason forever."],
["What was Descartes's aim in doubting?","Methodological scepticism: find absolutely certain foundations (scientia) for the new science."],
["What did Descartes call ancient scepticism?","\"Stale cabbage\"."],
["State the meditator's argument.","If I KNOW I have hands I KNOW I'm not dreaming; I don't KNOW I'm not dreaming; so I don't KNOW I have hands."],
["What is the difference between ordinary and metaphysical doubt?","Ordinary doubt is local and checkable (the optometrist); metaphysical doubt is global and can't be checked without begging the question."],
["What are the three essential features of the cogito?","First person, present tense, and mental acts only (not \"I drink\")."],
["Why does Descartes need God?","To guarantee that clear and distinct certainties are true and that the senses are largely reliable."],
["How does ancient scepticism differ from modern?","Ancient is a way of life aiming at tranquillity; modern is an intellectual position doubting the external world while keeping the mind."]
],
"Week 9": [
["Who founded American pragmatism, and what inspired it?","Peirce, James and Dewey, inspired by Darwin, prioritising practice and the agent's view."],
["Why does Peirce focus on belief rather than knowledge?","To get clear on belief and doubt first, setting aside the need to show knowledge worthy grounds."],
["State Peirce's convergence theory of truth.","Truth is the opinion fated to be agreed by all who investigate; its object is the real."],
["What is belief, and what is doubt, for Peirce?","Belief is a calm habit of action; doubt is an irritating, paralysing wavering that drives inquiry."],
["What is the method of tenacity and its problem?","Clinging to your view and ignoring the rest (the ostrich); others no less reasonable disagree."],
["What is the method of authority and its problem?","An institution imposes belief; we become intellectual slaves and see other cultures believe differently."],
["What is the a priori method and its problem?","Free metaphysical reasoning; systems become a matter of taste with no way to settle disputes."],
["Why is the scientific method best?","It alone fits the realist hypothesis of a mind independent reality and separates right from wrong ways to truth."],
["What is Neurath's boat?","Revising beliefs is like repairing a boat at sea: you fix planks while relying on the rest."],
["What is paper doubt?","Pretended philosophical doubt with no real reason; real doubt needs a positive reason."],
["Quote Peirce's line against Descartes.","\"Let us not pretend to doubt in philosophy what we do not doubt in our hearts.\""],
["What is a pro tanto reason?","A reason that counts in favour of an action but can be outweighed."],
["What is wrong with the desire satisfaction theory of wellbeing?","Some desires, if satisfied, wreck your wellbeing, such as spending everything now and leaving your future self poor."],
["Distinguish numerical and qualitative identity.","Numerical: one and the same thing (Clark Kent and Superman). Qualitative: exactly alike (identical twins)."],
["What is endurantism?","The very same object exists wholly at different times."],
["What is the soul view of personal identity?","You are your immaterial soul; you survive just in case it does."],
["What is Weirob's chocolates argument?","You learn swirl means caramel by biting chocolates; you can never \"bite into\" a soul, so same body can't show same soul."],
["What is the Blue River argument?","You recognise the river by similar water, yet it's different water each time; similar psychology doesn't require the same soul."],
["What is the HAZON point?","An undetectable thing separate from my body and mind is not something I'd identify with or care about."]
],
"Week 10": [
["Run the doubled teletransporter case.","It makes two of you at A and C, both to be tortured; you'd still pay $500 to prevent it for prudential reasons."],
["Why can't you be identical with both A and C?","Identity is transitive: if you = A and you = C then A = C, but they are two people."],
["What follows about identity and prudence?","You still have prudential reason with no future self identical with you, so identity does not ground prudence."],
["What is the problem of change for identity?","Freddie is tired at t and not tired at t1; identical things share all properties."],
["What is perdurantism?","People are extended in time by having numerically distinct temporal parts, like spatial parts."],
["What is psychological connectedness?","Direct similarity of beliefs, memories, values and plans between nearby selves; it comes in degrees."],
["Why is connectedness not enough to make a self?","You're barely connected to your 8 month old self, and more connected to the person next to you."],
["What is psychological continuity?","Overlapping chains of connectedness linking selves; it does not come in degrees."],
["What do the two views say about the brain wipe?","Psychological: I wake in the new body. Bodily: my mind was erased and I stay in the wiped body."],
["What do the two views say about teletransportation?","Psychological: you survive. Bodily: you die and a clone is made."],
["What is the non branching clause?","Continuity only counts as identity if it doesn't branch into two, which seems ad hoc."]
],
"Week 11": [
["Why does psychological similarity alone fail?","An evil scientist's twin or a 7000 year fluke duplicate shares your psychology but isn't you."],
["What fixes it?","Require causal connection: the duplicate's memory of swimming wasn't caused by your swimming."],
["Why can't the whole perduring self be the seat of decision?","It has inconsistent beliefs and desires (raining and not raining), so it can't deliberate; the current little self does."],
["What is the savings problem?","A 5 minute self won't see the savings, and being parts of one whole, like parts of a university, gives no prudential reason."],
["What is Humeanism about reasons?","Your reasons depend on your desires and beliefs; desires are not rational or irrational."],
["What two sources of reasons does a current self have to care about future selves?","Anticipation of their experiences, and projects that need a consortium of selves."],
["Why does self vs other become a difference of degree?","I can have the same kind of reason to promote your future wellbeing; I'm just more connected to my own selves."],
["What is constitutive reductionism (Parfit)?","A person is distinct from body and experiences but consists in them, like a statue and its bronze."],
["What is an empty question?","One we can't answer though we know all the facts, such as whether the 50% replaced person is me."],
["What is Relation R?","Psychological continuity and connectedness, which Parfit says is what matters."],
["State Parfit's argument from below.","Identity just consists in other facts; only those facts can matter; so identity can't matter in itself."],
["What is realism about importance?","What matters is reality, not how it is described; whether he is \"me\" adds no fact."],
["Run My Division.","Each half of my brain goes into a new body; both are like me, neither can be me, yet nothing that matters is missing."],
["What is the triplets analogy?","Children who need a twin are fine as triplets; what matters is a sibling, as what matters is continuity, not identity."],
["What are Kind's extreme and moderate claims?","Extreme: reductionism gives no reason for special concern. Moderate: Relation R does give such reason."],
["What is Kind's principle (C)?","Theories of personal identity are relevant to justifying special concern, but needn't justify it."],
["How does Kind split Wolf's question?","Q1n: why care for my present self? Q2n: why care for my future self? Identity theory bears on Q2n."]
],
"Week 12": [
["What are Dennett's three location principles?","Where Hamlet (body) goes; where Yorick (brain) goes; wherever he thinks he is (his point of view)."],
["Who is Hubert?","A computer duplicate of Dennett's brain run in parallel, switchable with Yorick to drive Fortinbras."],
["How does Dennett's story end?","He flips the switch and the other Dennett speaks: the brains had drifted out of sync and the other was trapped."],
["What is Parfit's Complex vs Simple View?","Complex: identity consists in continuities, like ships or nations. Simple: identity is a further, all or nothing fact."],
["What is the Equal Concern Claim?","A rational person should be equally concerned about all parts of his future (Sidgwick)."],
["What is Parfit's principle (B)?","When an important relation holds to a lesser degree, it is not irrational to think it less important."],
["Why is Parfit's discount rate not about time?","It tracks weakening connectedness, so it barely applies over 5 minutes or 5 days, only over decades."],
["What does Parfit suggest morality should do?","Annex what prudence abandons: it may be wrong to burden your future self for smaller gains now."],
["Define time bias.","All else fixed, preferences sensitive to where in time events are located."],
["Define near bias and future bias.","Near: good things sooner, bad later. Future: good things in the future, bad in the past."],
["What is the hospital case?","Most prefer a painful operation was yesterday rather than tomorrow, even a 10 hour one vs 1 hour."],
["What is Future Tuesday Indifference?","Not caring about pains on future Tuesdays; a brute, arbitrary preference, so irrational."],
["State the non arbitrariness argument against near bias.","Rational preferences ignore arbitrary differences; distance from now is arbitrary; so near bias is impermissible."],
["What is the connectedness argument for near bias?","Self concern rests on connectedness, which comes in degrees and falls with distance, so discount the future."],
["What does Carrie's Crossfit case show?","If past pain counts for nothing she can never finish her workout, so future bias seems irrational."]
],
"Week 13": [
["What do time neutralists claim?","Time biased preferences, including future bias, are rationally impermissible."],
["What is the temporal metaphysics defence of future bias?","If time really passes, past events are over and done, which might justify future bias."],
["What is the causal inaccessibility explanation?","We evolved to care less about the past because we can't affect it; it explains but doesn't justify."],
["What is the first person vs third person asymmetry?","We're future biased about our own pain but time neutral about others', so first person bias looks irrational."],
["Run Dougherty's pain pump.","A risk averse, future biased agent takes a help early and a help late pill and ends up with one extra minute of pain for nothing."],
["What is Greene and Sullivan's scheduling problem?","Future biased Billy insists on riding second to avoid regret, which seems irrational."],
["What is the meagre returns problem?","An absolutely future biased agent waits an hour for less than one cookie to avoid regret."],
["Why does it matter whether future bias is a tiebreaker?","Only if it is stronger than a tiebreaker do the exploitation arguments bite, and evidence suggests it often is."]
]

"The analogy shows the cost: like promising while intending not to, it's insincere or self deceived.",
"Objection: both are truth commitments, so it's incoherent (Moorean). Reply: the absurdity is in asserting both, not being in both states (the fearful flyer).",
"Conclude."]},
{w:"Week 8",q:"What is Agrippa's Trilemma? Does it involve a vicious infinite regress?",o:[
"Context: Pyrrhonism, suspension of belief, ataraxia; three of Agrippa's Five Modes.",
"The three horns: regress, circle, ad hoc assumption; why each confers no entitlement (Barnes's reconstruction).",
"Virtuous vs vicious: \"it is true that\" regress vs the reasons regress, where entitlement is endlessly deferred.",
"So yes, given its assumption, the regress is vicious.",
"Foundationalism (too few foundations) and coherentism (too many webs).",
"Better: deny that entitlement always needs an independent reason. Default entitlements, citizenship analogy, the decoy pig.",
"Objection from Barnes's humdrum ideas; reply; conclude."]},
{w:"Week 9",q:"How do Pragmatists respond to Descartes's Evil Demon Hypothesis? Do you agree with their response? Why/why not?",o:[
"The hypothesis and the meditator's argument (scientia).",
"Pragmatist basics: belief as habit, doubt as irritation, inquiry aims at settled opinion.",
"The demon gives only paper doubt; we cannot begin with complete doubt; real doubt needs a positive reason (decoy factory).",
"Inquiry is social and has no pure form (\"facts about what?\").",
"Fallibilist but anti sceptical; Neurath's boat.",
"Objection: changes the subject. Reply: relevant doubts (Austin, Craig); Descartes calls his doubt metaphysical.",
"Verdict."]},
{w:"Week 10",q:"What is the soul view of personal identity and how does it differ from the psychological continuity view? Do you agree with either of the views? Why/why not?",o:[
"Frame: what makes a future self mine? Identity, numerical vs qualitative.",
"Soul view: you are your soul; survive iff it does; not your body.",
"Psychological continuity: chains of connections plus the right causal links.",
"Differences: detectable vs not; degrees vs all or nothing; tied to what we care about; can branch.",
"Against the soul view: Weirob's chocolates and Blue River; the HAZON.",
"Against continuity: duplicates (causal fix) and fission (non branching looks ad hoc).",
"Verdict, perhaps with Parfit's twist that identity isn't what matters."]},
{w:"Week 10",q:"How would you respond to the teletransporter case? Argue for your case with reference to the views discussed in class.",o:[
"Describe the case (scan, destroy, rebuild).",
"Soul view: no usable answer. Bodily: you die. Psychological: you survive.",
"The doubled version: transitivity means you can't be both, so neither; yet you'd still pay the $500.",
"So identity isn't what matters; the single case has everything that matters (Parfit, My Division).",
"Objection: it feels like death. Reply: you care about continuity, not matter.",
"Your verdict: step in or not, and on which view."]},
{w:"Week 11",q:"What is a reason to think that it is not whole perduring persons that count as being rational or not? Do you agree or disagree? Why/why not?",o:[
"Perdurantism: a big self of distinct little selves linked by continuity.",
"The reason: the whole has inconsistent beliefs and desires, so it can't deliberate; the current little self is the seat of decision.",
"Consequence: the savings problem; parts of a university.",
"Humean answer: anticipation and projects give the current self reasons; self vs other is a matter of degree.",
"Agree: fits assessment at a time and Parfit. Disagree: plans, promises and lifelong projects seem to belong to whole persons.",
"Link to time bias: connectedness discounting; conclude."]},
{w:"Week 12",q:"Is it rational to be time biased (near biased or future biased)? Answer with reference to the course content.",o:[
"Define time bias, near bias, future bias (hospital and party cases).",
"Against near bias: non arbitrariness (Future Tuesday, beans); life going well (life store).",
"For near bias: connectedness comes in degrees (Parfit, principle B).",
"Assess: connectedness justifies discounting decades, not days.",
"Future bias: over and done with vs arbitrariness, Carrie, Dougherty's pain pump, scheduling problem.",
"Passage and causal inaccessibility explain more than justify; tiebreaker evidence.",
"Verdict."]}
];

function addXP(n){
  const before=levelOf(S.xp||0); S.xp=(S.xp||0)+n; save(); renderXP();

function laurels(n){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  for(let i=0;i<n;i++){ const s=document.createElement("span"); s.textContent=bits[i%bits.length];
    s.style.left=Math.random()*100+"vw"; s.style.animationDelay=(Math.random()*.6)+"s"; s.style.fontSize=(14+Math.random()*14)+"px";
    s.style.setProperty("--dx",(Math.random()*120-60)+"px"); box.appendChild(s); }

}

/* ---------- flashcards (Leitner) ---------- */
const fc = {sel:new Set(WEEKS), queue:[], cur:null, done:0, flipped:false};
function buildQueue(){
  const items=[];
  fc.sel.forEach(w=>DECK[w].forEach((c,i)=>items.push([w,i])));
  // weaker cards appear more; mastered cards appear once in a while
  let q=[];
  items.forEach(([w,i])=>{ const b=boxOf(w,i); const n = b===3?0:(b===2?1:2); for(let k=0;k<n;k++) q.push([w,i]); if(b===3 && Math.random()<0.25) q.push([w,i]); });
  if(!q.length) q = items.slice();
  // dedupe adjacent
  q = shuffle(q); fc.queue=[]; const seen=new Set();
  q.forEach(x=>{ const k=id(x[0],x[1]); if(!seen.has(k)){seen.add(k); fc.queue.push(x);} });
  fc.done=0; fc.flipped=false; fc.cur=fc.queue.shift()||null;
}
function renderCards(){
  const el=document.getElementById("v-cards"); el.innerHTML="";
  const p=document.createElement("div"); p.className="panel";
  p.innerHTML='<div class="label">Choose weeks</div>';
  p.appendChild(weekChips(fc.sel,()=>{buildQueue();renderCards();}));
  const total = [...fc.sel].reduce((a,w)=>a+DECK[w].length,0);
  const mastered = [...fc.sel].reduce((a,w)=>a+DECK[w].filter((c,i)=>boxOf(w,i)===3).length,0);
  const bar=document.createElement("div");
  bar.innerHTML=`<div class="row" style="justify-content:space-between"><span class="muted">${mastered} of ${total} cards mastered ${fc.streak?`<span class="streak">🔥 ${fc.streak} streak</span>`:""}</span><span class="muted">${fc.queue.length+(fc.cur?1:0)} left this round</span></div><div class="bar" style="margin-top:6px"><i style="width:${total?mastered/total*100:0}%"></i></div>`;
  p.appendChild(bar);
  if(!fc.cur){
    const d=document.createElement("div"); d.style.marginTop="18px";
    d.innerHTML = fc.sel.size? '<p class="qtext">Round complete.</p><p class="muted">Cards you missed will come back more often next round.</p>' : '<p class="muted">Pick at least one week.</p>';
    if(fc.sel.size){ const b=document.createElement("button"); b.className="btn"; b.textContent="Start another round"; b.onclick=()=>{buildQueue();renderCards();}; d.appendChild(b); }
    p.appendChild(d); el.appendChild(p); return;
  }
  const [w,i]=fc.cur; const [q,a]=DECK[w][i]; const b=boxOf(w,i);
  const lvl=["New","Learning","Almost","Mastered"][b];
  const card=document.createElement("div"); card.className="card"+(fc.flipped?" flip":"");
  card.style.cssText=wstyle(w);
  card.innerHTML=`<div class="card-in"><div class="face front"><span class="sym">${WSYM[w]}</span><span class="tag">${w} · ${WTOP[w]} · ${lvl}</span><div class="q">${esc(q)}</div><span class="hint">Tap or press space to flip</span></div><div class="face back"><span class="sym">${WSYM[w]}</span><span class="tag">${w} · ${WTOP[w]}</span><div class="a">${esc(a)}</div></div></div>`;
  card.onclick=()=>{fc.flipped=!fc.flipped; card.classList.toggle("flip",fc.flipped); actions.classList.toggle("hide",!fc.flipped); prompt.classList.toggle("hide",fc.flipped);};
  p.appendChild(card);
  const prompt=document.createElement("p"); prompt.className="muted"+(fc.flipped?" hide":""); prompt.textContent="Say your answer out loud first, then flip.";
  p.appendChild(prompt);
  const actions=document.createElement("div"); actions.className="row"+(fc.flipped?"":" hide");
  const again=document.createElement("button"); again.className="btn bad"; again.textContent="Missed it";
  const close=document.createElement("button"); close.className="btn ghost"; close.textContent="Partly";
  const got=document.createElement("button"); got.className="btn good"; got.textContent="Got it";
  again.onclick=()=>grade(0); close.onclick=()=>grade(1); got.onclick=()=>grade(2);
  actions.append(again,close,got); p.appendChild(actions);
  const k=document.createElement("div"); k.className="kbd"; k.textContent="Keys: space flip · 1 missed · 2 partly · 3 got it"; p.appendChild(k);
  el.appendChild(p);
}
function grade(g){
  const [w,i]=fc.cur; const k=id(w,i); let b=S.box[k]||0;
  if(g===0){ b=1; fc.queue.splice(Math.min(3,fc.queue.length),0,[w,i]); }
  else if(g===1){ b=Math.max(1,Math.min(2,b)); fc.queue.splice(Math.min(8,fc.queue.length),0,[w,i]); }
  else { b=Math.min(3,b+1); }
  S.box[k]=b; save(); if(window.hamReact) hamReact(g!==0); addXP(g===2?10:g===1?5:1); fc.streak=g===2?(fc.streak||0)+1:0; if(fc.streak&&fc.streak%10===0) laurels(24); fc.done++; fc.flipped=false; fc.cur=fc.queue.shift()||null; renderCards();
}
document.addEventListener("keydown",e=>{
  if(document.getElementById("v-cards").classList.contains("hide")||!fc.cur) return;
  if(e.target.tagName==="TEXTAREA") return;
  if(e.code==="Space"){ e.preventDefault(); document.querySelector("#v-cards .card")?.click(); }
  if(fc.flipped){ if(e.key==="1")grade(0); if(e.key==="2")grade(1); if(e.key==="3")grade(2); }
});

  if(qz.n>=qz.items.length){
    const pct=Math.round(qz.score/qz.items.length*100); if(!qz.celebrated){ qz.celebrated=true; if(pct>=80) laurels(36); }
    p.innerHTML=`<div class="label">Finished</div><div class="score">${qz.score} / ${qz.items.length}</div><p class="muted">${pct>=80?"Strong. Try an essay drill next.":pct>=50?"Getting there. Run flashcards on the weeks you missed.":"Worth another flashcard round before trying again."}</p>`;
    const r=document.createElement("div"); r.className="row";
    const a=document.createElement("button"); a.className="btn"; a.textContent="Same weeks again"; a.onclick=startQuiz;
    const b=document.createElement("button"); b.className="btn ghost"; b.textContent="Change weeks"; b.onclick=()=>{qz.items=[];renderQuiz();};
    r.append(a,b); p.appendChild(r); el.appendChild(p); return;
  }
  const it=qz.items[qz.n]; p.classList.add("qpanel"); p.style.cssText=wstyle(it.w);
  p.innerHTML=`<div class="row" style="justify-content:space-between"><span class="label"><span class="qtag">${it.w} · ${WTOP[it.w]}</span> · Question ${qz.n+1} of ${qz.items.length}</span><span class="muted">Score ${qz.score}</span></div><div class="bar" style="margin-top:8px"><i style="width:${qz.n/qz.items.length*100}%;background:var(--accent)"></i></div><p class="qtext">${esc(it.q)}</p>`;
  const opts=document.createElement("div"); opts.className="opts";
  it.opts.forEach(o=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=o;
    b.onclick=()=>{ if(qz.answered) return; qz.answered=true; const ok=o===it.a; if(ok) qz.score++;
      const rec=S.quiz[it.w]||{c:0,t:0}; rec.t++; if(ok) rec.c++; S.quiz[it.w]=rec;
      save(); if(window.hamReact) hamReact(ok); if(ok) addXP(15);
      [...opts.children].forEach(x=>{ x.disabled=true; if(x.textContent===it.a) x.classList.add("right"); else if(x===b) x.classList.add("wrong"); });
      next.classList.remove("hide"); };
    opts.appendChild(b); });
  p.appendChild(opts);
  const next=document.createElement("button"); next.className="btn hide"; next.textContent=qz.n+1<qz.items.length?"Next":"See score";
  next.onclick=()=>{qz.n++; qz.answered=false; renderQuiz();};
  p.appendChild(next); el.appendChild(p);
}

const essayState={active:null, t:0, timer:null, mins:12};
function renderEssayList(){
  clearInterval(essayState.timer); essayState.active=null;
  const el=document.getElementById("v-essay"); el.innerHTML="";
  const p=document.createElement("div"); p.className="panel";
  p.innerHTML='<div class="label">Brigitte\'s practice questions</div><p class="muted" style="margin:6px 0 0">The exam is four short essays. Plan an answer against the clock, write the plan, then compare it with the model outline. Thesis first, then exposition, argument, objection, reply, conclusion.</p>';
  const r=document.createElement("div"); r.className="row"; r.style.marginTop="12px";
  r.innerHTML='<span class="muted">Timer:</span>';
  [5,12,30].forEach(n=>{const b=document.createElement("button"); b.className="chip"+(essayState.mins===n?" on":""); b.textContent=n+" min"+(n===5?" plan":n===12?" outline":" full answer"); b.onclick=()=>{essayState.mins=n;renderEssayList();}; r.appendChild(b);});
  p.appendChild(r);
  const list=document.createElement("div"); list.className="esq";
  ESSAYS.forEach((e,i)=>{ const b=document.createElement("button"); b.className="opt"; b.innerHTML=`<span class="label">Q${i+1} · ${e.w}</span><br>${esc(e.q)}`; b.onclick=()=>startEssay(i); list.appendChild(b); });
  const rnd=document.createElement("button"); rnd.className="btn"; rnd.style.marginTop="14px"; rnd.textContent="Random question"; rnd.onclick=()=>startEssay(Math.floor(Math.random()*ESSAYS.length));
  p.append(list,rnd); el.appendChild(p);
}
function fmt(s){ const m=Math.floor(s/60), x=s%60; return m+":"+String(x).padStart(2,"0"); }
function startEssay(i){
  const e=ESSAYS[i]; essayState.active=i; essayState.t=essayState.mins*60;
  const el=document.getElementById("v-essay"); el.innerHTML="";
  const p=document.createElement("div"); p.className="panel";
  let draft=""; draft=lsGet(dkey(i))||"";
  p.innerHTML=`<div class="row" style="justify-content:space-between"><span class="label">Q${i+1} · ${e.w}</span><span class="timer" id="tm">${fmt(essayState.t)}</span></div><p class="qtext">${esc(e.q)}</p><p class="muted">Write your thesis, the views you'll use, your objection and reply.</p>`;
  const ta=document.createElement("textarea"); ta.value=draft; ta.placeholder="Thesis:\n1.\n2.\nObjection:\nReply:\nConclusion:";
  ta.oninput=()=>lsSet(dkey(i), ta.value);
  p.appendChild(ta);
  const r=document.createElement("div"); r.className="row"; r.style.marginTop="12px";
  const rev=document.createElement("button"); rev.className="btn"; rev.textContent="Reveal model outline";
  const back=document.createElement("button"); back.className="btn ghost"; back.textContent="All questions"; back.onclick=renderEssayList;
  r.append(rev,back); p.appendChild(r);
  const out=document.createElement("div"); out.className="hide"; out.style.marginTop="16px";
  out.innerHTML='<div class="label">Model outline · tick what your plan covered</div>'+e.o.map((x,k)=>`<label class="check"><input type="checkbox" data-k="${k}"> <span>${esc(x)}</span></label>`).join("")+'<p class="muted" id="cov" style="margin-top:8px"></p>';
  out.addEventListener("change",()=>{ const c=out.querySelectorAll("input:checked").length; out.querySelector("#cov").textContent=`You covered ${c} of ${e.o.length} points.`+(c===e.o.length?" Excellent.":""); if(c===e.o.length&&!out.dataset.c){out.dataset.c=1; laurels(30);} });
  rev.onclick=()=>{ out.classList.remove("hide"); rev.disabled=true; clearInterval(essayState.timer); addXP(40); };
  p.appendChild(out); el.appendChild(p);
  clearInterval(essayState.timer);
  essayState.timer=setInterval(()=>{ essayState.t--; const tm=document.getElementById("tm"); if(!tm){clearInterval(essayState.timer);return;}
    tm.textContent=fmt(Math.max(0,essayState.t)); tm.classList.toggle("low",essayState.t<=60);
    if(essayState.t<=0){ clearInterval(essayState.timer); tm.textContent="Time"; } },1000);
}

function saveProfiles(){ lsSet(PKEY, JSON.stringify(PROFILES)); }
function cleanName(n){ return (n||"").trim().replace(/\s+/g," ").slice(0,24); }
function rerenderAll(){
  renderXP(); buildQueue(); renderCards(); qz.items=[]; renderQuiz(); renderSummary();
  if(!document.getElementById("v-progress").classList.contains("hide")) renderProgress();
  if(!document.getElementById("v-match").classList.contains("hide")) renderMatch(false);

function useProfile(n){ CUR=n; lsSet(CKEY,n); S=loadS(n); fc.streak=0; rerenderAll(); if(window.hamSay) hamSay("Welcome, "+esc(n)+"! 🍭",2600); }
function addProfile(n){
  n=cleanName(n); if(!n) return "Type a name first.";
  if(PROFILES.some(p=>p.toLowerCase()===n.toLowerCase())) return "That name is taken on this device.";
  PROFILES.push(n); saveProfiles();
  if(!PROFILES.length || PROFILES.length===1){ const legacy=lsGet(KEY); if(legacy && !lsGet(profKey(n))) lsSet(profKey(n), legacy); }
  useProfile(n); return "";
}
function delProfile(n){ PROFILES=PROFILES.filter(p=>p!==n); saveProfiles(); lsDel(profKey(n)); for(let i=0;i<ESSAYS.length;i++) lsDel(profKey(n)+"-draft-"+i); if(CUR===n){ CUR=null; lsDel(CKEY); S=blankS(); if(PROFILES.length) useProfile(PROFILES[0]); else { rerenderAll(); openProfiles(true); } } }
function exportCode(){ const json=JSON.stringify({v:1,name:CUR,s:S}); return "PHIL1013-"+btoa(unescape(encodeURIComponent(json))); }
function importCode(code){
  code=(code||"").trim(); if(!code.startsWith("PHIL1013-")) return "That doesn't look like a backup code.";
  let d; try{ d=JSON.parse(decodeURIComponent(escape(atob(code.slice(9))))); }catch(e){ return "The code is incomplete or damaged. Copy the whole thing."; }
  if(!d||!d.s||!d.name) return "The code is missing progress data.";
  let n=cleanName(d.name)||"Imported";
  if(!PROFILES.includes(n)){ PROFILES.push(n); saveProfiles(); }
  lsSet(profKey(n), JSON.stringify(Object.assign(blankS(), d.s)));
  useProfile(n); return "";
}

  WEEKS.forEach(w=>{ const n=DECK[w].length; const m=DECK[w].filter((c,i)=>boxOf(w,i)===3).length; const seen=DECK[w].filter((c,i)=>boxOf(w,i)>0).length; const qr=S.quiz[w];
    const d=document.createElement("div"); d.className="stat"; d.style.cssText=wstyle(w);
    d.innerHTML=`<b>${WSYM[w]} ${w}</b> <small>${WTOP[w]}</small><div class="bar" style="margin:8px 0 6px"><i style="width:${m/n*100}%"></i></div><small>${m}/${n} mastered · ${seen} seen${qr?` · quiz ${Math.round(qr.c/qr.t*100)}%`:""}</small>`;
    d.style.cursor="pointer"; d.onclick=()=>{ fc.sel=new Set([w]); buildQueue(); renderCards(); show("cards"); };
    g.appendChild(d); });
  p.appendChild(g);
  const r=document.createElement("div"); r.className="row"; r.style.marginTop="16px";
  const pb=document.createElement("button"); pb.className="btn"; pb.textContent="Profiles and backup code"; pb.onclick=()=>openProfiles(false); r.appendChild(pb);
  const reset=document.createElement("button"); reset.className="btn ghost"; reset.textContent="Reset my progress";
  let armed=false;
  reset.onclick=()=>{ if(!armed){armed=true; reset.textContent="Tap again to confirm"; return;} S=blankS(); save(); renderXP(); buildQueue(); renderProgress(); };
  r.appendChild(reset); p.appendChild(r);
  el.appendChild(p);
}

renderXP(); buildQueue(); renderCards(); renderQuiz(); renderSummary();
if(!CUR){ if(PROFILES.length) useProfile(PROFILES[0]); else openProfiles(true); }
</script>

<script>
(function(){
  const img=document.getElementById("hamImg"), say=document.getElementById("hamSay");
  let streak=0, taps=0, hideT;
  const TAP=[
    "Thesis first. Always answer the actual question.",
    "Every essay needs an objection AND a reply.",
    "Knowledge is like promising. Belief is like intending. (Austin)",
    "Accidentally justified true belief isn't knowledge. (Gettier)",
    "Let us not pretend to doubt in philosophy what we do not doubt in our hearts.",
    "Identity is transitive. Two of you can't both be you.",
    "Connectedness comes in degrees. Continuity doesn't.",
    "True beliefs run away unless you tie them down. Like me with this lollipop.",
    "The banality is in the doer, not the deed.",
    "Default entitlements: non arbitrary, but not self justifying.",
    "Four short essays. Use both sections.",
    "Squeak. You've got this."
  ];
  const GOOD=["Yes!","Nailed it.","Daedalus would be proud.","Fastened by a chain!","Big brain energy.","Socrates approves."];
  const BAD=["Next time!","That one's coming back.","Even Descartes doubted.","Fallibilism, baby.","Neurath's boat: patch and sail on."];
  function play(cls){ img.classList.remove("hop","spin","shake"); void img.offsetWidth; img.classList.add(cls); }
  function speak(t,ms){ clearTimeout(hideT); say.innerHTML=t; say.classList.add("show"); hideT=setTimeout(()=>say.classList.remove("show"),ms||3200); }
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  img.addEventListener("click",()=>{ taps++;
    if(taps%10===0){ play("spin"); speak("That's "+taps+" boops. Shouldn't you be studying? 🍭"); }
    else { play("hop"); speak(pick(TAP)); } });
  window.hamSay=speak;
  window.hamReact=function(ok){
    if(ok){ streak++; play(streak%5===0?"spin":"hop"); if(streak%5===0) speak(streak+" in a row! 🍭<span class=\"count\">Streak</span>",2600); else if(Math.random()<.35) speak(pick(GOOD),1600); }
    else { streak=0; play("shake"); if(Math.random()<.5) speak(pick(BAD),1800); }
  };
  setTimeout(()=>{ if(CUR) speak("Hi "+esc(CUR)+"! Tap me for tips."); },900);
})();
</script>
